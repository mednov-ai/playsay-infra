controller:
  jenkinsUrl: https://jenkins.ops.honey.school/
  serviceType: NodePort
  nodePort: 32082
  servicePort: 8080
  installPlugins:
    - kubernetes
    - workflow-aggregator
    - git
    - github
    - github-branch-source
    - credentials-binding
    - configuration-as-code
    - timestamper
    - pipeline-stage-view
    - generic-webhook-trigger
    - dark-theme
    - oic-auth:4.715.vf202e4229f61
    - matrix-auth:3.3
  overwritePlugins: true
  additionalExistingSecrets:
    - name: playsay-jenkins-credentials
      keyName: github-token
    - name: playsay-jenkins-credentials
      keyName: github-username
    - name: playsay-jenkins-credentials
      keyName: webhook-token
    - name: playsay-jenkins-credentials
      keyName: dev-kubeconfig-b64
    - name: playsay-workforce-jenkins-oidc
      keyName: client-id
    - name: playsay-workforce-jenkins-oidc
      keyName: client-secret
    - name: playsay-workforce-jenkins-oidc
      keyName: escape-hatch-username
    - name: playsay-workforce-jenkins-oidc
      keyName: escape-hatch-secret
  JCasC:
    defaultConfig: true
    overwriteConfiguration: true
  resources:
    requests:
      cpu: 250m
      memory: 768Mi
    limits:
      cpu: 1500m
      memory: 2Gi

agent:
  containerCap: 4
  instanceCap: 4
  garbageCollection:
    enabled: true
    namespaces: jenkins
    timeout: 300
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 300m
      memory: 384Mi

persistence:
  enabled: true
  size: 16Gi

networkPolicy:
  enabled: false
