credentials:
  system:
    domainCredentials:
      - credentials:
          - usernamePassword:
              id: github-ghcr
              description: GitHub and GHCR token; source is the CI Kubernetes Secret
              scope: GLOBAL
              username: "${playsay-jenkins-credentials-github-username}"
              password: "${playsay-jenkins-credentials-github-token}"
          - usernamePassword:
              id: github-infra-token
              description: GitHub infra repository token; source is the CI Kubernetes Secret
              scope: GLOBAL
              username: "${playsay-jenkins-credentials-github-username}"
              password: "${playsay-jenkins-credentials-github-token}"
          - string:
              id: github-webhook-token
              description: Random Generic Webhook Trigger token; source is the CI Kubernetes Secret
              scope: GLOBAL
              secret: "${playsay-jenkins-credentials-webhook-token}"
          - file:
              id: dev-kubeconfig
              description: Scoped dev-only kubeconfig; no production access
              scope: GLOBAL
              fileName: dev-kubeconfig
              secretBytes: "${playsay-jenkins-credentials-dev-kubeconfig-b64}"
