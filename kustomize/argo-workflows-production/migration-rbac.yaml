apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: release-migration-jobs
  namespace: playsay-prod
rules:
  - apiGroups:
      - batch
    resources:
      - jobs
    verbs:
      - create
      - get
      - watch
      - delete
  - apiGroups:
      - ""
    resources:
      - configmaps
    verbs:
      - create
      - get
      - delete
  - apiGroups:
      - ""
    resources:
      - pods
      - pods/log
    verbs:
      - get
      - list
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: release-migration-jobs
  namespace: playsay-prod
subjects:
  - kind: ServiceAccount
    name: release-migrator
    namespace: playsay-release-system
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: release-migration-jobs
