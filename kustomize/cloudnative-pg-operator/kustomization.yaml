apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - https://github.com/cloudnative-pg/cloudnative-pg/config/default?ref=v1.29.1

images:
  - name: controller
    newName: ghcr.io/cloudnative-pg/cloudnative-pg
    newTag: 1.29.1

patches:
  - target:
      kind: Deployment
      name: cnpg-controller-manager
      namespace: cnpg-system
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/env/0/value
        value: ghcr.io/cloudnative-pg/cloudnative-pg:1.29.1
      - op: replace
        path: /spec/template/spec/containers/0/args/2
        value: --max-concurrent-reconciles=2
      - op: replace
        path: /spec/template/spec/containers/0/resources/requests/cpu
        value: 100m
      - op: replace
        path: /spec/template/spec/containers/0/resources/requests/memory
        value: 128Mi
      - op: replace
        path: /spec/template/spec/containers/0/resources/limits/cpu
        value: 500m
      - op: replace
        path: /spec/template/spec/containers/0/resources/limits/memory
        value: 256Mi
      - op: replace
        path: /spec/template/spec/containers/0/livenessProbe/timeoutSeconds
        value: 5
      - op: replace
        path: /spec/template/spec/containers/0/readinessProbe/timeoutSeconds
        value: 5
      - op: replace
        path: /spec/template/spec/containers/0/startupProbe/timeoutSeconds
        value: 5
      - op: replace
        path: /spec/template/spec/containers/0/startupProbe/failureThreshold
        value: 18
