apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - https://github.com/cloudnative-pg/cloudnative-pg/config/default?ref=v1.29.1

images:
  - name: controller
    newName: ghcr.io/cloudnative-pg/cloudnative-pg
    newTag: 1.29.1

patches:
  - target:
      kind: Deployment
      name: cnpg-controller-manager
      namespace: cnpg-system
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/env/0/value
        value: ghcr.io/cloudnative-pg/cloudnative-pg:1.29.1
