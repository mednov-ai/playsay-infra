apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: playsay-ci-argocd-reader
  namespace: argocd
rules:
  - apiGroups:
      - argoproj.io
    resources:
      - applications
    resourceNames:
      - ai-tutor-service
      - api-gateway
      - collaboration-service
      - email-service
      - keyboard-app
      - keyboard-service
      - keycloak
      - media-service
      - game-adapter-service
      - payment-service
      - registration-service
      - vocabulary-service
      - web-app
      - worksheet-import-service
    verbs:
      - get
      - patch
      - watch
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: playsay-ci-argocd-reader
  namespace: argocd
subjects:
  - kind: ServiceAccount
    name: playsay-ci-deployer
    namespace: playsay-ci-access
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: playsay-ci-argocd-reader
