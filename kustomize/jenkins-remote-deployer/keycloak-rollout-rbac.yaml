apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: playsay-ci-keycloak-rollout-reader
  namespace: keycloak
rules:
  - apiGroups: [apps]
    resources: [statefulsets]
    resourceNames: [keycloak]
    verbs: [get]
  - apiGroups: [""]
    resources: [pods]
    verbs: [get, list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: playsay-ci-keycloak-rollout-reader
  namespace: keycloak
subjects:
  - kind: ServiceAccount
    name: playsay-ci-deployer
    namespace: playsay-ci-access
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: playsay-ci-keycloak-rollout-reader
