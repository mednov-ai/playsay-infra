apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: playsay-ci-migration-jobs
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups:
          - batch
        apiVersions:
          - v1
        operations:
          - CREATE
          - DELETE
        resources:
          - jobs
  matchConditions:
    - name: dedicated-ci-deployer
      expression: >-
        request.userInfo.username == 'system:serviceaccount:playsay-ci-access:playsay-ci-deployer'
  validations:
    - expression: >-
        request.operation == 'CREATE' ? object.metadata.namespace == 'playsay-dev' && object.metadata.name.startsWith('playsay-migrate-') : oldObject.metadata.namespace == 'playsay-dev' && oldObject.metadata.name.startsWith('playsay-migrate-')
      message: The CI deployer may create or delete only named Play&Say migration Jobs in playsay-dev.
    - expression: >-
        request.operation != 'CREATE' || object.metadata.labels['app.kubernetes.io/name'] == 'playsay-db-migration' && object.metadata.labels['app.kubernetes.io/managed-by'] == 'jenkins'
      message: Migration Job labels are required.
    - expression: >-
        request.operation != 'CREATE' || object.spec.backoffLimit == 0 && object.spec.activeDeadlineSeconds <= 600 && object.spec.template.spec.restartPolicy == 'Never' && object.spec.template.spec.automountServiceAccountToken == false
      message: Migration Jobs must be bounded, non-restarting and have no Kubernetes API token.
    - expression: >-
        request.operation != 'CREATE' || object.spec.template.spec.containers.size() == 1 && object.spec.template.spec.initContainers.size() == 1
      message: Migration Jobs must contain exactly the reviewed Liquibase container and driver init container.
    - expression: >-
        request.operation != 'CREATE' || object.spec.template.spec.containers[0].name == 'liquibase' && object.spec.template.spec.containers[0].image == 'liquibase/liquibase:5.0.3' && object.spec.template.spec.containers[0].command == ['/bin/sh', '/runner/run.sh'] && !has(object.spec.template.spec.containers[0].args)
      message: The Liquibase container command and image are fixed by the dev migration contract.
    - expression: >-
        request.operation != 'CREATE' || object.spec.template.spec.initContainers[0].name == 'postgresql-driver' && object.spec.template.spec.initContainers[0].image == 'curlimages/curl:8.12.1' && object.spec.template.spec.initContainers[0].command == ['/bin/sh', '-ec'] && object.spec.template.spec.initContainers[0].args == ['cp -RL /changelog-source/backend /changelog/ && curl -fsSL https://repo1.maven.org/maven2/org/postgresql/postgresql/42.7.8/postgresql-42.7.8.jar -o /driver/postgresql.jar']
      message: The PostgreSQL driver init container is fixed by the dev migration contract.
    - expression: >-
        request.operation != 'CREATE' || object.spec.template.spec.containers[0].env.size() == 3 && object.spec.template.spec.containers[0].env.all(e, e.name in ['PLAYSAY_DB_JDBC_URL', 'PLAYSAY_DB_USERNAME', 'PLAYSAY_DB_PASSWORD'] && has(e.valueFrom) && has(e.valueFrom.secretKeyRef) && e.valueFrom.secretKeyRef.name in ['playsay-app-db', 'playsay-keyboard-db'] && e.valueFrom.secretKeyRef.key in ['jdbc-uri', 'username', 'password'])
      message: Migration Jobs may consume only the three approved DB keys from the app or keyboard DB secret.
    - expression: >-
        request.operation != 'CREATE' || object.spec.template.spec.volumes.size() == 4 && object.spec.template.spec.volumes.exists(v, v.name == 'runner' && v.configMap.name == 'playsay-liquibase-runner') && object.spec.template.spec.volumes.exists(v, v.name == 'changelog-source' && v.configMap.name.startsWith('playsay-migration-')) && object.spec.template.spec.volumes.exists(v, v.name == 'changelog' && has(v.emptyDir)) && object.spec.template.spec.volumes.exists(v, v.name == 'driver' && has(v.emptyDir))
      message: Migration Jobs may mount only the reviewed runner, generated source and empty changelog and driver volumes.
    - expression: >-
        request.operation != 'CREATE' || (!has(object.spec.template.spec.hostNetwork) || object.spec.template.spec.hostNetwork == false) && (!has(object.spec.template.spec.hostPID) || object.spec.template.spec.hostPID == false) && (!has(object.spec.template.spec.hostIPC) || object.spec.template.spec.hostIPC == false) && object.spec.template.spec.containers.all(c, c.securityContext.allowPrivilegeEscalation == false && c.securityContext.capabilities.drop == ['ALL']) && object.spec.template.spec.initContainers.all(c, c.securityContext.allowPrivilegeEscalation == false && c.securityContext.capabilities.drop == ['ALL'])
      message: Migration Jobs may not use host namespaces or elevated container privileges.
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: playsay-ci-migration-jobs
spec:
  policyName: playsay-ci-migration-jobs
  validationActions:
    - Deny
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: playsay-ci-migration-configmaps
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups:
          - ""
        apiVersions:
          - v1
        operations:
          - CREATE
          - DELETE
        resources:
          - configmaps
  matchConditions:
    - name: dedicated-ci-deployer
      expression: >-
        request.userInfo.username == 'system:serviceaccount:playsay-ci-access:playsay-ci-deployer'
  validations:
    - expression: >-
        request.operation == 'CREATE' ? object.metadata.namespace == 'playsay-dev' && object.metadata.name.startsWith('playsay-migration-') : oldObject.metadata.namespace == 'playsay-dev' && oldObject.metadata.name.startsWith('playsay-migration-')
      message: The CI deployer may create or delete only generated migration ConfigMaps in playsay-dev.
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: playsay-ci-migration-configmaps
spec:
  policyName: playsay-ci-migration-configmaps
  validationActions:
    - Deny
