apiVersion: batch/v1
kind: CronJob
metadata:
  name: playsay-ci-capacity-watchdog
  namespace: jenkins
  labels:
    app.kubernetes.io/part-of: playsay-ci
spec:
  schedule: "* * * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      ttlSecondsAfterFinished: 300
      template:
        metadata:
          labels:
            app.kubernetes.io/part-of: playsay-ci
        spec:
          serviceAccountName: jenkins
          restartPolicy: Never
          containers:
            - name: watchdog
              image: alpine/k8s:1.33.1
              command: ["/bin/sh", "/scripts/watchdog.sh"]
              resources:
                requests:
                  cpu: 10m
                  memory: 24Mi
                limits:
                  cpu: 100m
                  memory: 96Mi
              volumeMounts:
                - name: scripts
                  mountPath: /scripts
                  readOnly: true
          volumes:
            - name: scripts
              configMap:
                name: playsay-ci-capacity-scripts
                defaultMode: 0555
