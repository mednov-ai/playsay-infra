---
- name: Prepare the Play&Say AX41 virtualization host
  hosts: ax41_hosts
  become: true
  gather_facts: true
  vars_files:
    - ../group_vars/ax41_hosts.yaml
  roles:
    - common
    - libvirt-host
    - ax41-vm-scheduling
    - wireguard
    - role: realtime-network
      tags:
        - realtime-network
    - role: ax41-firewall
      tags:
        - ax41-firewall
    - role: wireguard-dns
      tags:
        - wireguard-dns
    - role: edge-proxy
      tags:
        - edge-proxy
    - cockpit
