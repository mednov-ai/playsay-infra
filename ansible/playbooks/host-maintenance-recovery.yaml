---
- name: Quarantine the Selectel executing scheduler without opening its owned barrier
  hosts: rf_edges
  become: true
  gather_facts: false
  any_errors_fatal: true
  tasks:
    - ansible.builtin.assert:
        that: ansible_host == '94.102.89.213'
    - name: Verify or quarantine only the native idle executor
      ansible.builtin.script:
        cmd: "{{ playbook_dir }}/../../scripts/recover-host-maintenance.py {{ '--check' if ansible_check_mode else '--recover' }}"
        executable: /usr/bin/python3
      check_mode: false
      changed_when: not ansible_check_mode
- name: Reconcile the exact supported failed or completed-ungranted step through its existing lease
  hosts: ax41_hosts
  become: true
  gather_facts: false
  any_errors_fatal: true
  tasks:
    - ansible.builtin.assert:
        that: ansible_host == '65.109.55.110'
    - name: Prove native idle, serving health and exact operation before same-owner recovery
      ansible.builtin.script:
        cmd: "{{ playbook_dir }}/../../scripts/recover-host-maintenance.py {{ '--check' if ansible_check_mode else '--recover' }}"
        executable: /usr/bin/python3
      check_mode: false
      changed_when: not ansible_check_mode

- name: Finish only the quarantined Selectel completed-step recovery when selected
  hosts: rf_edges
  become: true
  gather_facts: false
  any_errors_fatal: true
  tasks:
    - name: Read bounded recovery phase
      ansible.builtin.command: /usr/bin/python3 -c "import json; print(json.load(open('/var/lib/honeyschool/maintenance/worker.json')).get('phase'))"
      register: recovery_worker_phase
      changed_when: false
      check_mode: false
    - name: Finish same-owner verified release without replaying native work
      ansible.builtin.script:
        cmd: "{{ playbook_dir }}/../../scripts/recover-host-maintenance.py --finish-selectel"
        executable: /usr/bin/python3
      when: not ansible_check_mode and recovery_worker_phase.stdout == 'recovery_required'
