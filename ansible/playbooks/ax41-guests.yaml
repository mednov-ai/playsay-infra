---
- name: Bootstrap independent Play&Say AX41 k3s guests
  hosts: ax41_guests
  become: true
  gather_facts: true
  vars_files:
    - ../group_vars/ax41_guests.yaml
  pre_tasks:
    - name: Grow the root partition to the OpenTofu-managed disk capacity
      ansible.builtin.shell: |
        set -euo pipefail
        output="$(growpart /dev/vda 1 2>&1)" || {
          grep -q '^NOCHANGE:' <<<"$output" && exit 0
          printf '%s\n' "$output" >&2
          exit 1
        }
        printf '%s\n' "$output"
      args:
        executable: /bin/bash
      register: root_partition_grow
      changed_when: "'CHANGED:' in root_partition_grow.stdout"

    - name: Grow the root filesystem to the partition capacity
      ansible.builtin.command:
        cmd: resize2fs /dev/vda1
      register: root_filesystem_grow
      changed_when: "'Nothing to do' not in root_filesystem_grow.stdout"
  roles:
    - common
    - k3s-server
    - monitoring-agent
    - role: realtime-network
      when: inventory_hostname in ['playsay-prod', 'playsay-dev']
      tags:
        - realtime-network
      vars:
        realtime_reserved_ports: "{{ realtime_guest_profiles[inventory_hostname].reserved_ports }}"
    - role: coturn
      when: inventory_hostname in ['playsay-prod', 'playsay-dev']
      tags:
        - coturn
      vars:
        coturn_listening_port: "{{ realtime_guest_profiles[inventory_hostname].coturn_listening_port }}"
        coturn_min_port: "{{ realtime_guest_profiles[inventory_hostname].coturn_min_port }}"
        coturn_max_port: "{{ realtime_guest_profiles[inventory_hostname].coturn_max_port }}"
        coturn_external_ip: "{{ realtime_guest_profiles[inventory_hostname].coturn_external_ip }}"
        coturn_realm: "{{ realtime_guest_profiles[inventory_hostname].coturn_realm }}"
