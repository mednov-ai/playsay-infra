---
- name: Install the minimal AX41 edge packages
  ansible.builtin.apt:
    name:
      - nginx
      - certbot
    state: present
    update_cache: true

- name: Create the ACME webroot
  ansible.builtin.file:
    path: /var/www/playsay-acme
    state: directory
    owner: root
    group: www-data
    mode: "0755"

- name: Create the honey.school document root
  ansible.builtin.file:
    path: "{{ edge_root_site.document_root }}"
    state: directory
    owner: root
    group: www-data
    mode: "0755"

- name: Render the honey.school landing page
  ansible.builtin.template:
    src: honey-school-index.html.j2
    dest: "{{ edge_root_site.document_root }}/index.html"
    owner: root
    group: www-data
    mode: "0644"

- name: Publish the Honey School brand assets
  ansible.builtin.copy:
    src: brand/
    dest: "{{ edge_root_site.document_root }}/brand/"
    owner: root
    group: www-data
    mode: preserve
    directory_mode: "0755"

# Temporary: remove this task and the deployed file after Mailjet marks
# honey.school Active and support confirms that account activation is complete.
- name: Publish the temporary Mailjet domain validation file
  ansible.builtin.copy:
    dest: "{{ edge_root_site.document_root }}/c13ef19e66138a6862298ea788218111.txt"
    owner: root
    group: www-data
    mode: "0644"
    content: ""

- name: Configure TCP Packetization-Layer MTU discovery for the public edge
  ansible.builtin.copy:
    dest: /etc/sysctl.d/91-playsay-edge-tcp.conf
    owner: root
    group: root
    mode: "0644"
    content: |
      net.ipv4.tcp_mtu_probing = {{ edge_tcp_mtu_probing }}
      net.ipv4.tcp_base_mss = {{ edge_tcp_base_mss }}
  register: edge_tcp_sysctl_config

- name: Apply the public edge TCP MTU settings
  ansible.builtin.command:
    cmd: sysctl --load=/etc/sysctl.d/91-playsay-edge-tcp.conf
  when: edge_tcp_sysctl_config.changed
  changed_when: true

- name: Check whether the shared honey.school certificate exists
  tags: edge-proxy-routes
  ansible.builtin.stat:
    path: "/etc/letsencrypt/live/{{ edge_certificate_name }}/fullchain.pem"
  register: edge_certificate

- name: Check whether the honey.school root certificate exists
  tags: edge-proxy-routes
  ansible.builtin.stat:
    path: "/etc/letsencrypt/live/{{ edge_root_site.certificate_name }}/fullchain.pem"
  register: edge_root_certificate

- name: Enforce the AX41 TLS protocol policy in the nginx HTTP context
  tags: edge-proxy-routes
  ansible.builtin.lineinfile:
    path: /etc/nginx/nginx.conf
    regexp: '^\s*ssl_protocols\s+.*;\s*(?:#.*)?$'
    line: "\tssl_protocols {{ edge_tls_protocols }};"
    backup: true
  notify: reload nginx

- name: Render exact-host AX41 edge routes
  tags: edge-proxy-routes
  ansible.builtin.template:
    src: playsay-honey.conf.j2
    dest: /etc/nginx/conf.d/playsay-honey.conf
    owner: root
    group: root
    mode: "0644"
  notify: reload nginx

- name: Validate nginx configuration
  tags: edge-proxy-routes
  ansible.builtin.command:
    cmd: nginx -t
  changed_when: false

- name: Enable and start nginx for the ACME bootstrap route
  tags: edge-proxy-routes
  ansible.builtin.service:
    name: nginx
    enabled: true
    state: started

- name: Apply the HTTP bootstrap route before requesting the root certificate
  tags: edge-proxy-routes
  ansible.builtin.meta: flush_handlers

- name: Issue the dedicated honey.school root certificate
  tags: edge-proxy-routes
  ansible.builtin.command:
    argv:
      - certbot
      - certonly
      - --webroot
      - --webroot-path
      - /var/www/playsay-acme
      - --cert-name
      - "{{ edge_root_site.certificate_name }}"
      - --domains
      - "{{ edge_root_site.hostname }}"
      - --non-interactive
      - --keep-until-expiring
  when:
    - not edge_root_certificate.stat.exists
    - not ansible_check_mode
  register: edge_root_certificate_issue
  changed_when: edge_root_certificate_issue.rc == 0

- name: Recheck the honey.school root certificate
  tags: edge-proxy-routes
  ansible.builtin.stat:
    path: "/etc/letsencrypt/live/{{ edge_root_site.certificate_name }}/fullchain.pem"
  register: edge_root_certificate_after

- name: Render HTTPS for honey.school after certificate issuance
  tags: edge-proxy-routes
  ansible.builtin.template:
    src: playsay-honey.conf.j2
    dest: /etc/nginx/conf.d/playsay-honey.conf
    owner: root
    group: root
    mode: "0644"
  notify: reload nginx

- name: Install the Certbot nginx reload hook
  ansible.builtin.copy:
    dest: /etc/letsencrypt/renewal-hooks/deploy/reload-nginx.sh
    owner: root
    group: root
    mode: "0755"
    content: |
      #!/bin/sh
      set -eu
      nginx -t
      systemctl reload nginx

- name: Validate final nginx configuration
  tags: edge-proxy-routes
  ansible.builtin.command:
    cmd: nginx -t
  changed_when: false

- name: Enable and start nginx
  tags: edge-proxy-routes
  ansible.builtin.service:
    name: nginx
    enabled: true
    state: started
