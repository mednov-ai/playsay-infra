---
- name: Install the minimal AX41 edge packages
  ansible.builtin.apt:
    name:
      - nginx
      - certbot
      - curl
    state: present
    update_cache: true

- name: Create the ACME webroot
  ansible.builtin.file:
    path: /var/www/playsay-acme
    state: directory
    owner: root
    group: www-data
    mode: "0755"

- name: Create the honey.school document root
  ansible.builtin.file:
    path: "{{ edge_root_site.document_root }}"
    state: directory
    owner: root
    group: www-data
    mode: "0755"

- name: Render the honey.school landing page
  ansible.builtin.template:
    src: honey-school-index.html.j2
    dest: "{{ edge_root_site.document_root }}/index.html"
    owner: root
    group: www-data
    mode: "0644"

- name: Publish the Honey School brand assets
  ansible.builtin.copy:
    src: brand/
    dest: "{{ edge_root_site.document_root }}/brand/"
    owner: root
    group: www-data
    mode: preserve
    directory_mode: "0755"

# Temporary: remove this task and the deployed file after Mailjet marks
# honey.school Active and support confirms that account activation is complete.
- name: Publish the temporary Mailjet domain validation file
  ansible.builtin.copy:
    dest: "{{ edge_root_site.document_root }}/c13ef19e66138a6862298ea788218111.txt"
    owner: root
    group: www-data
    mode: "0644"
    content: ""

- name: Configure TCP Packetization-Layer MTU discovery for the public edge
  ansible.builtin.copy:
    dest: /etc/sysctl.d/91-playsay-edge-tcp.conf
    owner: root
    group: root
    mode: "0644"
    content: |
      net.ipv4.tcp_mtu_probing = {{ edge_tcp_mtu_probing }}
      net.ipv4.tcp_base_mss = {{ edge_tcp_base_mss }}
  register: edge_tcp_sysctl_config

- name: Apply the public edge TCP MTU settings
  ansible.builtin.command:
    cmd: sysctl --load=/etc/sysctl.d/91-playsay-edge-tcp.conf
  when: edge_tcp_sysctl_config.changed
  changed_when: true

- name: Check whether the shared honey.school certificate exists
  ansible.builtin.stat:
    path: "/etc/letsencrypt/live/{{ edge_certificate_name }}/fullchain.pem"
  register: edge_certificate

- name: Check whether the honey.school root certificate exists
  ansible.builtin.stat:
    path: "/etc/letsencrypt/live/{{ edge_root_site.certificate_name }}/fullchain.pem"
  register: edge_root_certificate

- name: Check the protected RF observability server credentials
  tags: classroom-route-observability
  ansible.builtin.stat:
    path: "{{ edge_rf_observability_htpasswd_path }}"
  register: edge_rf_observability_htpasswd
  when: edge_rf_observability_enabled | bool
  no_log: true

- name: Require protected RF observability server credentials
  tags: classroom-route-observability
  ansible.builtin.assert:
    that:
      - edge_rf_observability_htpasswd.stat.exists
      - edge_rf_observability_htpasswd.stat.mode == '0640'
      - edge_rf_observability_htpasswd.stat.pw_name == 'root'
      - edge_rf_observability_htpasswd.stat.gr_name == 'www-data'
    fail_msg: Deliver the root-owned RF observability htpasswd file for nginx before enabling its ingestion endpoint.
  when: edge_rf_observability_enabled | bool
  no_log: true

- name: Create the protected AX41 edge observability directory
  tags: classroom-route-observability
  ansible.builtin.file:
    path: "{{ edge_observability_directory }}"
    state: directory
    owner: root
    group: root
    mode: "0700"

- name: Install the privacy-safe AX41 nginx signaling counter collector
  tags: classroom-route-observability
  ansible.builtin.template:
    src: "{{ playbook_dir }}/../roles/rf-edge-media-relay/templates/collect-nginx-signal-metrics.py.j2"
    dest: /usr/local/sbin/playsay-collect-nginx-signal-metrics
    owner: root
    group: root
    mode: "0750"
  vars:
    nginx_signal_metrics_log_path: /var/log/nginx/playsay-livekit-signaling.log
    nginx_signal_metrics_state_directory: "{{ edge_observability_directory }}"
    nginx_signal_metrics_output_path: "{{ edge_observability_directory }}/nginx_signal.prom"
    nginx_signal_metrics_edge: ax41

- name: Install the AX41 nginx signaling metric pusher
  tags: classroom-route-observability
  ansible.builtin.template:
    src: push-nginx-signal-metrics.sh.j2
    dest: /usr/local/sbin/playsay-push-nginx-signal-metrics
    owner: root
    group: root
    mode: "0750"

- name: Schedule AX41 nginx signaling counter export
  tags: classroom-route-observability
  ansible.builtin.copy:
    dest: /etc/cron.d/playsay-ax41-nginx-signal-metrics
    owner: root
    group: root
    mode: "0644"
    content: "* * * * * root /usr/local/sbin/playsay-push-nginx-signal-metrics\n"

- name: Enforce the AX41 TLS protocol policy in the nginx HTTP context
  ansible.builtin.lineinfile:
    path: /etc/nginx/nginx.conf
    regexp: '^\s*ssl_protocols\s+.*;\s*(?:#.*)?$'
    line: "\tssl_protocols {{ edge_tls_protocols }};"
    backup: true
  notify: reload nginx

- name: Safely reconcile only the production HTML-game upload routes
  tags: html-game-upload-routes
  block:
    - name: Read the active AX41 edge routes
      ansible.builtin.slurp:
        path: /etc/nginx/conf.d/playsay-honey.conf
      register: active_ax41_edge_routes

    - name: Install the bounded AX41 HTML-game upload location
      ansible.builtin.blockinfile:
        path: /etc/nginx/conf.d/playsay-honey.conf
        insertafter: '^    server_name online\.honey\.school;$'
        marker: '    # {mark} HONEY SCHOOL HTML GAME UPLOAD ROUTES'
        backup: true
        block: |
          location ~ ^/api/(?:materials/[^/]+/assets/html-games|schedule/lessons/[^/]+/html-game-page)$ {
              client_max_body_size 21m;
              proxy_pass http://10.60.0.20:32083;
              proxy_http_version 1.1;
              proxy_request_buffering off;
              proxy_buffering off;
              proxy_set_header Host $host;
              proxy_set_header X-Forwarded-Host $host;
              proxy_set_header X-Forwarded-Proto https;
              proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
              proxy_read_timeout 660s;
              proxy_send_timeout 660s;
          }
      when: >-
        'schedule/lessons/[^/]+/html-game-page' not in
        (((active_ax41_edge_routes.content | b64decode).split('server_name online.honey.school;'))[2]
        .split('server_name dev.online.honey.school;')[0])
      register: ax41_html_game_routes
      notify: reload nginx

    - name: Validate the AX41 nginx configuration after HTML-game route reconciliation
      ansible.builtin.command:
        cmd: nginx -t
      changed_when: false
  rescue:
    - name: Restore the previous AX41 route file after failed validation
      ansible.builtin.copy:
        src: "{{ ax41_html_game_routes.backup_file }}"
        dest: /etc/nginx/conf.d/playsay-honey.conf
        owner: root
        group: root
        mode: "0644"
        remote_src: true
      when: ax41_html_game_routes.changed | default(false)

    - name: Verify the restored AX41 nginx configuration
      ansible.builtin.command:
        cmd: nginx -t
      changed_when: false

    - name: Stop after restoring the invalid AX41 route change
      ansible.builtin.fail:
        msg: The HTML-game upload route failed nginx validation and the previous AX41 configuration was restored.

- name: Activate the validated AX41 HTML-game upload routes
  tags: html-game-upload-routes
  ansible.builtin.meta: flush_handlers

- name: Create the AX41 nginx snippets directory
  tags: [edge-proxy-routes, classroom-route-observability]
  ansible.builtin.file:
    path: /etc/nginx/snippets
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Install the privacy-safe LiveKit signaling log format
  tags: [edge-proxy-routes, classroom-route-observability]
  ansible.builtin.copy:
    dest: /etc/nginx/conf.d/00-playsay-livekit-log-format.conf
    owner: root
    group: root
    mode: "0644"
    content: |
      # Excludes URI/query, addresses, headers, cookies, credentials and identities.
      map $remote_addr $playsay_rf_signal_source {
          default 0;
          {{ edge_rf_observability_source_ipv4 }} 1;
      }
      map "$playsay_rf_signal_source:$http_x_playsay_signal_request_id" $playsay_signal_request_id {
          ~^1:(?<playsay_rf_request_id>[0-9a-f]{32})$ $playsay_rf_request_id;
          default $request_id;
      }
      log_format playsay_livekit_signal 'msec=$msec request_id=$playsay_signal_request_id status=$status request_time=$request_time upstream_connect_time=$upstream_connect_time upstream_header_time=$upstream_header_time upstream_response_time=$upstream_response_time upstream_status=$upstream_status';
  notify: reload nginx

- name: Install the privacy-safe LiveKit signaling location snippet
  tags: [edge-proxy-routes, classroom-route-observability]
  ansible.builtin.copy:
    dest: /etc/nginx/snippets/playsay-livekit-signaling.conf
    owner: root
    group: root
    mode: "0644"
    content: |
      access_log /var/log/nginx/playsay-livekit-signaling.log playsay_livekit_signal;
      proxy_request_buffering off;
  notify: reload nginx

- name: Reconcile only the LiveKit signaling includes in the active AX41 routes
  tags: [edge-proxy-routes, classroom-route-observability]
  ansible.builtin.replace:
    path: /etc/nginx/conf.d/playsay-honey.conf
    regexp: '(^\s+location (?:= /livekit|/livekit/) \{\n)(?!\s+include /etc/nginx/snippets/playsay-livekit-signaling\.conf;)'
    replace: '\g<1>        include /etc/nginx/snippets/playsay-livekit-signaling.conf;\n'
  notify: reload nginx

- name: Reconcile only the shared signaling request id in active AX41 routes
  tags: classroom-route-observability
  ansible.builtin.replace:
    path: /etc/nginx/conf.d/playsay-honey.conf
    regexp: '(^\s+include /etc/nginx/snippets/playsay-livekit-signaling\.conf;\n)(?!\s+proxy_set_header X-PlaySay-Signal-Request-Id )'
    replace: '\g<1>        proxy_set_header X-PlaySay-Signal-Request-Id $playsay_signal_request_id;\n'
  notify: reload nginx

- name: Reconcile only the protected RF telemetry endpoint on AX41
  tags: classroom-route-observability
  ansible.builtin.blockinfile:
    path: /etc/nginx/conf.d/playsay-honey.conf
    insertafter: '^    server_name ops\.honey\.school;$'
    marker: '    # {mark} HONEY SCHOOL RF OBSERVABILITY INGEST'
    block: |
      location = /victoria-metrics/api/v1/import/prometheus {
          allow {{ edge_rf_observability_source_ipv4 }};
          deny all;
          auth_basic "Honey School RF telemetry";
          auth_basic_user_file {{ edge_rf_observability_htpasswd_path }};
          client_max_body_size 256k;
          proxy_pass {{ edge_observability_import_url }};
          proxy_http_version 1.1;
          proxy_set_header Host $host;
          proxy_set_header X-Forwarded-Proto https;
          proxy_set_header X-Forwarded-For $honey_school_client_ip;
      }
  notify: reload nginx

- name: Render exact-host AX41 edge routes
  tags: edge-proxy-routes
  ansible.builtin.template:
    src: playsay-honey.conf.j2
    dest: /etc/nginx/conf.d/playsay-honey.conf
    owner: root
    group: root
    mode: "0644"
  notify: reload nginx

- name: Validate nginx configuration
  ansible.builtin.command:
    cmd: nginx -t
  changed_when: false

- name: Enable and start nginx for the ACME bootstrap route
  ansible.builtin.service:
    name: nginx
    enabled: true
    state: started

- name: Apply the HTTP bootstrap route before requesting the root certificate
  ansible.builtin.meta: flush_handlers

- name: Issue the dedicated honey.school root certificate
  ansible.builtin.command:
    argv:
      - certbot
      - certonly
      - --webroot
      - --webroot-path
      - /var/www/playsay-acme
      - --cert-name
      - "{{ edge_root_site.certificate_name }}"
      - --domains
      - "{{ edge_root_site.hostname }}"
      - --non-interactive
      - --keep-until-expiring
  when:
    - not edge_root_certificate.stat.exists
    - not ansible_check_mode
  register: edge_root_certificate_issue
  changed_when: edge_root_certificate_issue.rc == 0

- name: Recheck the honey.school root certificate
  ansible.builtin.stat:
    path: "/etc/letsencrypt/live/{{ edge_root_site.certificate_name }}/fullchain.pem"
  register: edge_root_certificate_after

- name: Render HTTPS for honey.school after certificate issuance
  tags: edge-proxy-routes
  ansible.builtin.template:
    src: playsay-honey.conf.j2
    dest: /etc/nginx/conf.d/playsay-honey.conf
    owner: root
    group: root
    mode: "0644"
  notify: reload nginx

- name: Install the Certbot nginx reload hook
  ansible.builtin.copy:
    dest: /etc/letsencrypt/renewal-hooks/deploy/reload-nginx.sh
    owner: root
    group: root
    mode: "0755"
    content: |
      #!/bin/sh
      set -eu
      nginx -t
      systemctl reload nginx

- name: Validate final nginx configuration
  tags: [edge-proxy-routes, classroom-route-observability]
  ansible.builtin.command:
    cmd: nginx -t
  changed_when: false

- name: Enable and start nginx
  tags: [edge-proxy-routes, classroom-route-observability]
  ansible.builtin.service:
    name: nginx
    enabled: true
    state: started
