---
- name: Ensure apt cache is current
  ansible.builtin.apt:
    update_cache: true
    cache_valid_time: 3600

- name: Install baseline packages
  ansible.builtin.apt:
    name:
      - ca-certificates
      - curl
      - fail2ban
      - git
      - gnupg
      - jq
      - openssl
      - openssh-server
      - python3
      - python3-apt
      - rsync
      - software-properties-common
      - unattended-upgrades
      - ufw
      - yq
    state: present

- name: Set server timezone
  community.general.timezone:
    name: "{{ timezone }}"

- name: Check swap file
  ansible.builtin.stat:
    path: "{{ swap_file_path }}"
  register: swap_file
  when: swap_file_size | default("") | length > 0

- name: Create swap file
  ansible.builtin.command:
    cmd: "fallocate -l {{ swap_file_size }} {{ swap_file_path }}"
  when:
    - swap_file_size | default("") | length > 0
    - not swap_file.stat.exists
  changed_when: true

- name: Set swap file permissions
  ansible.builtin.file:
    path: "{{ swap_file_path }}"
    owner: root
    group: root
    mode: "0600"
  when: swap_file_size | default("") | length > 0

- name: Format swap file
  ansible.builtin.command:
    cmd: "mkswap {{ swap_file_path }}"
  when:
    - swap_file_size | default("") | length > 0
    - not swap_file.stat.exists
  changed_when: true

- name: Persist swap file
  ansible.builtin.lineinfile:
    path: /etc/fstab
    line: "{{ swap_file_path }} none swap sw 0 0"
    regexp: "^{{ swap_file_path | regex_escape }}\\s+"
    state: present
  when: swap_file_size | default("") | length > 0

- name: Check active swap devices
  ansible.builtin.command:
    cmd: swapon --show --noheadings --raw --output NAME
  register: active_swap
  changed_when: false
  when: swap_file_size | default("") | length > 0

- name: Enable swap file
  ansible.builtin.command:
    cmd: "swapon {{ swap_file_path }}"
  when:
    - swap_file_size | default("") | length > 0
    - swap_file_path not in active_swap.stdout
  changed_when: true

- name: Create non-root admin user
  ansible.builtin.user:
    name: "{{ admin_user }}"
    shell: /bin/bash
    groups: sudo
    append: true
    create_home: true

- name: Read bootstrap public key from controller
  ansible.builtin.set_fact:
    bootstrap_public_key: "{{ lookup('file', local_public_key_file) }}"
  when: local_public_key_file is defined

- name: Ensure root SSH directory exists
  ansible.builtin.file:
    path: /root/.ssh
    state: directory
    owner: root
    group: root
    mode: "0700"

- name: Ensure admin SSH directory exists
  ansible.builtin.file:
    path: "/home/{{ admin_user }}/.ssh"
    state: directory
    owner: "{{ admin_user }}"
    group: "{{ admin_user }}"
    mode: "0700"

- name: Install bootstrap key for root
  ansible.builtin.authorized_key:
    user: root
    key: "{{ bootstrap_public_key }}"
    state: present
  when: bootstrap_public_key is defined and bootstrap_public_key | length > 0

- name: Install bootstrap key for admin user
  ansible.builtin.authorized_key:
    user: "{{ admin_user }}"
    key: "{{ bootstrap_public_key }}"
    state: present
  when: bootstrap_public_key is defined and bootstrap_public_key | length > 0

- name: Allow admin user passwordless sudo
  ansible.builtin.copy:
    dest: "/etc/sudoers.d/{{ admin_user }}"
    mode: "0440"
    owner: root
    group: root
    content: "{{ admin_user }} ALL=(ALL) NOPASSWD:ALL\n"

- name: Check root authorized keys
  ansible.builtin.stat:
    path: /root/.ssh/authorized_keys
  register: root_authorized_keys

- name: Copy root authorized keys to admin user
  ansible.builtin.copy:
    src: /root/.ssh/authorized_keys
    dest: "/home/{{ admin_user }}/.ssh/authorized_keys"
    remote_src: true
    owner: "{{ admin_user }}"
    group: "{{ admin_user }}"
    mode: "0600"
  when:
    - ansible_user == "root"
    - root_authorized_keys.stat.exists
    - bootstrap_public_key is not defined

- name: Harden SSH daemon
  ansible.builtin.copy:
    dest: /etc/ssh/sshd_config.d/99-playsay-hardening.conf
    owner: root
    group: root
    mode: "0644"
    content: |
      PermitRootLogin prohibit-password
      PasswordAuthentication no
      KbdInteractiveAuthentication no
      PubkeyAuthentication yes
      X11Forwarding no
  notify: restart ssh
  when: manage_ssh_hardening | bool

- name: Enable unattended security upgrades
  ansible.builtin.copy:
    dest: /etc/apt/apt.conf.d/20auto-upgrades
    owner: root
    group: root
    mode: "0644"
    content: |
      APT::Periodic::Update-Package-Lists "1";
      APT::Periodic::Unattended-Upgrade "1";

- name: Configure UFW default deny incoming
  community.general.ufw:
    direction: incoming
    policy: deny
  when: manage_ufw | bool

- name: Configure UFW default allow outgoing
  community.general.ufw:
    direction: outgoing
    policy: allow
  when: manage_ufw | bool

- name: Allow SSH
  community.general.ufw:
    rule: allow
    port: "{{ ssh_port }}"
    proto: tcp
  when: manage_ufw | bool

- name: Allow public HTTP/HTTPS ports
  community.general.ufw:
    rule: allow
    port: "{{ item }}"
    proto: tcp
  loop: "{{ ufw_extra_tcp_ports }}"
  when: manage_ufw | bool

- name: Optionally allow public k3s API
  community.general.ufw:
    rule: allow
    port: "6443"
    proto: tcp
  when:
    - manage_ufw | bool
    - ufw_allow_k3s_api_public | bool

- name: Enable UFW
  community.general.ufw:
    state: enabled
  when: manage_ufw | bool
