---
- name: Install WireGuard tooling
  ansible.builtin.apt:
    name:
      - wireguard
      - wireguard-tools
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: Ensure WireGuard configuration directory exists
  ansible.builtin.file:
    path: /etc/wireguard
    state: directory
    owner: root
    group: root
    mode: "0700"

- name: Check WireGuard server private key
  ansible.builtin.stat:
    path: /etc/wireguard/server.key
  register: wireguard_server_key_file

- name: Generate WireGuard server keypair once
  ansible.builtin.shell:
    cmd: |
      set -o pipefail
      umask 077
      wg genkey | tee /etc/wireguard/server.key | wg pubkey > /etc/wireguard/server.pub
    executable: /bin/bash
  when: not wireguard_server_key_file.stat.exists
  changed_when: true
  no_log: true

- name: Protect WireGuard server key files
  ansible.builtin.file:
    path: "{{ item }}"
    owner: root
    group: root
    mode: "0600"
  loop:
    - /etc/wireguard/server.key
    - /etc/wireguard/server.pub

- name: Read WireGuard server private key
  ansible.builtin.slurp:
    src: /etc/wireguard/server.key
  register: wireguard_server_private_key_file
  no_log: true

- name: Keep WireGuard server private key only in memory
  ansible.builtin.set_fact:
    wireguard_server_private_key: "{{ wireguard_server_private_key_file.content | b64decode | trim }}"
  no_log: true

- name: Enable IPv4 forwarding for management and VM networks
  ansible.builtin.copy:
    dest: /etc/sysctl.d/90-playsay-routing.conf
    owner: root
    group: root
    mode: "0644"
    content: |
      net.ipv4.ip_forward = 1
  register: wireguard_sysctl_config

- name: Reload sysctl settings
  ansible.builtin.command:
    cmd: sysctl --system
  when: wireguard_sysctl_config.changed
  changed_when: true

- name: Render WireGuard management interface
  ansible.builtin.template:
    src: wg0.conf.j2
    dest: "/etc/wireguard/{{ wireguard_interface }}.conf"
    owner: root
    group: root
    mode: "0600"
  no_log: true
  register: wireguard_configuration

- name: Enable WireGuard management interface
  ansible.builtin.systemd_service:
    name: "wg-quick@{{ wireguard_interface }}"
    enabled: true
    state: started

- name: Restart WireGuard after peer changes
  ansible.builtin.systemd_service:
    name: "wg-quick@{{ wireguard_interface }}"
    state: restarted
  when: wireguard_configuration.changed

- name: Verify WireGuard address
  ansible.builtin.command:
    cmd: "ip -brief address show {{ wireguard_interface }}"
  register: wireguard_address_output
  changed_when: false

- name: Assert WireGuard management address is active
  ansible.builtin.assert:
    that:
      - "'10.250.0.1/24' in wireguard_address_output.stdout"
