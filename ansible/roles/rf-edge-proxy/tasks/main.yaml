---
- name: Validate declared ACME fallback routes
  ansible.builtin.import_tasks: validate-acme.yaml

- name: Ensure the Russian ingress dependencies are installed
  ansible.builtin.apt:
    name:
      - ca-certificates
      - certbot
      - nginx
      - python3-certbot-nginx
      - ufw
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: Verify the Russian ingress variables are available
  ansible.builtin.assert:
    that:
      - rf_edge_acme_webroot is defined
      - rf_edge_certificate_directory is defined
      - rf_edge_origin_address is defined
      - rf_edge_routes is defined
      - rf_edge_tls_enabled is defined
      - rf_edge_tls_protocols is defined

- name: Verify every Russian ingress route
  ansible.builtin.assert:
    that:
      - item.hostname is defined
      - item.environment in ['dev', 'prod']
      - item.kind in ['application', 'keycloak', 'landing']
      - item.kind != 'keycloak' or item.realm is defined
      - item.kind != 'landing' or item.document_root is defined
      - item.kind != 'landing' or item.landing_source is defined
      - not (item.livekit_signaling_proxy | default(false) | bool) or item.kind == 'application'
      - not (item.livekit_signaling_proxy | default(false) | bool) or item.hostname == ((item.environment == 'dev') | ternary('dev.online.honeyschool.ru', 'online.honeyschool.ru'))
      - not (item.livekit_signaling_proxy | default(false) | bool) or item.origin_hostname == ((item.environment == 'dev') | ternary('dev.online.honey.school', 'online.honey.school'))
      - not (item.collaboration_proxy | default(false) | bool) or item.kind == 'application'
      - not (item.collaboration_proxy | default(false) | bool) or item.hostname == ((item.environment == 'dev') | ternary('dev.online.honeyschool.ru', 'online.honeyschool.ru'))
      - not (item.collaboration_proxy | default(false) | bool) or item.origin_hostname == ((item.environment == 'dev') | ternary('dev.online.honey.school', 'online.honey.school'))
  loop: "{{ rf_edge_routes }}"
  loop_control:
    label: "{{ item.hostname | default('undefined') }}"

- name: Create the Russian ingress ACME webroot
  ansible.builtin.file:
    path: "{{ rf_edge_acme_webroot }}"
    state: directory
    owner: root
    group: www-data
    mode: "0755"

- name: Create the Russian landing document roots
  ansible.builtin.file:
    path: "{{ item.document_root }}"
    state: directory
    owner: root
    group: www-data
    mode: "0755"
  loop: "{{ rf_edge_routes | selectattr('kind', 'equalto', 'landing') | list }}"
  loop_control:
    label: "{{ item.hostname }}"

- name: Install the Russian landing pages
  ansible.builtin.copy:
    src: "{{ item.landing_source }}"
    dest: "{{ item.document_root }}/index.html"
    owner: root
    group: www-data
    mode: "0644"
  loop: "{{ rf_edge_routes | selectattr('kind', 'equalto', 'landing') | list }}"
  loop_control:
    label: "{{ item.hostname }}"
  notify: reload nginx

- name: Check the Russian ingress certificate chain
  ansible.builtin.stat:
    path: "{{ item.certificate_directory | default(rf_edge_certificate_directory) }}/fullchain.pem"
  loop: "{{ rf_edge_routes }}"
  loop_control:
    label: "{{ item.hostname }}"
  register: rf_edge_fullchains
  when: (item.tls_enabled | default(rf_edge_tls_enabled)) | bool

- name: Check the Russian ingress private key
  ansible.builtin.stat:
    path: "{{ item.certificate_directory | default(rf_edge_certificate_directory) }}/privkey.pem"
  loop: "{{ rf_edge_routes }}"
  loop_control:
    label: "{{ item.hostname }}"
  register: rf_edge_privkeys
  when: (item.tls_enabled | default(rf_edge_tls_enabled)) | bool

- name: Require every production certificate chain before enabling the ingress
  ansible.builtin.assert:
    that:
      - item.stat.exists
    fail_msg: >-
      Obtain the Russian ingress certificate chain for {{ item.item.hostname }} in
      {{ item.item.certificate_directory | default(rf_edge_certificate_directory) }}
      before enabling TLS.
  loop: "{{ rf_edge_fullchains.results }}"
  loop_control:
    label: "{{ item.item.hostname }}"
  when: not (item.skipped | default(false))

- name: Require every production certificate private key before enabling the ingress
  ansible.builtin.assert:
    that:
      - item.stat.exists
    fail_msg: >-
      Obtain the Russian ingress certificate key for {{ item.item.hostname }} in
      {{ item.item.certificate_directory | default(rf_edge_certificate_directory) }}
      before enabling TLS.
  loop: "{{ rf_edge_privkeys.results }}"
  loop_control:
    label: "{{ item.item.hostname }}"
  when: not (item.skipped | default(false))

- name: Disable the packaged nginx default site
  ansible.builtin.file:
    path: /etc/nginx/sites-enabled/default
    state: absent
  notify: reload nginx

- name: Allow SSH through the Russian ingress firewall
  community.general.ufw:
    rule: allow
    name: OpenSSH

- name: Allow public web traffic through the Russian ingress firewall
  community.general.ufw:
    rule: allow
    name: Nginx Full

- name: Enable the Russian ingress firewall
  community.general.ufw:
    state: enabled
    policy: deny
    direction: incoming

- name: Enforce the Russian ingress TLS policy in the nginx HTTP context
  ansible.builtin.lineinfile:
    path: /etc/nginx/nginx.conf
    regexp: '^\s*ssl_protocols\s+'
    line: "\tssl_protocols {{ rf_edge_tls_protocols }};"
    insertafter: '^\s*http\s*\{'
  notify: reload nginx

- name: Remove the superseded Russian ingress TLS override
  ansible.builtin.file:
    path: /etc/nginx/conf.d/00-playsay-rf-edge-tls.conf
    state: absent
  notify: reload nginx

- name: Reload nginx after certificate renewal
  ansible.builtin.copy:
    dest: /etc/letsencrypt/renewal-hooks/deploy/playsay-rf-edge-nginx
    owner: root
    group: root
    mode: "0755"
    content: |
      #!/bin/sh
      set -eu
      /usr/sbin/nginx -t
      /usr/bin/systemctl reload nginx

- name: Reconcile only the privacy-safe RF signaling log format
  tags: classroom-route-observability
  ansible.builtin.lineinfile:
    path: /etc/nginx/conf.d/playsay-honey-rf-edge.conf
    regexp: '^log_format playsay_livekit_signal '
    line: >-
      log_format playsay_livekit_signal 'msec=$msec request_id=$request_id status=$status
      request_time=$request_time upstream_connect_time=$upstream_connect_time
      upstream_header_time=$upstream_header_time upstream_response_time=$upstream_response_time
      upstream_status=$upstream_status';
  notify: reload nginx

- name: Reconcile only the shared signaling request id on RF
  tags: classroom-route-observability
  ansible.builtin.replace:
    path: /etc/nginx/conf.d/playsay-honey-rf-edge.conf
    regexp: '(^    location (?:= /livekit|\^~ /livekit/) \{\n(?:(?!^    \})[^\n]*\n)*?^        proxy_set_header Connection \$playsay_rf_connection_upgrade;\n)(?!        proxy_set_header X-PlaySay-Signal-Request-Id )'
    replace: '\g<1>        proxy_set_header X-PlaySay-Signal-Request-Id $request_id;\n'
  notify: reload nginx

- name: Render the Russian production ingress routes
  ansible.builtin.template:
    src: playsay-honey-rf-edge.conf.j2
    dest: /etc/nginx/conf.d/playsay-honey-rf-edge.conf
    owner: root
    group: root
    mode: "0644"
  notify: reload nginx

- name: Validate the Russian ingress nginx configuration
  tags: classroom-route-observability
  ansible.builtin.command:
    cmd: nginx -t
  changed_when: false

- name: Enable and start nginx on the Russian ingress
  ansible.builtin.service:
    name: nginx
    enabled: true
    state: started

- name: Safely reconcile only the RF production HTML-game upload routes
  tags: html-game-upload-routes
  vars:
    game_host_line: 'server_name online.honeyschool.ru;'
    legacy_game_route: 'location ~ ^/api/(?:materials/[^/]+/assets/html-games|schedule/lessons/[^/]+/html-game-page)$ {'
    library_game_route: 'location ~ ^/api/(?:games(?:/[^/]+/revisions)?|materials/[^/]+/assets/html-games|schedule/lessons/[^/]+/html-game-page)$ {'
    game_route_file: "{{ active_rf_edge_routes.content | b64decode }}"
    game_tls_server: "{{ game_route_file.split(game_host_line)[2].split('server {')[0] }}"
  block:
    - name: Read the active RF edge routes
      ansible.builtin.slurp:
        path: /etc/nginx/conf.d/playsay-honey-rf-edge.conf
      register: active_rf_edge_routes

    - name: Identify the production HTTPS block and its existing game routes
      ansible.builtin.assert:
        that:
          - "game_route_file.split(game_host_line) | length == 3"
          - "'listen 443 ssl' in game_route_file.split(game_host_line)[1].rsplit('server {', 1)[-1]"
          - "game_tls_server.count(legacy_game_route) + game_tls_server.count(library_game_route) <= 1"
          - "legacy_game_route not in game_tls_server or 'client_max_body_size 21m;' in game_tls_server.split(legacy_game_route)[1].split('}')[0]"
          - "library_game_route not in game_tls_server or 'client_max_body_size 21m;' in game_tls_server.split(library_game_route)[1].split('}')[0]"
          - "game_tls_server.count('schedule/lessons/[^/]+/html-game-page') == game_tls_server.count(legacy_game_route) + game_tls_server.count(library_game_route)"
          - "game_route_file.count('# BEGIN HONEY SCHOOL HTML GAME UPLOAD ROUTES') == game_tls_server.count('# BEGIN HONEY SCHOOL HTML GAME UPLOAD ROUTES')"
          - "game_route_file.count('# END HONEY SCHOOL HTML GAME UPLOAD ROUTES') == game_tls_server.count('# END HONEY SCHOOL HTML GAME UPLOAD ROUTES')"
        fail_msg: Unexpected production game upload configuration. Review the active route file.

    - name: Extend the existing production material and lesson upload location to the game library
      ansible.builtin.replace:
        path: /etc/nginx/conf.d/playsay-honey-rf-edge.conf
        after: "(?s:.*{{ game_host_line | regex_escape }})"
        before: '(?m:^server \{|\Z)'
        regexp: "{{ legacy_game_route | regex_escape }}"
        replace: "{{ library_game_route }}"
        backup: true
      when: legacy_game_route in game_tls_server
      register: rf_html_game_upgrade
      notify: reload nginx

    - name: Install the bounded RF HTML-game upload location
      ansible.builtin.blockinfile:
        path: /etc/nginx/conf.d/playsay-honey-rf-edge.conf
        insertafter: '^    server_name online\.honeyschool\.ru;$'
        marker: '    # {mark} HONEY SCHOOL HTML GAME UPLOAD ROUTES'
        backup: true
        block: |
          location ~ ^/api/(?:games(?:/[^/]+/revisions)?|materials/[^/]+/assets/html-games|schedule/lessons/[^/]+/html-game-page)$ {
              client_max_body_size 21m;
              proxy_pass https://{{ rf_edge_origin_address }};
              proxy_http_version 1.1;
              proxy_ssl_server_name on;
              proxy_ssl_name online.honey.school;
              proxy_ssl_protocols TLSv1.2;
              proxy_ssl_session_reuse off;
              proxy_ssl_verify on;
              proxy_ssl_verify_depth 3;
              proxy_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;
              proxy_set_header Host online.honey.school;
              proxy_set_header X-Real-IP $remote_addr;
              proxy_set_header X-Forwarded-Host $host;
              proxy_set_header X-Forwarded-For $remote_addr;
              proxy_set_header X-Forwarded-Proto https;
              proxy_set_header Upgrade $http_upgrade;
              proxy_set_header Connection $playsay_rf_connection_upgrade;
              proxy_read_timeout 3600s;
              proxy_send_timeout 3600s;
              proxy_request_buffering off;
              proxy_buffering off;
              proxy_set_header Accept-Encoding "";
              sub_filter_once off;
              sub_filter_types application/javascript text/javascript text/css;
              sub_filter 'https://online.honey.school' 'https://online.honeyschool.ru';
              sub_filter 'wss://online.honey.school' 'wss://online.honeyschool.ru';
          }
      when: legacy_game_route not in game_tls_server and library_game_route not in game_tls_server
      register: rf_html_game_routes
      notify: reload nginx

    - name: Verify that an existing legacy game route was upgraded
      ansible.builtin.assert:
        that: rf_html_game_upgrade.changed
      when: legacy_game_route in game_tls_server

    - name: Validate the RF nginx configuration after HTML-game route reconciliation
      ansible.builtin.command:
        cmd: nginx -t
      changed_when: false
  rescue:
    - name: Restore the previous RF route file after failed validation
      ansible.builtin.copy:
        src: "{{ rf_html_game_upgrade.backup_file | default(rf_html_game_routes.backup_file | default('')) }}"
        dest: /etc/nginx/conf.d/playsay-honey-rf-edge.conf
        owner: root
        group: root
        mode: "0644"
        remote_src: true
      when: (rf_html_game_upgrade.changed | default(false)) or (rf_html_game_routes.changed | default(false))

    - name: Verify the restored RF nginx configuration
      ansible.builtin.command:
        cmd: nginx -t
      changed_when: false

    - name: Stop after restoring the invalid RF route change
      ansible.builtin.fail:
        msg: The HTML-game upload route failed nginx validation and the previous RF configuration was restored.

- name: Activate the validated RF HTML-game upload routes
  tags: html-game-upload-routes
  ansible.builtin.meta: flush_handlers

- name: Safely reconcile only ACME ingress
  ansible.builtin.import_tasks: acme-ingress.yaml
  tags: [never, certificate-acme-ingress]
