---
- name: Safely reconcile the selected RF image upload routes
  vars:
    image_upload_location_header: 'location ~ ^/api/(?:materials/[^/]+/(?:image-page|assets/images)|schedule/lessons/[^/]+/image-page)$ {'
    worksheet_upload_location_header: 'location = /api/worksheet-imports {'
    draft_image_location_header: 'location = /api/materials/ai-draft {'
    rf_image_marker_begin: '    # BEGIN HONEY SCHOOL IMAGE UPLOAD ROUTES'
    rf_image_marker_end: '    # END HONEY SCHOOL IMAGE UPLOAD ROUTES'
  block:
    - name: Read the active RF route file
      ansible.builtin.slurp:
        path: "{{ rf_image_target_path }}"
      register: rf_image_active_routes

    - name: Confirm the last matching target server is HTTPS
      ansible.builtin.assert:
        that:
          - "(rf_image_active_routes.content | b64decode).split('server_name ' ~ rf_image_target_hostname ~ ';') | length == 3"
          - "'listen 443 ssl' in (rf_image_active_routes.content | b64decode).split('server_name ' ~ rf_image_target_hostname ~ ';')[1].rsplit('server {', 1)[-1]"
        fail_msg: The target RF route layout changed; review before reconciling.

    - name: Isolate the target HTTPS server
      ansible.builtin.set_fact:
        rf_image_target_server: "{{ (rf_image_active_routes.content | b64decode).split('server_name ' ~ rf_image_target_hostname ~ ';')[2].split('server {')[0] }}"

    - name: Refuse a conflicting pre-existing image route
      ansible.builtin.assert:
        that:
          - "((rf_image_active_routes.content | b64decode).splitlines() | select('equalto', rf_image_marker_begin) | list | length) == (rf_image_target_server.splitlines() | select('equalto', rf_image_marker_begin) | list | length)"
          - "((rf_image_active_routes.content | b64decode).splitlines() | select('equalto', rf_image_marker_end) | list | length) == (rf_image_target_server.splitlines() | select('equalto', rf_image_marker_end) | list | length)"
          - "(rf_image_target_server.splitlines() | select('equalto', rf_image_marker_begin) | list | length) <= 1"
          - "(rf_image_target_server.splitlines() | select('equalto', rf_image_marker_begin) | list | length) == (rf_image_target_server.splitlines() | select('equalto', rf_image_marker_end) | list | length)"
          - "'location / {' in rf_image_target_server"
          - "('proxy_pass https://' ~ rf_edge_origin_address ~ ';') in rf_image_target_server"
          - "('proxy_ssl_name ' ~ rf_image_origin_hostname ~ ';') in rf_image_target_server"
          - "'schedule/lessons/[^/]+/image-page' not in rf_image_target_server or image_upload_location_header in rf_image_target_server"
          - "(image_upload_location_header in rf_image_target_server) == (worksheet_upload_location_header in rf_image_target_server)"
          - "(image_upload_location_header in rf_image_target_server) == (draft_image_location_header in rf_image_target_server)"
          - "'/api/worksheet-imports' not in rf_image_target_server or worksheet_upload_location_header in rf_image_target_server"
          - "'/api/materials/ai-draft' not in rf_image_target_server or draft_image_location_header in rf_image_target_server"
          - "image_upload_location_header not in rf_image_target_server or 'client_max_body_size 21m;' in rf_image_target_server.split(image_upload_location_header)[1].split('}')[0]"
          - "worksheet_upload_location_header not in rf_image_target_server or 'client_max_body_size 129m;' in rf_image_target_server.split(worksheet_upload_location_header)[1].split('}')[0]"
          - "draft_image_location_header not in rf_image_target_server or 'client_max_body_size 3m;' in rf_image_target_server.split(draft_image_location_header)[1].split('}')[0]"
          - "image_upload_location_header not in rf_image_target_server or ('proxy_pass https://' ~ rf_edge_origin_address ~ ';') in rf_image_target_server.split(image_upload_location_header)[1].split('}')[0]"
          - "worksheet_upload_location_header not in rf_image_target_server or ('proxy_pass https://' ~ rf_edge_origin_address ~ ';') in rf_image_target_server.split(worksheet_upload_location_header)[1].split('}')[0]"
          - "draft_image_location_header not in rf_image_target_server or ('proxy_pass https://' ~ rf_edge_origin_address ~ ';') in rf_image_target_server.split(draft_image_location_header)[1].split('}')[0]"
          - "image_upload_location_header not in rf_image_target_server or ('proxy_ssl_name ' ~ rf_image_origin_hostname ~ ';') in rf_image_target_server.split(image_upload_location_header)[1].split('}')[0]"
          - "worksheet_upload_location_header not in rf_image_target_server or ('proxy_ssl_name ' ~ rf_image_origin_hostname ~ ';') in rf_image_target_server.split(worksheet_upload_location_header)[1].split('}')[0]"
          - "draft_image_location_header not in rf_image_target_server or ('proxy_ssl_name ' ~ rf_image_origin_hostname ~ ';') in rf_image_target_server.split(draft_image_location_header)[1].split('}')[0]"
          - "(rf_image_target_enabled | bool) or image_upload_location_header not in rf_image_target_server or rf_image_marker_begin in rf_image_target_server.splitlines()"
        fail_msg: A different image route is already present; review it before proceeding.

    - name: Install only the bounded RF image upload location
      ansible.builtin.blockinfile:
        path: "{{ rf_image_target_path }}"
        insertafter: "^    server_name {{ rf_image_target_hostname | regex_escape }};$"
        marker: '    # {mark} HONEY SCHOOL IMAGE UPLOAD ROUTES'
        backup: true
        state: "{{ 'present' if rf_image_target_enabled | bool else 'absent' }}"
        block: |
          {% for upload_route in [
            {'location': '~ ^/api/(?:materials/[^/]+/(?:image-page|assets/images)|schedule/lessons/[^/]+/image-page)$', 'limit': '21m'},
            {'location': '= /api/worksheet-imports', 'limit': '129m'},
            {'location': '= /api/materials/ai-draft', 'limit': '3m'}
          ] %}
          location {{ upload_route.location }} {
              client_max_body_size {{ upload_route.limit }};
              proxy_pass https://{{ rf_edge_origin_address }};
              proxy_http_version 1.1;
              proxy_ssl_server_name on;
              proxy_ssl_name {{ rf_image_origin_hostname }};
              proxy_ssl_protocols TLSv1.2;
              proxy_ssl_session_reuse off;
              proxy_ssl_verify on;
              proxy_ssl_verify_depth 3;
              proxy_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;
              proxy_set_header Host {{ rf_image_origin_hostname }};
              proxy_set_header X-Real-IP $remote_addr;
              proxy_set_header X-Forwarded-Host $host;
              proxy_set_header X-Forwarded-For $remote_addr;
              proxy_set_header X-Forwarded-Proto https;
              proxy_set_header Upgrade $http_upgrade;
              proxy_set_header Connection $playsay_rf_connection_upgrade;
              proxy_read_timeout 3600s;
              proxy_send_timeout 3600s;
              proxy_request_buffering off;
              proxy_buffering off;
              proxy_set_header Accept-Encoding "";
              sub_filter_once off;
              sub_filter_types application/javascript text/javascript text/css;
              sub_filter 'https://{{ rf_image_origin_hostname }}' 'https://{{ rf_image_target_hostname }}';
              sub_filter 'wss://{{ rf_image_origin_hostname }}' 'wss://{{ rf_image_target_hostname }}';
          }
          {% endfor %}
      when: image_upload_location_header not in rf_image_target_server or rf_image_marker_begin in rf_image_target_server.splitlines()
      register: rf_image_route_edit
      notify: reload nginx

    - name: Validate the changed RF nginx configuration
      ansible.builtin.command:
        cmd: nginx -t
      changed_when: false
      when: not ansible_check_mode

    - name: Activate the validated RF route
      ansible.builtin.meta: flush_handlers
      when: not ansible_check_mode
  rescue:
    - name: Restore the RF route file after a failed change
      ansible.builtin.copy:
        src: "{{ rf_image_route_edit.backup_file }}"
        dest: "{{ rf_image_target_path }}"
        owner: root
        group: root
        mode: "0644"
        remote_src: true
      when:
        - not ansible_check_mode
        - rf_image_route_edit.changed | default(false)
        - rf_image_route_edit.backup_file is defined

    - name: Validate the restored RF configuration
      ansible.builtin.command:
        cmd: nginx -t
      changed_when: false
      when: not ansible_check_mode

    - name: Reload the restored RF configuration
      ansible.builtin.service:
        name: nginx
        state: reloaded
      when:
        - not ansible_check_mode
        - rf_image_route_edit.changed | default(false)
        - rf_image_route_edit.backup_file is defined

    - name: Stop after the failed RF reconciliation
      ansible.builtin.fail:
        msg: Image upload route reconciliation failed; any modified RF route file was restored.
