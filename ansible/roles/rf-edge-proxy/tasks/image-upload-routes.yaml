---
- name: Safely reconcile the RF production image upload routes
  vars:
    image_upload_location_header: 'location ~ ^/api/(?:materials/[^/]+/(?:image-page|assets/images)|schedule/lessons/[^/]+/image-page)$ {'
    worksheet_upload_location_header: 'location = /api/worksheet-imports {'
    draft_image_location_header: 'location = /api/materials/ai-draft {'
  block:
    - name: Read the active RF route file
      ansible.builtin.slurp:
        path: /etc/nginx/conf.d/playsay-honey-rf-edge.conf
      register: rf_image_active_routes

    - name: Confirm the last matching production server is HTTPS
      ansible.builtin.assert:
        that:
          - "(rf_image_active_routes.content | b64decode).split('server_name online.honeyschool.ru;') | length == 3"
          - "'listen 443 ssl' in (rf_image_active_routes.content | b64decode).split('server_name online.honeyschool.ru;')[1].rsplit('server {', 1)[-1]"
        fail_msg: The production RF route layout changed; review before reconciling.

    - name: Isolate the production HTTPS server
      ansible.builtin.set_fact:
        rf_image_prod_server: "{{ (rf_image_active_routes.content | b64decode).split('server_name online.honeyschool.ru;')[2].split('server {')[0] }}"

    - name: Refuse a conflicting pre-existing image route
      ansible.builtin.assert:
        that:
          - "'location / {' in rf_image_prod_server"
          - "'schedule/lessons/[^/]+/image-page' not in rf_image_prod_server or image_upload_location_header in rf_image_prod_server"
          - "(image_upload_location_header in rf_image_prod_server) == (worksheet_upload_location_header in rf_image_prod_server)"
          - "(image_upload_location_header in rf_image_prod_server) == (draft_image_location_header in rf_image_prod_server)"
          - "'/api/worksheet-imports' not in rf_image_prod_server or worksheet_upload_location_header in rf_image_prod_server"
          - "'/api/materials/ai-draft' not in rf_image_prod_server or draft_image_location_header in rf_image_prod_server"
          - "image_upload_location_header not in rf_image_prod_server or 'client_max_body_size 21m;' in rf_image_prod_server.split(image_upload_location_header)[1].split('}')[0]"
          - "worksheet_upload_location_header not in rf_image_prod_server or 'client_max_body_size 129m;' in rf_image_prod_server.split(worksheet_upload_location_header)[1].split('}')[0]"
          - "draft_image_location_header not in rf_image_prod_server or 'client_max_body_size 3m;' in rf_image_prod_server.split(draft_image_location_header)[1].split('}')[0]"
          - "(image_upload_routes_prod_enabled | default(true) | bool) or image_upload_location_header not in rf_image_prod_server or '# BEGIN HONEY SCHOOL IMAGE UPLOAD ROUTES' in rf_image_prod_server"
        fail_msg: A different production image route is already present; review it before proceeding.

    - name: Install only the bounded RF image upload location
      ansible.builtin.blockinfile:
        path: /etc/nginx/conf.d/playsay-honey-rf-edge.conf
        insertafter: '^    server_name online\.honeyschool\.ru;$'
        marker: '    # {mark} HONEY SCHOOL IMAGE UPLOAD ROUTES'
        backup: true
        state: "{{ 'present' if image_upload_routes_prod_enabled | default(true) | bool else 'absent' }}"
        block: |
          {% for upload_route in [
            {'location': '~ ^/api/(?:materials/[^/]+/(?:image-page|assets/images)|schedule/lessons/[^/]+/image-page)$', 'limit': '21m'},
            {'location': '= /api/worksheet-imports', 'limit': '129m'},
            {'location': '= /api/materials/ai-draft', 'limit': '3m'}
          ] %}
          location {{ upload_route.location }} {
              client_max_body_size {{ upload_route.limit }};
              proxy_pass https://{{ rf_edge_origin_address }};
              proxy_http_version 1.1;
              proxy_ssl_server_name on;
              proxy_ssl_name online.honey.school;
              proxy_ssl_protocols TLSv1.2;
              proxy_ssl_session_reuse off;
              proxy_ssl_verify on;
              proxy_ssl_verify_depth 3;
              proxy_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;
              proxy_set_header Host online.honey.school;
              proxy_set_header X-Real-IP $remote_addr;
              proxy_set_header X-Forwarded-Host $host;
              proxy_set_header X-Forwarded-For $remote_addr;
              proxy_set_header X-Forwarded-Proto https;
              proxy_set_header Upgrade $http_upgrade;
              proxy_set_header Connection $playsay_rf_connection_upgrade;
              proxy_read_timeout 3600s;
              proxy_send_timeout 3600s;
              proxy_request_buffering off;
              proxy_buffering off;
              proxy_set_header Accept-Encoding "";
              sub_filter_once off;
              sub_filter_types application/javascript text/javascript text/css;
              sub_filter 'https://online.honey.school' 'https://online.honeyschool.ru';
              sub_filter 'wss://online.honey.school' 'wss://online.honeyschool.ru';
          }
          {% endfor %}
      when: image_upload_location_header not in rf_image_prod_server or '# BEGIN HONEY SCHOOL IMAGE UPLOAD ROUTES' in rf_image_prod_server
      register: rf_image_route_edit
      notify: reload nginx

    - name: Validate the changed RF nginx configuration
      ansible.builtin.command:
        cmd: nginx -t
      changed_when: false
      when: not ansible_check_mode

    - name: Activate the validated RF route
      ansible.builtin.meta: flush_handlers
      when: not ansible_check_mode
  rescue:
    - name: Restore the RF route file after a failed change
      ansible.builtin.copy:
        src: "{{ rf_image_route_edit.backup_file }}"
        dest: /etc/nginx/conf.d/playsay-honey-rf-edge.conf
        owner: root
        group: root
        mode: "0644"
        remote_src: true
      when:
        - not ansible_check_mode
        - rf_image_route_edit.changed | default(false)
        - rf_image_route_edit.backup_file is defined

    - name: Validate the restored RF configuration
      ansible.builtin.command:
        cmd: nginx -t
      changed_when: false
      when: not ansible_check_mode

    - name: Reload the restored RF configuration
      ansible.builtin.service:
        name: nginx
        state: reloaded
      when:
        - not ansible_check_mode
        - rf_image_route_edit.changed | default(false)
        - rf_image_route_edit.backup_file is defined

    - name: Stop after the failed RF reconciliation
      ansible.builtin.fail:
        msg: Image upload route reconciliation failed; any modified RF route file was restored.
