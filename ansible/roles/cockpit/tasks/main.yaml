---
- name: Install Cockpit visual host tooling
  ansible.builtin.apt:
    name:
      - cockpit
      - cockpit-machines
      - cockpit-networkmanager
      - cockpit-storaged
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: Create Cockpit socket override directory
  ansible.builtin.file:
    path: /etc/systemd/system/cockpit.socket.d
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Bind Cockpit only to the WireGuard management address
  ansible.builtin.copy:
    dest: /etc/systemd/system/cockpit.socket.d/10-playsay-vpn-only.conf
    owner: root
    group: root
    mode: "0644"
    content: |
      [Socket]
      ListenStream=
      ListenStream={{ cockpit_listen_address }}:{{ cockpit_listen_port }}
  register: cockpit_socket_override

- name: Install the VPN-gated Cockpit starter
  ansible.builtin.copy:
    dest: /etc/systemd/system/playsay-cockpit-vpn.service
    owner: root
    group: root
    mode: "0644"
    content: |
      [Unit]
      Description=Start Cockpit after the Play&Say management VPN
      Requires=wg-quick@{{ wireguard_interface }}.service
      After=wg-quick@{{ wireguard_interface }}.service

      [Service]
      Type=oneshot
      RemainAfterExit=yes
      ExecStart=/usr/bin/systemctl start cockpit.socket
      ExecStop=/usr/bin/systemctl stop cockpit.socket

      [Install]
      WantedBy=multi-user.target
  register: cockpit_vpn_starter

- name: Reload systemd after Cockpit unit changes
  ansible.builtin.systemd_service:
    daemon_reload: true
  when: cockpit_socket_override.changed or cockpit_vpn_starter.changed

- name: Remove direct Cockpit target enablement
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop:
    - /etc/systemd/system/sockets.target.wants/cockpit.socket
    - /etc/systemd/system/multi-user.target.wants/cockpit.socket
  when: cockpit_enabled | bool

- name: Keep the VPN-gated Cockpit starter disabled until approval
  ansible.builtin.systemd_service:
    name: playsay-cockpit-vpn.service
    enabled: false
    state: stopped
  when: not cockpit_enabled | bool

- name: Enable Cockpit through the late VPN-gated starter
  ansible.builtin.systemd_service:
    name: playsay-cockpit-vpn.service
    enabled: true
    state: started
  when: cockpit_enabled | bool

- name: Restart Cockpit after its VPN-only binding changes
  ansible.builtin.systemd_service:
    name: cockpit.socket
    state: restarted
  when:
    - cockpit_enabled | bool
    - cockpit_socket_override.changed

- name: Read Cockpit listeners
  ansible.builtin.command:
    cmd: ss -lntH sport = :{{ cockpit_listen_port }}
  register: cockpit_listeners
  changed_when: false
  when: cockpit_enabled | bool

- name: Assert Cockpit is not listening on a public wildcard
  ansible.builtin.assert:
    that:
      - "cockpit_listen_address in cockpit_listeners.stdout"
      - "'0.0.0.0:' + (cockpit_listen_port | string) not in cockpit_listeners.stdout"
      - "'[::]:' + (cockpit_listen_port | string) not in cockpit_listeners.stdout"
  when: cockpit_enabled | bool
