---
- name: Install Docker packages from Ubuntu repositories
  ansible.builtin.apt:
    name:
      - docker.io
      - docker-buildx
      - docker-compose-v2
    state: present
  when: install_docker | bool

- name: Enable Docker daemon
  ansible.builtin.service:
    name: docker
    enabled: true
    state: started
  when: install_docker | bool

- name: Add admin user to docker group
  ansible.builtin.user:
    name: "{{ admin_user }}"
    groups: docker
    append: true
  when: install_docker | bool
