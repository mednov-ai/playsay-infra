---
# Russian ingress for the public production browser/auth routes. The Selectel
# ingress terminates client TLS and proxies over verified TLS to the AX41 edge.
rf_edge_origin_address: 65.109.55.110
rf_edge_certificate_directory: /etc/letsencrypt/live/honeyschool.ru
rf_edge_acme_webroot: /var/www/playsay-rf-edge-acme
rf_edge_tls_protocols: TLSv1.2
rf_edge_tls_enabled: true
rf_edge_routes:
  - hostname: honeyschool.ru
    aliases:
      - www.honeyschool.ru
    origin_hostname: honey.school
    origin_tls_hostname: online.honey.school
    kind: application
  - hostname: ops.honey.school
    origin_hostname: ops.honey.school
    certificate_directory: /etc/letsencrypt/live/ops.honey.school
    kind: keycloak
    realm: playsay
