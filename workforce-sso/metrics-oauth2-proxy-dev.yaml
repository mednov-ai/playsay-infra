apiVersion: v1
kind: ConfigMap
metadata:
  name: workforce-metrics-upstream
  namespace: monitoring
data:
  default.conf: |
    server {
      listen 8080;
      server_name _;

      location ~ ^/(api/v1/admin|debug|flags|metrics)(/|$) {
        return 404;
      }

      location / {
        proxy_pass http://monitoring-lite-victoria-metrics.monitoring.svc.cluster.local:8428/victoria-metrics/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      }
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: workforce-metrics-oauth2-proxy
  namespace: monitoring
  labels:
    app.kubernetes.io/name: workforce-metrics-oauth2-proxy
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: workforce-metrics-oauth2-proxy
  template:
    metadata:
      labels:
        app.kubernetes.io/name: workforce-metrics-oauth2-proxy
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: oauth2-proxy
          image: quay.io/oauth2-proxy/oauth2-proxy:v7.12.0
          imagePullPolicy: IfNotPresent
          args:
            - --http-address=0.0.0.0:4180
            - --provider=oidc
            - --oidc-issuer-url=https://ops.honey.school/keycloak/realms/workforce
            - --redirect-url=https://metrics.dev.ops.honey.school/oauth2/callback
            - --scope=openid profile email groups
            - --allowed-group=developers
            - --allowed-group=release-operators
            - --allowed-group=platform-admins
            - --email-domain=*
            - --upstream=http://127.0.0.1:8080
            - --reverse-proxy=true
            - --cookie-secure=true
            - --cookie-samesite=lax
            - --cookie-expire=8h
            - --cookie-refresh=1h
            - --set-xauthrequest=true
            - --pass-authorization-header=true
          env:
            - name: OAUTH2_PROXY_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: workforce-metrics-oidc
                  key: client-id
            - name: OAUTH2_PROXY_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: workforce-metrics-oidc
                  key: client-secret
            - name: OAUTH2_PROXY_COOKIE_SECRET
              valueFrom:
                secretKeyRef:
                  name: workforce-metrics-oidc
                  key: cookie-secret
          ports:
            - name: http
              containerPort: 4180
          readinessProbe:
            httpGet:
              path: /ping
              port: http
          livenessProbe:
            httpGet:
              path: /ping
              port: http
          resources:
            requests:
              cpu: 20m
              memory: 48Mi
            limits:
              cpu: 200m
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
        - name: protected-upstream
          image: nginxinc/nginx-unprivileged:1.29.4-alpine
          imagePullPolicy: IfNotPresent
          ports:
            - name: upstream
              containerPort: 8080
          readinessProbe:
            tcpSocket:
              port: upstream
          livenessProbe:
            tcpSocket:
              port: upstream
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 100m
              memory: 64Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: upstream-config
              mountPath: /etc/nginx/conf.d/default.conf
              subPath: default.conf
              readOnly: true
      volumes:
        - name: upstream-config
          configMap:
            name: workforce-metrics-upstream
---
apiVersion: v1
kind: Service
metadata:
  name: workforce-metrics-oauth2-proxy
  namespace: monitoring
spec:
  type: NodePort
  selector:
    app.kubernetes.io/name: workforce-metrics-oauth2-proxy
  ports:
    - name: http
      port: 80
      targetPort: http
      nodePort: 32089
