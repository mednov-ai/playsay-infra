apiVersion: argoproj.io/v1alpha1
kind: Application
metadata: {name: worksheet-import-service, namespace: argocd}
spec:
  project: default
  source:
    repoURL: https://github.com/mednov-ai/playsay-infra.git
    targetRevision: release/01.006.03
    path: helm-charts/worksheet-import-service
    helm: {valueFiles: [values-prod.yaml]}
  destination: {server: 'https://kubernetes.default.svc', namespace: playsay-prod}
  syncPolicy:
    automated: {prune: true, selfHeal: true}
    syncOptions: [CreateNamespace=true]
