apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: game-adapter-service
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/mednov-ai/playsay-infra.git
    targetRevision: release/01.006.14
    path: helm-charts/game-adapter-service
    helm:
      valueFiles:
        - values-prod.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: playsay-prod
  syncPolicy:
    syncOptions:
      - CreateNamespace=true
