apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: stack-candidate-acceptance
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/mednov-ai/playsay-infra.git
    targetRevision: develop
    path: migrations/ax41/staged/stack-upgrade/isolated-dev-acceptance
    helm:
      valuesObject:
        enabled: true
        probeOnly: true
  destination:
    server: https://kubernetes.default.svc
    namespace: playsay-dev
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
