apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: vocabulary-service
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/mednov-ai/playsay-infra.git
    targetRevision: legacy/play-and-say-vps
    path: helm-charts/vocabulary-service
    helm:
      valueFiles: [values-dev.yaml]
  destination:
    server: https://kubernetes.default.svc
    namespace: playsay-dev
  ignoreDifferences:
    - group: apps
      kind: Deployment
      name: vocabulary-service
      namespace: playsay-dev
      jsonPointers: [/spec/replicas]
  syncPolicy:
    automated: { prune: true, selfHeal: true }
    syncOptions: [CreateNamespace=true, RespectIgnoreDifferences=true]
