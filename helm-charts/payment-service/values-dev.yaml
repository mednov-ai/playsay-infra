image:
  repository: ghcr.io/mednov-ai/playsay-payment-service
  tag: "dev-198"
imagePullSecrets:
  - name: ghcr-pull-secret
build:
  name: dev-198
  number: "198"
  branch: develop
  branchLabel: dev
  commit: 64ce5e3758f862c873065971d85b5e5f533338b5
  commitShort: "64ce5e3758f8"
updateStrategy:
  type: RollingUpdate
  rollingUpdate:
    maxSurge: 0
    maxUnavailable: 1
service:
  type: ClusterIP
database:
  existingSecret: playsay-app-db
  liquibaseEnabled: "false"
paymentService:
  existingSecret: playsay-payment
  publicBaseUrl: https://online.play-and-say.ru
  provider: yookassa
  yookassa:
    apiUrl: https://api.yookassa.ru/v3
runtime:
  javaToolOptions: "-XX:InitialRAMPercentage=50 -XX:MaxRAMPercentage=75 -XX:+UseStringDeduplication -Djava.security.egd=file:/dev/urandom"
resources:
  requests:
    cpu: 50m
    memory: 256Mi
  limits:
    cpu: "1"
    memory: 768Mi
