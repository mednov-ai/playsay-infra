image:
  repository: ghcr.io/mednov-ai/playsay-payment-service
  tag: "payment-dev-2"
imagePullSecrets:
  - name: ghcr-pull-secret
build:
  name: payment-dev-2
  number: "2"
  branch: develop
  branchLabel: payment-dev
  commit: 3d32a791d6682a65d1861234b4bab61ddf03dcf7
  commitShort: "3d32a791d668"
updateStrategy:
  type: RollingUpdate
  rollingUpdate:
    maxSurge: 0
    maxUnavailable: 1
service:
  type: ClusterIP
database:
  existingSecret: playsay-app-db
  liquibaseEnabled: "false"
  hikariMaxPoolSize: "3"
paymentService:
  existingSecret: playsay-payment
  publicBaseUrl: https://online.play-and-say.ru
  provider: yookassa
  yookassa:
    apiUrl: https://api.yookassa.ru/v3
runtime:
  javaToolOptions: "-XX:InitialRAMPercentage=25 -XX:MaxRAMPercentage=55 -XX:+UseStringDeduplication -Djava.security.egd=file:/dev/urandom"
resources:
  requests:
    cpu: 25m
    memory: 96Mi
  limits:
    cpu: 500m
    memory: 384Mi
