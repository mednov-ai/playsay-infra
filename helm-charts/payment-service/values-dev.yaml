image:
  repository: ghcr.io/mednov-ai/playsay-payment-service
  tag: "dev-197"
imagePullSecrets:
  - name: ghcr-pull-secret
build:
  name: dev-197
  number: "197"
  branch: develop
  branchLabel: dev
  commit: 8f71d44c908dd7b18a4caa59b1a95a4bf5f86c0b
  commitShort: "8f71d44c908d"
updateStrategy:
  type: RollingUpdate
  rollingUpdate:
    maxSurge: 0
    maxUnavailable: 1
service:
  type: ClusterIP
database:
  existingSecret: playsay-app-db
  liquibaseEnabled: "false"
paymentService:
  existingSecret: playsay-payment
  publicBaseUrl: https://online.play-and-say.ru
  provider: yookassa
  yookassa:
    apiUrl: https://api.yookassa.ru/v3
runtime:
  javaToolOptions: "-XX:InitialRAMPercentage=50 -XX:MaxRAMPercentage=75 -XX:+UseStringDeduplication -Djava.security.egd=file:/dev/urandom"
resources:
  requests:
    cpu: 50m
    memory: 256Mi
  limits:
    cpu: "1"
    memory: 768Mi
