image:
  repository: ghcr.io/mednov-ai/playsay-payment-service
  tag: "dev-196"
imagePullSecrets:
  - name: ghcr-pull-secret
build:
  name: dev-196
  number: "196"
  branch: develop
  branchLabel: dev
  commit: f83011932db211d0f0b7d29338c09fd889325dcc
  commitShort: "f83011932db2"
updateStrategy:
  type: RollingUpdate
  rollingUpdate:
    maxSurge: 0
    maxUnavailable: 1
service:
  type: ClusterIP
database:
  existingSecret: playsay-app-db
  liquibaseEnabled: "false"
paymentService:
  existingSecret: playsay-payment
  publicBaseUrl: https://online.play-and-say.ru
  provider: yookassa
