image:
  repository: ghcr.io/mednov-ai/playsay-payment-service
  tag: "dev-194"
imagePullSecrets:
  - name: ghcr-pull-secret
build:
  name: dev-194
  number: "194"
  branch: develop
  branchLabel: dev
  commit: bbb8a00f8ec3ac7e66d3da6e3a3a45a2c105edd6
  commitShort: "bbb8a00f8ec3"
updateStrategy:
  type: RollingUpdate
  rollingUpdate:
    maxSurge: 0
    maxUnavailable: 1
service:
  type: ClusterIP
database:
  existingSecret: playsay-app-db
  liquibaseEnabled: "false"
paymentService:
  existingSecret: playsay-payment
  publicBaseUrl: https://online.play-and-say.ru
  provider: yookassa
  yookassa:
    apiUrl: https://api.yookassa.ru/v3
runtime:
  javaToolOptions: "-XX:InitialRAMPercentage=50 -XX:MaxRAMPercentage=75 -XX:+UseStringDeduplication -Djava.security.egd=file:/dev/urandom"
resources:
  requests:
    cpu: 50m
    memory: 256Mi
  limits:
    cpu: "1"
    memory: 768Mi
