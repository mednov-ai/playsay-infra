image:
  repository: ghcr.io/mednov-ai/playsay-payment-service
  tag: "dev-200"
imagePullSecrets:
  - name: ghcr-pull-secret
build:
  name: dev-200
  number: "200"
  branch: develop
  branchLabel: dev
  commit: 7a8c1a4095f9d6f30bd51614d61b7d2cc4a2f0a4
  commitShort: "7a8c1a4095f9"
updateStrategy:
  type: RollingUpdate
  rollingUpdate:
    maxSurge: 0
    maxUnavailable: 1
service:
  type: ClusterIP
database:
  existingSecret: playsay-app-db
  liquibaseEnabled: "false"
paymentService:
  existingSecret: playsay-payment
  publicBaseUrl: https://online.play-and-say.ru
  provider: yookassa
  yookassa:
    apiUrl: https://api.yookassa.ru/v3
runtime:
  javaToolOptions: "-XX:InitialRAMPercentage=50 -XX:MaxRAMPercentage=75 -XX:+UseStringDeduplication -Djava.security.egd=file:/dev/urandom"
resources:
  requests:
    cpu: 50m
    memory: 256Mi
  limits:
    cpu: "1"
    memory: 768Mi
