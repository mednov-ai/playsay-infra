apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "payment-service.fullname" . }}
  labels:
    {{- include "payment-service.labels" . | nindent 4 }}
    {{- include "payment-service.buildLabels" . | nindent 4 }}
  annotations:
    {{- include "payment-service.buildAnnotations" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  {{- with .Values.updateStrategy }}
  strategy:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "payment-service.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "payment-service.selectorLabels" . | nindent 8 }}
        {{- include "payment-service.buildLabels" . | nindent 8 }}
      annotations:
        {{- include "payment-service.buildAnnotations" . | nindent 8 }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: payment-service
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.service.targetPort }}
          env:
            {{- if .Values.runtime.javaToolOptions }}
            - name: JAVA_TOOL_OPTIONS
              value: {{ .Values.runtime.javaToolOptions | quote }}
            {{- end }}
            - name: SERVER_PORT
              value: {{ .Values.service.targetPort | quote }}
            - name: PLAYSAY_DB_JDBC_URL
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.database.existingSecret | quote }}
                  key: {{ .Values.database.jdbcUriKey | quote }}
            - name: PLAYSAY_DB_USERNAME
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.database.existingSecret | quote }}
                  key: {{ .Values.database.usernameKey | quote }}
            - name: PLAYSAY_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.database.existingSecret | quote }}
                  key: {{ .Values.database.passwordKey | quote }}
            - name: PLAYSAY_PAYMENT_LIQUIBASE_ENABLED
              value: {{ .Values.database.liquibaseEnabled | quote }}
            - name: PLAYSAY_PAYMENT_SERVICE_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.paymentService.existingSecret | quote }}
                  key: {{ .Values.paymentService.serviceTokenKey | quote }}
                  optional: true
            - name: PLAYSAY_PAYMENT_PUBLIC_BASE_URL
              value: {{ .Values.paymentService.publicBaseUrl | quote }}
            - name: PLAYSAY_PAYMENT_PROVIDER
              value: {{ .Values.paymentService.provider | quote }}
            - name: PLAYSAY_YOOKASSA_API_URL
              value: {{ .Values.paymentService.yookassa.apiUrl | quote }}
            - name: PLAYSAY_YOOKASSA_SHOP_ID
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.paymentService.existingSecret | quote }}
                  key: {{ .Values.paymentService.yookassa.shopIdKey | quote }}
                  optional: true
            - name: PLAYSAY_YOOKASSA_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.paymentService.existingSecret | quote }}
                  key: {{ .Values.paymentService.yookassa.secretKeyKey | quote }}
                  optional: true
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 2
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            initialDelaySeconds: 20
            periodSeconds: 20
            timeoutSeconds: 2
          startupProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            failureThreshold: 24
            periodSeconds: 10
            timeoutSeconds: 2
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
