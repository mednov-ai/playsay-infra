image:
  repository: ghcr.io/mednov-ai/playsay-game-adapter-service
  tag: "0.1.0"
  digest: ""
  pullPolicy: IfNotPresent

imagePullSecrets: []

build:
  name: local-0
  number: "0"
  branch: local
  branchLabel: local
  commit: unknown
  commitShort: unknown

replicaCount: 1

service:
  type: ClusterIP
  port: 80
  targetPort: 8088

adapter:
  existingSecret: playsay-game-adapter
  serviceTokenKey: service-token
  openAiExistingSecret: playsay-openai
  openAiApiKeyKey: api-key
  model: gpt-5.6-sol
  baseUrl: https://api.openai.com/v1
  reasoningEffort: medium

resources:
  requests:
    cpu: 250m
    memory: 256Mi
  limits:
    cpu: "1"
    memory: 1Gi
