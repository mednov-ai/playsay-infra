apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "game-adapter-service.fullname" . }}
  labels:
    {{- include "game-adapter-service.labels" . | nindent 4 }}
    {{- include "game-adapter-service.buildLabels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "game-adapter-service.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "game-adapter-service.selectorLabels" . | nindent 8 }}
        {{- include "game-adapter-service.buildLabels" . | nindent 8 }}
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: game-adapter-service
          image: "{{ .Values.image.repository }}{{ if .Values.image.digest }}@{{ .Values.image.digest }}{{ else }}:{{ .Values.image.tag }}{{ end }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            readOnlyRootFilesystem: true
          ports:
            - name: http
              containerPort: {{ .Values.service.targetPort }}
          env:
            - name: PORT
              value: {{ .Values.service.targetPort | quote }}
            - name: PLAY_SAY_GAME_ADAPTER_SERVICE_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.adapter.existingSecret | quote }}
                  key: {{ .Values.adapter.serviceTokenKey | quote }}
            - name: OPENAI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.adapter.openAiExistingSecret | quote }}
                  key: {{ .Values.adapter.openAiApiKeyKey | quote }}
            - name: OPENAI_MODEL
              value: {{ .Values.adapter.model | quote }}
            - name: OPENAI_BASE_URL
              value: {{ .Values.adapter.baseUrl | quote }}
            - name: OPENAI_REASONING_EFFORT
              value: {{ .Values.adapter.reasoningEffort | quote }}
          readinessProbe:
            httpGet: { path: /actuator/health, port: http }
            initialDelaySeconds: 2
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /actuator/health, port: http }
            initialDelaySeconds: 10
            periodSeconds: 20
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
