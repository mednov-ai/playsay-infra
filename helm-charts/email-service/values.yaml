image:
  repository: ghcr.io/mednov-ai/playsay-email-service
  tag: "0.1.0"
  pullPolicy: IfNotPresent

imagePullSecrets: []

build:
  name: local-0
  number: "0"
  branch: local
  branchLabel: local
  commit: unknown
  commitShort: unknown

replicaCount: 1

service:
  type: ClusterIP
  port: 80
  targetPort: 8086
  nodePort: null

database:
  existingSecret: playsay-app-db
  jdbcUriKey: jdbc-uri
  usernameKey: username
  passwordKey: password
  liquibaseEnabled: "false"
  hikariMaxPoolSize: ""

emailService:
  existingSecret: playsay-email
  deliveryProvider: smtp
  serviceTokenKey: service-token
  fromAddressKey: from-address
  fromName: Play&Say
  replayEncryptionKeyKey: replay-encryption-key
  defaultReplayTtl: PT72H
  providerTrackingTtl: PT72H
  providerReconcileWindow: PT5M
  providerReconcileOverlap: PT1M
  providerReconcilePollMs: "30000"
  webhookCheckMs: "3600000"
  smtp:
    hostKey: smtp-host
    portKey: smtp-port
    usernameKey: smtp-username
    passwordKey: smtp-password
    authKey: smtp-auth
    starttlsKey: smtp-starttls
  unisender:
    apiBaseUrl: https://goapi.unisender.ru/ru/transactional/api/v1
    userId: ""
    apiKeyKey: unisender-api-key
    webhookUrl: ""

runtime:
  javaToolOptions: ""

resources:
  requests:
    cpu: 100m
    memory: 192Mi
  limits:
    cpu: "1"
    memory: 512Mi
