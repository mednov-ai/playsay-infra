image:
  repository: ghcr.io/mednov-ai/playsay-email-service
  tag: "email-dev-6"
imagePullSecrets:
  - name: ghcr-pull-secret
build:
  name: email-dev-6
  number: "6"
  branch: develop
  branchLabel: email-dev
  commit: 6d2fcaf693f61b46021d8fea494bbd5f0641edca
  commitShort: "6d2fcaf693f6"
updateStrategy:
  type: RollingUpdate
  rollingUpdate:
    maxSurge: 0
    maxUnavailable: 1
service:
  type: ClusterIP
database:
  existingSecret: playsay-app-db
  liquibaseEnabled: "false"
  hikariMaxPoolSize: "3"
emailService:
  existingSecret: playsay-email
  deliveryProvider: unisender-api
  fromName: Play&Say
  unisender:
    apiBaseUrl: https://goapi.unisender.ru/ru/transactional/api/v1
    userId: "8236338"
runtime:
  javaToolOptions: "-XX:InitialRAMPercentage=50 -XX:MaxRAMPercentage=75 -XX:+UseStringDeduplication -Djava.security.egd=file:/dev/urandom"
resources:
  requests:
    cpu: 50m
    memory: 256Mi
  limits:
    cpu: "1"
    memory: 768Mi
