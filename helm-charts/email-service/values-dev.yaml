image:
  repository: ghcr.io/mednov-ai/playsay-email-service
  tag: "email-dev-1"
imagePullSecrets:
  - name: ghcr-pull-secret
build:
  name: email-dev-1
  number: "1"
  branch: develop
  branchLabel: email-dev
  commit: fef1492dbc085a24ec6bd80a3c43da587e45b3b7
  commitShort: "fef1492dbc08"
updateStrategy:
  type: RollingUpdate
  rollingUpdate:
    maxSurge: 0
    maxUnavailable: 1
service:
  type: ClusterIP
database:
  existingSecret: playsay-app-db
  liquibaseEnabled: "false"
  hikariMaxPoolSize: "3"
emailService:
  existingSecret: playsay-email
  deliveryProvider: mailjet-api
  fromName: Play&Say
  defaultReplayTtl: PT72H
  providerTrackingTtl: PT72H
  providerReconcileWindow: PT5M
  providerReconcileOverlap: PT1M
  providerReconcilePollMs: "30000"
  webhookCheckMs: "3600000"
  unisender:
    apiBaseUrl: https://goapi.unisender.ru/ru/transactional/api/v1
    userId: "8236338"
    webhookUrl: https://dev.online.honey.school/api/webhooks/unisender
  mailjet:
    environment: dev
    webhookUrl: https://dev.online.honey.school/api/webhooks/mailjet
runtime:
  javaToolOptions: "-XX:InitialRAMPercentage=15 -XX:MaxRAMPercentage=45 -XX:MaxMetaspaceSize=128m -XX:ReservedCodeCacheSize=32m -XX:ActiveProcessorCount=1 -XX:+UseStringDeduplication -Djava.security.egd=file:/dev/urandom"
resources:
  requests:
    cpu: 25m
    memory: 64Mi
  limits:
    cpu: 500m
    memory: 320Mi
