apiVersion: v1
kind: Service
metadata:
  name: {{ .Values.releaseName }}-frontend-nodeport
  labels:
    app.kubernetes.io/name: multica
    app.kubernetes.io/instance: {{ .Values.releaseName }}
    app.kubernetes.io/component: frontend-nodeport
    app.kubernetes.io/managed-by: {{ .Release.Service }}
spec:
  type: {{ .Values.frontend.service.type }}
  ports:
    - name: http
      port: {{ .Values.frontend.service.port }}
      targetPort: 3000
      protocol: TCP
      {{- if and (eq .Values.frontend.service.type "NodePort") .Values.frontend.service.nodePort }}
      nodePort: {{ .Values.frontend.service.nodePort }}
      {{- end }}
  selector:
    app.kubernetes.io/name: multica
    app.kubernetes.io/instance: {{ .Values.releaseName }}
    app.kubernetes.io/component: frontend
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Values.releaseName }}-backend-nodeport
  labels:
    app.kubernetes.io/name: multica
    app.kubernetes.io/instance: {{ .Values.releaseName }}
    app.kubernetes.io/component: backend-nodeport
    app.kubernetes.io/managed-by: {{ .Release.Service }}
spec:
  type: {{ .Values.backend.service.type }}
  ports:
    - name: http
      port: {{ .Values.backend.service.port }}
      targetPort: 8080
      protocol: TCP
      {{- if and (eq .Values.backend.service.type "NodePort") .Values.backend.service.nodePort }}
      nodePort: {{ .Values.backend.service.nodePort }}
      {{- end }}
  selector:
    app.kubernetes.io/name: multica
    app.kubernetes.io/instance: {{ .Values.releaseName }}
    app.kubernetes.io/component: backend
