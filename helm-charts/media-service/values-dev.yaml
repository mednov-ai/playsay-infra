image:
  repository: ghcr.io/mednov-ai/playsay-media-service
  tag: "media-dev-9"
imagePullSecrets:
  - name: ghcr-pull-secret
build:
  name: media-dev-9
  number: "9"
  branch: develop
  branchLabel: media-dev
  commit: ab9cf1d6eed55d3550d8489047021699d618caa3
  commitShort: "ab9cf1d6eed5"
updateStrategy:
  type: RollingUpdate
  rollingUpdate:
    maxSurge: 0
    maxUnavailable: 1
service:
  type: ClusterIP
mediaService:
  existingSecret: playsay-media
  sessionTtlSeconds: "900"
  maxUpstreamRangeBytes: "1048576"
  maxThumbnailBytes: "5242880"
  ytdlpPath: /usr/local/bin/yt-dlp
  ffmpegPath: /usr/local/bin/ffmpeg
  youtubeCacheEnabled: "true"
  cacheDownloadTimeoutSeconds: "600"
  cacheMaxVideoBytes: "262144000"
  cacheTempDirectory: /tmp/playsay-media-cache
cacheTempStorage:
  sizeLimit: 1Gi
storage:
  provider: s3
  s3:
    endpoint: http://minio.storage.svc.cluster.local:9000
    region: us-east-1
    bucket: playsay-material-assets
    existingSecret: playsay-object-storage
    pathStyleAccess: "true"
    createBucket: "true"
runtime:
  javaToolOptions: "-XX:InitialRAMPercentage=50 -XX:MaxRAMPercentage=75 -XX:+UseStringDeduplication -Djava.security.egd=file:/dev/urandom"
resources:
  requests:
    cpu: 50m
    memory: 256Mi
  limits:
    cpu: "1"
    memory: 768Mi
