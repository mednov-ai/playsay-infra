image:
  repository: ghcr.io/mednov-ai/playsay-media-service
  tag: "dev-179"
imagePullSecrets:
  - name: ghcr-pull-secret
build:
  name: dev-179
  number: "179"
  branch: develop
  branchLabel: dev
  commit: 71a598819a4056ad38087d012c4d98805e99d851
  commitShort: "71a598819a40"
service:
  type: ClusterIP
mediaService:
  existingSecret: playsay-media
  sessionTtlSeconds: "900"
  maxUpstreamRangeBytes: "1048576"
  maxThumbnailBytes: "5242880"
  ytdlpPath: /usr/local/bin/yt-dlp
storage:
  provider: s3
  s3:
    endpoint: http://minio.storage.svc.cluster.local:9000
    region: us-east-1
    bucket: playsay-material-assets
    existingSecret: playsay-object-storage
    pathStyleAccess: "true"
    createBucket: "true"
runtime:
  javaToolOptions: "-XX:InitialRAMPercentage=50 -XX:MaxRAMPercentage=75 -XX:+UseStringDeduplication -Djava.security.egd=file:/dev/urandom"
resources:
  requests:
    cpu: 150m
    memory: 256Mi
  limits:
    cpu: "1"
    memory: 768Mi
