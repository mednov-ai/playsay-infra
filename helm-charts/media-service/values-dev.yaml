image:
  repository: ghcr.io/mednov-ai/playsay-media-service
  tag: "media-dev-12"
imagePullSecrets:
  - name: ghcr-pull-secret
build:
  name: media-dev-12
  number: "12"
  branch: develop
  branchLabel: media-dev
  commit: 61c2bb3dc08ded7fd08f6de1d0722c736b0961ba
  commitShort: "61c2bb3dc08d"
updateStrategy:
  type: RollingUpdate
  rollingUpdate:
    maxSurge: 0
    maxUnavailable: 1
service:
  type: ClusterIP
mediaService:
  existingSecret: playsay-media
  sessionTtlSeconds: "900"
  maxUpstreamRangeBytes: "1048576"
  maxThumbnailBytes: "5242880"
  ytdlpPath: /usr/local/bin/yt-dlp
  ytdlpPluginDirectory: /usr/local/lib/yt-dlp-plugins
  ytdlpJsRuntime: deno:/usr/local/bin/deno
  ffmpegPath: /usr/local/bin/ffmpeg
  youtubeCacheEnabled: "true"
  cacheDownloadTimeoutSeconds: "600"
  cacheMaxVideoBytes: "262144000"
  cacheTempDirectory: /tmp/playsay-media-cache
youtubePot:
  enabled: true
  providerBaseUrl: http://127.0.0.1:4416
  allowedVideoIds: "WX8HmogNyCY,8ChQVaEAKsk,BwHMMZQGFoM,OsuWvoBWOnA,FkL8j0wIRf8"
  playerClients: mweb
  sleepRequestsSeconds: "1"
  provider:
    image: brainicism/bgutil-ytdlp-pot-provider@sha256:1fd724c0a987a1eaa7e0875667a55770f954d8634fdbba96d858072f4a655afe
    pullPolicy: IfNotPresent
    port: 4416
    resources:
      requests:
        cpu: 25m
        memory: 64Mi
      limits:
        cpu: 500m
        memory: 384Mi
cacheTempStorage:
  sizeLimit: 1Gi
storage:
  provider: s3
  s3:
    endpoint: http://minio.storage.svc.cluster.local:9000
    region: us-east-1
    bucket: playsay-material-assets
    existingSecret: playsay-object-storage
    pathStyleAccess: "true"
    createBucket: "true"
runtime:
  javaToolOptions: "-XX:InitialRAMPercentage=25 -XX:MaxRAMPercentage=50 -XX:+UseStringDeduplication -Djava.security.egd=file:/dev/urandom"
resources:
  requests:
    cpu: 50m
    memory: 256Mi
  limits:
    cpu: "1"
    memory: 896Mi
