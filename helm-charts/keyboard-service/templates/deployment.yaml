apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "keyboard-service.fullname" . }}
  labels:
    {{- include "keyboard-service.labels" . | nindent 4 }}
    {{- include "keyboard-service.buildLabels" . | nindent 4 }}
  annotations:
    {{- include "keyboard-service.buildAnnotations" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  {{- with .Values.updateStrategy }}
  strategy:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "keyboard-service.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "keyboard-service.selectorLabels" . | nindent 8 }}
        {{- include "keyboard-service.buildLabels" . | nindent 8 }}
      annotations:
        {{- include "keyboard-service.buildAnnotations" . | nindent 8 }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: keyboard-service
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.service.targetPort }}
          env:
            {{- if .Values.runtime.javaToolOptions }}
            - name: JAVA_TOOL_OPTIONS
              value: {{ .Values.runtime.javaToolOptions | quote }}
            {{- end }}
            - name: SERVER_PORT
              value: {{ .Values.service.targetPort | quote }}
            - name: SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_ISSUER_URI
              value: {{ .Values.auth.issuerUri | quote }}
            - name: SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_JWK_SET_URI
              value: {{ .Values.auth.jwkSetUri | quote }}
            - name: PLAYSAY_KEYBOARD_DB_JDBC_URL
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.database.existingSecret | quote }}
                  key: {{ .Values.database.jdbcUriKey | quote }}
            - name: PLAYSAY_KEYBOARD_DB_USERNAME
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.database.existingSecret | quote }}
                  key: {{ .Values.database.usernameKey | quote }}
            - name: PLAYSAY_KEYBOARD_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.database.existingSecret | quote }}
                  key: {{ .Values.database.passwordKey | quote }}
            - name: PLAYSAY_KEYBOARD_LIQUIBASE_ENABLED
              value: {{ .Values.database.liquibaseEnabled | quote }}
            - name: PLAYSAY_USER_DATA_SERVICE_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.userData.existingSecret | quote }}
                  key: {{ .Values.userData.serviceTokenKey | quote }}
            {{- if .Values.database.hikariMaxPoolSize }}
            - name: SPRING_DATASOURCE_HIKARI_MAXIMUM_POOL_SIZE
              value: {{ .Values.database.hikariMaxPoolSize | quote }}
            {{- end }}
            {{- if .Values.anonymous.fingerprintSecret.existingSecret }}
            - name: PLAYSAY_KEYBOARD_ANONYMOUS_FINGERPRINT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.anonymous.fingerprintSecret.existingSecret | quote }}
                  key: {{ .Values.anonymous.fingerprintSecret.key | quote }}
            {{- end }}
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 2
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            initialDelaySeconds: 20
            periodSeconds: 20
            timeoutSeconds: 2
          startupProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            failureThreshold: 24
            periodSeconds: 10
            timeoutSeconds: 2
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
