image:
  repository: ghcr.io/mednov-ai/playsay-keyboard-service
  tag: "dev"
imagePullSecrets:
  - name: ghcr-pull-secret
build:
  name: local-0
  number: "0"
  branch: develop
  branchLabel: dev
  commit: unknown
  commitShort: unknown
updateStrategy:
  type: RollingUpdate
  rollingUpdate:
    maxSurge: 0
    maxUnavailable: 1
service:
  type: ClusterIP
database:
  existingSecret: playsay-keyboard-db
  liquibaseEnabled: "false"
runtime:
  javaToolOptions: "-XX:InitialRAMPercentage=50 -XX:MaxRAMPercentage=75 -XX:+UseStringDeduplication -Djava.security.egd=file:/dev/urandom"
