image:
  repository: ghcr.io/mednov-ai/playsay-api-gateway
  tag: "0.1.0"
  pullPolicy: IfNotPresent

imagePullSecrets: []

build:
  name: local-0
  number: "0"
  branch: local
  branchLabel: local
  commit: unknown
  commitShort: unknown

replicaCount: 1

service:
  port: 80
  targetPort: 8080

auth:
  issuerUri: https://ops.play-and-say.ru:18443/keycloak/realms/playsay
  jwkSetUri: https://ops.play-and-say.ru:18443/keycloak/realms/playsay/protocol/openid-connect/certs

database:
  enabled: true
  existingSecret: playsay-app-db
  jdbcUriKey: jdbc-uri
  usernameKey: username
  passwordKey: password
  liquibaseEnabled: "false"

ingress:
  enabled: true
  className: nginx
  host: api-gateway.dev.playsay.local
  tlsSecretName: api-gateway-tls
  clusterIssuer: letsencrypt-http01

resources:
  requests:
    cpu: 50m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 512Mi
