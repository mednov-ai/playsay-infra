image:
  repository: ghcr.io/mednov-ai/playsay-api-gateway
  tag: "0.1.0"
  pullPolicy: IfNotPresent

imagePullSecrets: []

build:
  name: local-0
  number: "0"
  branch: local
  branchLabel: local
  commit: unknown
  commitShort: unknown

replicaCount: 1

service:
  port: 80
  targetPort: 8080

websocket:
  allowedOriginPatterns:
    - http://localhost:[*]
    - http://127.0.0.1:[*]

auth:
  issuerUri: https://ops.play-and-say.ru:18443/keycloak/realms/playsay
  jwkSetUri: https://ops.play-and-say.ru:18443/keycloak/realms/playsay/protocol/openid-connect/certs

ai:
  openai:
    enabled: false
    existingSecret: playsay-openai
    apiKeyKey: api-key
    model: gpt-5.6-sol
    baseUrl: https://api.openai.com/v1
    reasoning:
      materialDraft: high
      answerSuggestion: low
      htmlGameMetadata: low

database:
  enabled: true
  existingSecret: playsay-app-db
  jdbcUriKey: jdbc-uri
  usernameKey: username
  passwordKey: password
  liquibaseEnabled: "false"
  hikariMaxPoolSize: ""

livekit:
  enabled: true
  serverUrl: wss://online.honey.school/livekit
  existingSecret: livekit-keys
  apiKeyKey: api-key
  apiSecretKey: api-secret
  tokenTtlSeconds: "3600"

lessonTranslation:
  enabled: false
  provider: stub
  model: gpt-realtime-translate
  baseUrl: https://api.openai.com/v1
  existingSecret: playsay-openai
  apiKeyKey: api-key

collaboration:
  websocketUrl: wss://online.honey.school/collab/ws
  existingSecret: playsay-collaboration
  tokenSecretKey: token-secret
  serviceTokenKey: service-token
  tokenTtlSeconds: "900"

storage:
  provider: memory
  s3:
    endpoint: ""
    region: us-east-1
    bucket: playsay-material-assets
    existingSecret: playsay-object-storage
    accessKeyKey: access-key
    secretKeyKey: secret-key
    pathStyleAccess: "true"
    createBucket: "false"

mediaService:
  baseUrl: http://media-service.playsay-dev.svc.cluster.local
  existingSecret: playsay-media
  serviceTokenKey: service-token
  cacheRequestTimeoutSeconds: "660"

worksheetImport:
  enabled: "false"
  baseUrl: http://worksheet-import-service.playsay-dev.svc.cluster.local
  existingSecret: playsay-worksheet-import
  serviceTokenKey: service-token

gameAdapterService:
  baseUrl: http://game-adapter-service.playsay-dev.svc.cluster.local
  existingSecret: playsay-game-adapter
  serviceTokenKey: service-token
  enabled: "true"
  pollDelayMs: "3000"

paymentService:
  baseUrl: http://payment-service.playsay-dev.svc.cluster.local
  existingSecret: playsay-payment
  serviceTokenKey: service-token

registrationService:
  baseUrl: http://registration-service.playsay-dev.svc.cluster.local
  existingSecret: playsay-registration
  serviceTokenKey: service-token

userData:
  aiTutorBaseUrl: http://ai-tutor-service.playsay-dev.svc.cluster.local
  vocabularyBaseUrl: http://vocabulary-service.playsay-dev.svc.cluster.local
  keyboardBaseUrl: http://keyboard-service.playsay-dev.svc.cluster.local
  existingSecret: playsay-registration
  serviceTokenKey: service-token

emailService:
  baseUrl: http://email-service.playsay-dev.svc.cluster.local
  existingSecret: playsay-email
  serviceTokenKey: service-token
  mailjetWebhookUsernameKey: mailjet-webhook-username
  mailjetWebhookPasswordKey: mailjet-webhook-password

chatEmail:
  initialDelay: PT2M
  cooldown: PT10M
  pollDelayMs: "30000"
  retryDelays: PT1M,PT5M,PT15M

chatPush:
  enabled: "false"
  publicKey: ""
  existingSecret: playsay-chat-push
  privateKeyKey: private-key
  subjectKey: subject
  pollDelayMs: "3000"
  initialDelayMs: "3000"
  lease: PT1M
  retryDelays: PT10S,PT1M,PT5M

publicAppUrl: https://online.honey.school
publicAppRfUrl: https://online.honey.school

video:
  youtube:
    rfRelay:
      enabled: "false"
      geoCountryHeader: ""
      requireGeoCountry: "true"
    cache:
      enabled: "false"
      pollDelayMs: "5000"
      leaseSeconds: "900"
      retentionDays: "30"

runtime:
  javaToolOptions: ""

ingress:
  enabled: true
  className: nginx
  host: api-gateway.dev.playsay.local
  tlsSecretName: api-gateway-tls
  clusterIssuer: letsencrypt-http01

resources:
  requests:
    cpu: 50m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 512Mi
