image:
  repository: ghcr.io/mednov-ai/playsay-api-gateway
  tag: "0.1.0"
  pullPolicy: IfNotPresent

imagePullSecrets: []

build:
  name: local-0
  number: "0"
  branch: local
  branchLabel: local
  commit: unknown
  commitShort: unknown

replicaCount: 1

service:
  port: 80
  targetPort: 8080

auth:
  issuerUri: https://ops.play-and-say.ru:18443/keycloak/realms/playsay
  jwkSetUri: https://ops.play-and-say.ru:18443/keycloak/realms/playsay/protocol/openid-connect/certs

ai:
  openai:
    enabled: false
    existingSecret: playsay-openai
    apiKeyKey: api-key
    modelKey: model
    baseUrl: https://api.openai.com/v1

database:
  enabled: true
  existingSecret: playsay-app-db
  jdbcUriKey: jdbc-uri
  usernameKey: username
  passwordKey: password
  liquibaseEnabled: "false"
  hikariMaxPoolSize: ""

livekit:
  enabled: true
  serverUrl: wss://online.play-and-say.ru/livekit
  existingSecret: livekit-keys
  apiKeyKey: api-key
  apiSecretKey: api-secret
  tokenTtlSeconds: "3600"

lessonTranslation:
  enabled: false
  provider: stub
  model: gpt-realtime-translate
  baseUrl: https://api.openai.com/v1
  existingSecret: playsay-openai
  apiKeyKey: api-key

collaboration:
  websocketUrl: wss://online.play-and-say.ru/collab/ws
  existingSecret: playsay-collaboration
  tokenSecretKey: token-secret
  serviceTokenKey: service-token
  tokenTtlSeconds: "900"

storage:
  provider: memory
  s3:
    endpoint: ""
    region: us-east-1
    bucket: playsay-material-assets
    existingSecret: playsay-object-storage
    accessKeyKey: access-key
    secretKeyKey: secret-key
    pathStyleAccess: "true"
    createBucket: "false"

mediaService:
  baseUrl: http://media-service.playsay-dev.svc.cluster.local
  existingSecret: playsay-media
  serviceTokenKey: service-token
  cacheRequestTimeoutSeconds: "660"

paymentService:
  baseUrl: http://payment-service.playsay-dev.svc.cluster.local
  existingSecret: playsay-payment
  serviceTokenKey: service-token

registrationService:
  baseUrl: http://registration-service.playsay-dev.svc.cluster.local
  existingSecret: playsay-registration
  serviceTokenKey: service-token

userData:
  aiTutorBaseUrl: http://ai-tutor-service.playsay-dev.svc.cluster.local
  vocabularyBaseUrl: http://vocabulary-service.playsay-dev.svc.cluster.local
  keyboardBaseUrl: http://keyboard-service.playsay-dev.svc.cluster.local
  existingSecret: playsay-registration
  serviceTokenKey: service-token

emailService:
  baseUrl: http://email-service.playsay-dev.svc.cluster.local
  existingSecret: playsay-email
  serviceTokenKey: service-token

publicAppUrl: https://online.play-and-say.ru

video:
  youtube:
    rfRelay:
      enabled: "false"
      geoCountryHeader: ""
      requireGeoCountry: "true"
    cache:
      enabled: "false"
      pollDelayMs: "5000"
      leaseSeconds: "900"
      retentionDays: "30"

runtime:
  javaToolOptions: ""

ingress:
  enabled: true
  className: nginx
  host: api-gateway.dev.playsay.local
  tlsSecretName: api-gateway-tls
  clusterIssuer: letsencrypt-http01

resources:
  requests:
    cpu: 50m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 512Mi
