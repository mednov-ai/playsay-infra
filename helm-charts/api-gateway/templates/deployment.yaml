apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "api-gateway.fullname" . }}
  labels:
    {{- include "api-gateway.labels" . | nindent 4 }}
    {{- include "api-gateway.buildLabels" . | nindent 4 }}
  annotations:
    {{- include "api-gateway.buildAnnotations" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  {{- with .Values.updateStrategy }}
  strategy:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "api-gateway.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "api-gateway.selectorLabels" . | nindent 8 }}
        {{- include "api-gateway.buildLabels" . | nindent 8 }}
      annotations:
        {{- include "api-gateway.buildAnnotations" . | nindent 8 }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: api-gateway
          image: "{{ .Values.image.repository }}{{ if .Values.image.digest }}@{{ .Values.image.digest }}{{ else }}:{{ .Values.image.tag }}{{ end }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.service.targetPort }}
          env:
            {{- if .Values.runtime.javaToolOptions }}
            - name: JAVA_TOOL_OPTIONS
              value: {{ .Values.runtime.javaToolOptions | quote }}
            {{- end }}
            - name: PLAYSAY_AUTH_ISSUER_URI
              value: {{ .Values.auth.issuerUri | quote }}
            - name: PLAYSAY_AUTH_JWK_SET_URI
              value: {{ .Values.auth.jwkSetUri | quote }}
            - name: PLAYSAY_LESSON_ACCESS_ENABLED
              value: {{ .Values.lessonAccess.enabled | quote }}
            - name: PLAYSAY_LESSON_ACCESS_HMAC_KEY_VERSION
              value: {{ .Values.lessonAccess.hmacKeyVersion | quote }}
            - name: PLAYSAY_LESSON_ACCESS_ATTEMPT_TTL_SECONDS
              value: {{ .Values.lessonAccess.attemptTtlSeconds | quote }}
            - name: PLAYSAY_WEB_OIDC_CLIENT_ID
              value: {{ .Values.lessonAccess.oidcClientId | quote }}
            - name: PLAYSAY_WEB_OIDC_CALLBACK
              value: {{ .Values.lessonAccess.oidcCallback | quote }}
            {{- if .Values.lessonAccess.enabled }}
            - name: PLAYSAY_LESSON_ACCESS_HMAC_SECRET_BASE64
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.lessonAccess.existingSecret | quote }}
                  key: {{ .Values.lessonAccess.hmacSecretKey | quote }}
            {{- end }}
            {{- if .Values.ai.openai.enabled }}
            - name: PLAYSAY_AI_PROVIDER
              value: "openai"
            - name: OPENAI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.ai.openai.existingSecret | quote }}
                  key: {{ .Values.ai.openai.apiKeyKey | quote }}
            - name: OPENAI_MODEL
              value: {{ .Values.ai.openai.model | quote }}
            - name: OPENAI_BASE_URL
              value: {{ .Values.ai.openai.baseUrl | quote }}
            - name: OPENAI_MATERIAL_DRAFT_REASONING_EFFORT
              value: {{ .Values.ai.openai.reasoning.materialDraft | quote }}
            - name: OPENAI_ANSWER_SUGGESTION_REASONING_EFFORT
              value: {{ .Values.ai.openai.reasoning.answerSuggestion | quote }}
            - name: OPENAI_HTML_GAME_REASONING_EFFORT
              value: {{ .Values.ai.openai.reasoning.htmlGameMetadata | quote }}
            {{- else }}
            - name: PLAYSAY_AI_PROVIDER
              value: "stub"
            {{- end }}
            {{- if .Values.database.enabled }}
            - name: PLAYSAY_DB_JDBC_URL
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.database.existingSecret | quote }}
                  key: {{ .Values.database.jdbcUriKey | quote }}
            - name: PLAYSAY_DB_USERNAME
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.database.existingSecret | quote }}
                  key: {{ .Values.database.usernameKey | quote }}
            - name: PLAYSAY_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.database.existingSecret | quote }}
                  key: {{ .Values.database.passwordKey | quote }}
            - name: PLAYSAY_LIQUIBASE_ENABLED
              value: {{ .Values.database.liquibaseEnabled | quote }}
            {{- if .Values.database.hikariMaxPoolSize }}
            - name: SPRING_DATASOURCE_HIKARI_MAXIMUM_POOL_SIZE
              value: {{ .Values.database.hikariMaxPoolSize | quote }}
            {{- end }}
            {{- end }}
            {{- if .Values.livekit.enabled }}
            - name: PLAYSAY_LIVEKIT_URL
              value: {{ .Values.livekit.serverUrl | quote }}
            - name: PLAYSAY_LIVEKIT_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.livekit.existingSecret | quote }}
                  key: {{ .Values.livekit.apiKeyKey | quote }}
            - name: PLAYSAY_LIVEKIT_API_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.livekit.existingSecret | quote }}
                  key: {{ .Values.livekit.apiSecretKey | quote }}
            - name: PLAYSAY_LIVEKIT_TOKEN_TTL_SECONDS
              value: {{ .Values.livekit.tokenTtlSeconds | quote }}
            {{- $relayMode := .Values.livekit.regionalRelay.mode | default "off" }}
            {{- if not (has $relayMode (list "off" "rf-origin-relay")) }}
            {{- fail "livekit.regionalRelay.mode must be off or rf-origin-relay" }}
            {{- end }}
            - name: PLAYSAY_REGIONAL_RELAY_ENVIRONMENT
              value: {{ .Values.livekit.regionalRelay.environment | quote }}
            - name: PLAYSAY_REGIONAL_RELAY_MODE
              value: {{ $relayMode | quote }}
            - name: PLAYSAY_REGIONAL_RELAY_CREDENTIAL_TTL_SECONDS
              value: {{ .Values.livekit.regionalRelay.credentialTtlSeconds | default "900" | quote }}
            {{- if eq $relayMode "rf-origin-relay" }}
            - name: PLAYSAY_REGIONAL_RELAY_SHARED_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.livekit.regionalRelay.existingSecret | quote }}
                  key: {{ .Values.livekit.regionalRelay.sharedSecretKey | quote }}
            {{- end }}
            {{- end }}
            - name: PLAYSAY_LESSON_TRANSLATION_ENABLED
              value: {{ .Values.lessonTranslation.enabled | quote }}
            - name: PLAYSAY_LESSON_TRANSLATION_PROVIDER
              value: {{ .Values.lessonTranslation.provider | quote }}
            - name: PLAYSAY_LESSON_TRANSLATION_MODEL
              value: {{ .Values.lessonTranslation.model | quote }}
            - name: PLAYSAY_LESSON_TRANSLATION_BASE_URL
              value: {{ .Values.lessonTranslation.baseUrl | quote }}
            {{- if .Values.lessonTranslation.enabled }}
            - name: PLAYSAY_LESSON_TRANSLATION_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.lessonTranslation.existingSecret | quote }}
                  key: {{ .Values.lessonTranslation.apiKeyKey | quote }}
            {{- end }}
            - name: PLAYSAY_COLLABORATION_WEBSOCKET_URL
              value: {{ .Values.collaboration.websocketUrl | quote }}
            - name: PLAYSAY_COLLABORATION_HTTP_BASE_URL
              value: {{ .Values.collaboration.httpBaseUrl | quote }}
            - name: PLAYSAY_COLLABORATION_TOKEN_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.collaboration.existingSecret | quote }}
                  key: {{ .Values.collaboration.tokenSecretKey | quote }}
            - name: PLAYSAY_COLLABORATION_SERVICE_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.collaboration.existingSecret | quote }}
                  key: {{ .Values.collaboration.serviceTokenKey | quote }}
            - name: PLAYSAY_COLLABORATION_TOKEN_TTL_SECONDS
              value: {{ .Values.collaboration.tokenTtlSeconds | quote }}
            - name: PLAYSAY_WEBSOCKET_ALLOWED_ORIGIN_PATTERNS
              value: {{ join "," .Values.websocket.allowedOriginPatterns | quote }}
            - name: PLAYSAY_STORAGE_PROVIDER
              value: {{ .Values.storage.provider | quote }}
            - name: PLAYSAY_MEDIA_SERVICE_BASE_URL
              value: {{ .Values.mediaService.baseUrl | quote }}
            - name: PLAYSAY_MEDIA_SERVICE_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.mediaService.existingSecret | quote }}
                  key: {{ .Values.mediaService.serviceTokenKey | quote }}
            - { name: PLAYSAY_WORKSHEET_IMPORT_ENABLED, value: {{ .Values.worksheetImport.enabled | quote }} }
            - { name: PLAYSAY_WORKSHEET_SERVICE_BASE_URL, value: {{ .Values.worksheetImport.baseUrl | quote }} }
            {{- if eq .Values.worksheetImport.enabled "true" }}
            - name: PLAYSAY_WORKSHEET_SERVICE_TOKEN
              valueFrom: { secretKeyRef: { name: {{ .Values.worksheetImport.existingSecret | quote }}, key: {{ .Values.worksheetImport.serviceTokenKey | quote }} } }
            {{- end }}
            - name: PLAYSAY_MEDIA_SERVICE_CACHE_REQUEST_TIMEOUT_SECONDS
              value: {{ .Values.mediaService.cacheRequestTimeoutSeconds | quote }}
            - name: PLAYSAY_GAME_ADAPTER_SERVICE_BASE_URL
              value: {{ .Values.gameAdapterService.baseUrl | quote }}
            - name: PLAYSAY_GAME_ADAPTER_SERVICE_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.gameAdapterService.existingSecret | quote }}
                  key: {{ .Values.gameAdapterService.serviceTokenKey | quote }}
            - name: PLAYSAY_GAME_ADAPTER_ENABLED
              value: {{ .Values.gameAdapterService.enabled | quote }}
            - name: PLAYSAY_GAME_ADAPTER_POLL_DELAY_MS
              value: {{ .Values.gameAdapterService.pollDelayMs | quote }}
            - name: PLAYSAY_PAYMENT_SERVICE_BASE_URL
              value: {{ .Values.paymentService.baseUrl | quote }}
            - name: PLAYSAY_PAYMENT_SERVICE_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.paymentService.existingSecret | quote }}
                  key: {{ .Values.paymentService.serviceTokenKey | quote }}
                  optional: true
            - name: PLAYSAY_REGISTRATION_SERVICE_BASE_URL
              value: {{ .Values.registrationService.baseUrl | quote }}
            - name: PLAYSAY_REGISTRATION_SERVICE_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.registrationService.existingSecret | quote }}
                  key: {{ .Values.registrationService.serviceTokenKey | quote }}
            - name: PLAYSAY_USER_DATA_SERVICE_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.userData.existingSecret | quote }}
                  key: {{ .Values.userData.serviceTokenKey | quote }}
            - name: PLAYSAY_AI_TUTOR_SERVICE_BASE_URL
              value: {{ .Values.userData.aiTutorBaseUrl | quote }}
            - name: PLAYSAY_VOCABULARY_SERVICE_BASE_URL
              value: {{ .Values.userData.vocabularyBaseUrl | quote }}
            - name: PLAYSAY_KEYBOARD_SERVICE_BASE_URL
              value: {{ .Values.userData.keyboardBaseUrl | quote }}
            - name: PLAYSAY_EMAIL_SERVICE_BASE_URL
              value: {{ .Values.emailService.baseUrl | quote }}
            - name: PLAYSAY_EMAIL_SERVICE_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.emailService.existingSecret | quote }}
                  key: {{ .Values.emailService.serviceTokenKey | quote }}
                  optional: true
            - name: PLAYSAY_EMAIL_MAILJET_WEBHOOK_USERNAME
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.emailService.existingSecret | quote }}
                  key: {{ .Values.emailService.mailjetWebhookUsernameKey | quote }}
                  optional: true
            - name: PLAYSAY_EMAIL_MAILJET_WEBHOOK_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.emailService.existingSecret | quote }}
                  key: {{ .Values.emailService.mailjetWebhookPasswordKey | quote }}
                  optional: true
            - name: PLAYSAY_CHAT_EMAIL_INITIAL_DELAY
              value: {{ .Values.chatEmail.initialDelay | quote }}
            - name: PLAYSAY_CHAT_EMAIL_COOLDOWN
              value: {{ .Values.chatEmail.cooldown | quote }}
            - name: PLAYSAY_CHAT_EMAIL_POLL_DELAY_MS
              value: {{ .Values.chatEmail.pollDelayMs | quote }}
            - name: PLAYSAY_CHAT_EMAIL_RETRY_DELAYS
              value: {{ .Values.chatEmail.retryDelays | quote }}
            - name: PLAYSAY_CHAT_PUSH_ENABLED
              value: {{ .Values.chatPush.enabled | quote }}
            - name: PLAYSAY_CHAT_PUSH_PUBLIC_KEY
              value: {{ .Values.chatPush.publicKey | quote }}
            {{- if eq (toString .Values.chatPush.enabled) "true" }}
            - name: PLAYSAY_CHAT_PUSH_PRIVATE_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.chatPush.existingSecret | quote }}
                  key: {{ .Values.chatPush.privateKeyKey | quote }}
            - name: PLAYSAY_CHAT_PUSH_SUBJECT
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.chatPush.existingSecret | quote }}
                  key: {{ .Values.chatPush.subjectKey | quote }}
            {{- end }}
            - name: PLAYSAY_CHAT_PUSH_POLL_DELAY_MS
              value: {{ .Values.chatPush.pollDelayMs | quote }}
            - name: PLAYSAY_CHAT_PUSH_INITIAL_DELAY_MS
              value: {{ .Values.chatPush.initialDelayMs | quote }}
            - name: PLAYSAY_CHAT_PUSH_LEASE
              value: {{ .Values.chatPush.lease | quote }}
            - name: PLAYSAY_CHAT_PUSH_RETRY_DELAYS
              value: {{ .Values.chatPush.retryDelays | quote }}
            - name: PLAYSAY_PUBLIC_APP_URL
              value: {{ .Values.publicAppUrl | quote }}
            - name: PLAYSAY_PUBLIC_APP_RF_URL
              value: {{ .Values.publicAppRfUrl | quote }}
            - name: PLAYSAY_YOUTUBE_RF_RELAY_ENABLED
              value: {{ .Values.video.youtube.rfRelay.enabled | quote }}
            - name: PLAYSAY_YOUTUBE_RF_RELAY_GEO_COUNTRY_HEADER
              value: {{ .Values.video.youtube.rfRelay.geoCountryHeader | quote }}
            - name: PLAYSAY_YOUTUBE_RF_RELAY_REQUIRE_GEO_COUNTRY
              value: {{ .Values.video.youtube.rfRelay.requireGeoCountry | quote }}
            - name: PLAYSAY_YOUTUBE_CACHE_ENABLED
              value: {{ .Values.video.youtube.cache.enabled | quote }}
            - name: PLAYSAY_YOUTUBE_CACHE_POLL_DELAY_MS
              value: {{ .Values.video.youtube.cache.pollDelayMs | quote }}
            - name: PLAYSAY_YOUTUBE_CACHE_LEASE_SECONDS
              value: {{ .Values.video.youtube.cache.leaseSeconds | quote }}
            - name: PLAYSAY_YOUTUBE_CACHE_RETENTION_DAYS
              value: {{ .Values.video.youtube.cache.retentionDays | quote }}
            {{- if eq .Values.storage.provider "s3" }}
            - name: PLAYSAY_S3_ENDPOINT
              value: {{ .Values.storage.s3.endpoint | quote }}
            - name: PLAYSAY_S3_REGION
              value: {{ .Values.storage.s3.region | quote }}
            - name: PLAYSAY_S3_BUCKET
              value: {{ .Values.storage.s3.bucket | quote }}
            - name: PLAYSAY_S3_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.storage.s3.existingSecret | quote }}
                  key: {{ .Values.storage.s3.accessKeyKey | quote }}
            - name: PLAYSAY_S3_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.storage.s3.existingSecret | quote }}
                  key: {{ .Values.storage.s3.secretKeyKey | quote }}
            - name: PLAYSAY_S3_PATH_STYLE_ACCESS
              value: {{ .Values.storage.s3.pathStyleAccess | quote }}
            - name: PLAYSAY_S3_CREATE_BUCKET
              value: {{ .Values.storage.s3.createBucket | quote }}
            {{- end }}
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 2
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            initialDelaySeconds: 30
            periodSeconds: 20
            timeoutSeconds: 2
          startupProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            failureThreshold: 24
            periodSeconds: 10
            timeoutSeconds: 2
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
