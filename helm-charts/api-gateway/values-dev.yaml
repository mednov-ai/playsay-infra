image:
  repository: ghcr.io/mednov-ai/playsay-api-gateway
  tag: "dev-130"
imagePullSecrets:
  - name: ghcr-pull-secret
build:
  name: dev-130
  number: "130"
  branch: develop
  branchLabel: dev
  commit: c8f07beb0229587518492b19c53a9afd034f1fdc
  commitShort: "c8f07beb0229"
ingress:
  enabled: false
  host: api-gateway.dev.example.com
auth:
  issuerUri: https://ops.play-and-say.ru:18443/keycloak/realms/playsay
  jwkSetUri: http://keycloak.keycloak.svc.cluster.local/keycloak/realms/playsay/protocol/openid-connect/certs
ai:
  openai:
    enabled: true
    existingSecret: playsay-openai
    apiKeyKey: api-key
    modelKey: model
    baseUrl: https://api.openai.com/v1
database:
  existingSecret: playsay-app-db
  liquibaseEnabled: "false"
livekit:
  enabled: true
  serverUrl: wss://online.play-and-say.ru/livekit
  existingSecret: livekit-keys
  tokenTtlSeconds: "3600"
storage:
  provider: s3
  s3:
    endpoint: http://minio.storage.svc.cluster.local:9000
    region: us-east-1
    bucket: playsay-material-assets
    existingSecret: playsay-object-storage
    pathStyleAccess: "true"
    createBucket: "true"
