image:
  repository: ghcr.io/mednov-ai/playsay-api-gateway
  tag: "dev-162"
imagePullSecrets:
  - name: ghcr-pull-secret
build:
  name: dev-162
  number: "162"
  branch: develop
  branchLabel: dev
  commit: 7f804bf3cb13b23a8a0c420afb9a11e8dde942eb
  commitShort: "7f804bf3cb13"
ingress:
  enabled: false
  host: api-gateway.dev.example.com
auth:
  issuerUri: https://ops.play-and-say.ru:18443/keycloak/realms/playsay
  jwkSetUri: http://keycloak.keycloak.svc.cluster.local/keycloak/realms/playsay/protocol/openid-connect/certs
ai:
  openai:
    enabled: true
    existingSecret: playsay-openai
    apiKeyKey: api-key
    modelKey: model
    baseUrl: https://api.openai.com/v1
database:
  existingSecret: playsay-app-db
  liquibaseEnabled: "false"
livekit:
  enabled: true
  serverUrl: wss://online.play-and-say.ru/livekit
  existingSecret: livekit-keys
  tokenTtlSeconds: "3600"
collaboration:
  websocketUrl: wss://online.play-and-say.ru/collab/ws
  existingSecret: playsay-collaboration
  tokenTtlSeconds: "900"
storage:
  provider: s3
  s3:
    endpoint: http://minio.storage.svc.cluster.local:9000
    region: us-east-1
    bucket: playsay-material-assets
    existingSecret: playsay-object-storage
    pathStyleAccess: "true"
    createBucket: "true"
video:
  youtube:
    rfRelay:
      enabled: "false"
      geoCountryHeader: X-PlaySay-Geo-Country
      sessionTtlSeconds: "900"
      ytdlpPath: /usr/local/bin/yt-dlp
runtime:
  javaToolOptions: "-XX:InitialRAMPercentage=50 -XX:MaxRAMPercentage=75 -XX:+UseStringDeduplication -Djava.security.egd=file:/dev/urandom"
resources:
  requests:
    cpu: 250m
    memory: 384Mi
  limits:
    cpu: "1"
    memory: 768Mi
