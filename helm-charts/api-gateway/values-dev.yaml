image:
  repository: ghcr.io/mednov-ai/playsay-api-gateway
  tag: "api-dev-75"
imagePullSecrets:
  - name: ghcr-pull-secret
build:
  name: api-dev-75
  number: "75"
  branch: develop
  branchLabel: api-dev
  commit: 4f452e5463e2da010a0d56079c8bb8b961f09d09
  commitShort: "4f452e5463e2"
updateStrategy:
  type: RollingUpdate
  rollingUpdate:
    maxSurge: 0
    maxUnavailable: 1
ingress:
  enabled: false
  host: api-gateway.dev.example.com
auth:
  issuerUri: https://ops.play-and-say.ru:18443/keycloak/realms/playsay
  jwkSetUri: http://keycloak.keycloak.svc.cluster.local/keycloak/realms/playsay/protocol/openid-connect/certs
ai:
  openai:
    enabled: true
    existingSecret: playsay-openai
    apiKeyKey: api-key
    modelKey: model
    baseUrl: https://api.openai.com/v1
database:
  existingSecret: playsay-app-db
  liquibaseEnabled: "false"
  hikariMaxPoolSize: "3"
livekit:
  enabled: true
  serverUrl: wss://online.play-and-say.ru/livekit
  existingSecret: livekit-keys
  tokenTtlSeconds: "3600"
lessonTranslation:
  enabled: true
  provider: openai
  model: gpt-realtime-translate
  baseUrl: https://api.openai.com/v1
  existingSecret: playsay-openai
  apiKeyKey: api-key
collaboration:
  websocketUrl: wss://online.play-and-say.ru/collab/ws
  existingSecret: playsay-collaboration
  tokenTtlSeconds: "900"
storage:
  provider: s3
  s3:
    endpoint: http://minio.storage.svc.cluster.local:9000
    region: us-east-1
    bucket: playsay-material-assets
    existingSecret: playsay-object-storage
    pathStyleAccess: "true"
    createBucket: "true"
mediaService:
  baseUrl: http://media-service.playsay-dev.svc.cluster.local
  existingSecret: playsay-media
  serviceTokenKey: service-token
  cacheRequestTimeoutSeconds: "660"
paymentService:
  baseUrl: http://payment-service.playsay-dev.svc.cluster.local
  existingSecret: playsay-payment
  serviceTokenKey: service-token
registrationService:
  baseUrl: http://registration-service.playsay-dev.svc.cluster.local
  existingSecret: playsay-registration
  serviceTokenKey: service-token
emailService:
  baseUrl: http://email-service.playsay-dev.svc.cluster.local
  existingSecret: playsay-email
  serviceTokenKey: service-token
publicAppUrl: https://online.play-and-say.ru
video:
  youtube:
    rfRelay:
      enabled: "true"
      geoCountryHeader: X-PlaySay-Geo-Country
      requireGeoCountry: "false"
    cache:
      enabled: "true"
      pollDelayMs: "5000"
      leaseSeconds: "900"
      retentionDays: "30"
runtime:
  javaToolOptions: "-XX:InitialRAMPercentage=50 -XX:MaxRAMPercentage=75 -XX:+UseStringDeduplication -Djava.security.egd=file:/dev/urandom"
resources:
  requests:
    cpu: 50m
    memory: 384Mi
  limits:
    cpu: "1"
    memory: 768Mi
