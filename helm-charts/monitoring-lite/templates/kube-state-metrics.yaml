{{- if .Values.kubeStateMetrics.enabled }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "monitoring-lite.fullname" . }}-kube-state-metrics
  labels:
    {{- include "monitoring-lite.componentLabels" (dict "root" . "component" "kube-state-metrics") | nindent 4 }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "monitoring-lite.fullname" . }}-kube-state-metrics
  labels:
    {{- include "monitoring-lite.componentLabels" (dict "root" . "component" "kube-state-metrics") | nindent 4 }}
rules:
  - apiGroups: [""]
    resources:
      - configmaps
      - endpoints
      - limitranges
      - namespaces
      - nodes
      - persistentvolumeclaims
      - persistentvolumes
      - pods
      - replicationcontrollers
      - resourcequotas
      - services
    verbs: ["list", "watch"]
  - apiGroups: ["apps"]
    resources:
      - daemonsets
      - deployments
      - replicasets
      - statefulsets
    verbs: ["list", "watch"]
  - apiGroups: ["batch"]
    resources:
      - cronjobs
      - jobs
    verbs: ["list", "watch"]
  - apiGroups: ["autoscaling"]
    resources:
      - horizontalpodautoscalers
    verbs: ["list", "watch"]
  - apiGroups: ["policy"]
    resources:
      - poddisruptionbudgets
    verbs: ["list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "monitoring-lite.fullname" . }}-kube-state-metrics
  labels:
    {{- include "monitoring-lite.componentLabels" (dict "root" . "component" "kube-state-metrics") | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "monitoring-lite.fullname" . }}-kube-state-metrics
subjects:
  - kind: ServiceAccount
    name: {{ include "monitoring-lite.fullname" . }}-kube-state-metrics
    namespace: {{ .Release.Namespace }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "monitoring-lite.fullname" . }}-kube-state-metrics
  labels:
    {{- include "monitoring-lite.componentLabels" (dict "root" . "component" "kube-state-metrics") | nindent 4 }}
spec:
  type: ClusterIP
  ports:
    - name: http
      port: {{ .Values.kubeStateMetrics.service.port }}
      targetPort: http
      protocol: TCP
  selector:
    app.kubernetes.io/name: {{ include "monitoring-lite.name" . }}
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: kube-state-metrics
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "monitoring-lite.fullname" . }}-kube-state-metrics
  labels:
    {{- include "monitoring-lite.componentLabels" (dict "root" . "component" "kube-state-metrics") | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "monitoring-lite.name" . }}
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: kube-state-metrics
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "monitoring-lite.name" . }}
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/component: kube-state-metrics
    spec:
      serviceAccountName: {{ include "monitoring-lite.fullname" . }}-kube-state-metrics
      enableServiceLinks: false
      containers:
        - name: kube-state-metrics
          image: "{{ .Values.kubeStateMetrics.image.repository }}:{{ .Values.kubeStateMetrics.image.tag }}"
          imagePullPolicy: {{ .Values.global.imagePullPolicy }}
          args:
            - --port={{ .Values.kubeStateMetrics.service.port }}
            - --telemetry-port=8081
            - --resources=pods,nodes,namespaces,deployments,replicasets,statefulsets,daemonsets,jobs,cronjobs,persistentvolumeclaims,persistentvolumes,services
          ports:
            - name: http
              containerPort: {{ .Values.kubeStateMetrics.service.port }}
              protocol: TCP
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /livez
              port: http
            initialDelaySeconds: 20
            periodSeconds: 20
          resources:
            {{- toYaml .Values.kubeStateMetrics.resources | nindent 12 }}
{{- end }}
