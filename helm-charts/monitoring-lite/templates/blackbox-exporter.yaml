{{- if .Values.blackboxExporter.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "monitoring-lite.fullname" . }}-blackbox-exporter
  labels:
    {{- include "monitoring-lite.componentLabels" (dict "root" . "component" "blackbox-exporter") | nindent 4 }}
data:
  blackbox.yml: |
    modules:
      http_2xx:
        prober: http
        timeout: 5s
        http:
          method: GET
          preferred_ip_protocol: ip4
          tls_config:
            insecure_skip_verify: true
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "monitoring-lite.fullname" . }}-blackbox-exporter
  labels:
    {{- include "monitoring-lite.componentLabels" (dict "root" . "component" "blackbox-exporter") | nindent 4 }}
spec:
  type: ClusterIP
  ports:
    - name: http
      port: {{ .Values.blackboxExporter.service.port }}
      targetPort: http
      protocol: TCP
  selector:
    app.kubernetes.io/name: {{ include "monitoring-lite.name" . }}
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: blackbox-exporter
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "monitoring-lite.fullname" . }}-blackbox-exporter
  labels:
    {{- include "monitoring-lite.componentLabels" (dict "root" . "component" "blackbox-exporter") | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "monitoring-lite.name" . }}
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: blackbox-exporter
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "monitoring-lite.name" . }}
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/component: blackbox-exporter
    spec:
      enableServiceLinks: false
      containers:
        - name: blackbox-exporter
          image: "{{ .Values.blackboxExporter.image.repository }}:{{ .Values.blackboxExporter.image.tag }}"
          imagePullPolicy: {{ .Values.global.imagePullPolicy }}
          args:
            - --config.file=/config/blackbox.yml
          ports:
            - name: http
              containerPort: {{ .Values.blackboxExporter.service.port }}
              protocol: TCP
          readinessProbe:
            httpGet:
              path: /-/ready
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /-/healthy
              port: http
            initialDelaySeconds: 20
            periodSeconds: 20
          resources:
            {{- toYaml .Values.blackboxExporter.resources | nindent 12 }}
          volumeMounts:
            - name: config
              mountPath: /config
              readOnly: true
      volumes:
        - name: config
          configMap:
            name: {{ include "monitoring-lite.fullname" . }}-blackbox-exporter
{{- end }}
