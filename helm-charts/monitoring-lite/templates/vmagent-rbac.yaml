apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "monitoring-lite.fullname" . }}-vmagent
  labels:
    {{- include "monitoring-lite.componentLabels" (dict "root" . "component" "vmagent") | nindent 4 }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "monitoring-lite.fullname" . }}-vmagent
  labels:
    {{- include "monitoring-lite.componentLabels" (dict "root" . "component" "vmagent") | nindent 4 }}
rules:
  - apiGroups: [""]
    resources:
      - nodes
      - nodes/metrics
      - nodes/proxy
      - services
      - endpoints
      - pods
    verbs: ["get", "list", "watch"]
  - apiGroups: ["discovery.k8s.io"]
    resources: ["endpointslices"]
    verbs: ["get", "list", "watch"]
  - nonResourceURLs:
      - /metrics
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "monitoring-lite.fullname" . }}-vmagent
  labels:
    {{- include "monitoring-lite.componentLabels" (dict "root" . "component" "vmagent") | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "monitoring-lite.fullname" . }}-vmagent
subjects:
  - kind: ServiceAccount
    name: {{ include "monitoring-lite.fullname" . }}-vmagent
    namespace: {{ .Release.Namespace }}
