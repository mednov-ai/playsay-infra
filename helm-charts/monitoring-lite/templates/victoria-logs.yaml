{{- if .Values.victoriaLogs.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "monitoring-lite.fullname" . }}-victoria-logs
  labels:
    {{- include "monitoring-lite.componentLabels" (dict "root" . "component" "victoria-logs") | nindent 4 }}
spec:
  type: {{ .Values.victoriaLogs.service.type }}
  ports:
    - name: http
      port: {{ .Values.victoriaLogs.service.port }}
      targetPort: http
      protocol: TCP
      {{- if and (eq .Values.victoriaLogs.service.type "NodePort") .Values.victoriaLogs.service.nodePort }}
      nodePort: {{ .Values.victoriaLogs.service.nodePort }}
      {{- end }}
  selector:
    app.kubernetes.io/name: {{ include "monitoring-lite.name" . }}
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: victoria-logs
---
{{- if .Values.victoriaLogs.storage.enabled }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "monitoring-lite.fullname" . }}-victoria-logs
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: {{ .Values.victoriaLogs.storage.size }}
---
{{- end }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "monitoring-lite.fullname" . }}-victoria-logs
  labels:
    {{- include "monitoring-lite.componentLabels" (dict "root" . "component" "victoria-logs") | nindent 4 }}
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "monitoring-lite.name" . }}
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: victoria-logs
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "monitoring-lite.name" . }}
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/component: victoria-logs
    spec:
      enableServiceLinks: false
      containers:
        - name: victoria-logs
          image: "{{ .Values.victoriaLogs.image.repository }}:{{ .Values.victoriaLogs.image.tag }}"
          imagePullPolicy: {{ .Values.global.imagePullPolicy }}
          args:
            - -retentionPeriod={{ .Values.victoriaLogs.retentionPeriod }}
            - -storageDataPath=/storage
            - -httpListenAddr=:{{ .Values.victoriaLogs.service.port }}
            - -http.pathPrefix={{ .Values.victoriaLogs.httpPathPrefix }}
          ports:
            - name: http
              containerPort: {{ .Values.victoriaLogs.service.port }}
          readinessProbe:
            httpGet:
              path: {{ .Values.victoriaLogs.httpPathPrefix }}/health
              port: http
          livenessProbe:
            httpGet:
              path: {{ .Values.victoriaLogs.httpPathPrefix }}/health
              port: http
            initialDelaySeconds: 20
          resources:
            {{- toYaml .Values.victoriaLogs.resources | nindent 12 }}
          volumeMounts:
            - name: storage
              mountPath: /storage
      volumes:
        - name: storage
          {{- if .Values.victoriaLogs.storage.enabled }}
          persistentVolumeClaim:
            claimName: {{ include "monitoring-lite.fullname" . }}-victoria-logs
          {{- else }}
          emptyDir: {}
          {{- end }}
{{- end }}
