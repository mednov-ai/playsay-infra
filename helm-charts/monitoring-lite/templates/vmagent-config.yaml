apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "monitoring-lite.fullname" . }}-vmagent
  labels:
    {{- include "monitoring-lite.componentLabels" (dict "root" . "component" "vmagent") | nindent 4 }}
data:
  scrape.yaml: |
    global:
      scrape_interval: {{ .Values.vmagent.scrapeInterval }}
      evaluation_interval: {{ .Values.vmagent.evaluationInterval }}

    scrape_configs:
      {{- if .Values.vmagent.hostNodeExporter.enabled }}
      - job_name: node-exporter-host
        static_configs:
          - targets:
              - {{ .Values.vmagent.hostNodeExporter.target | quote }}
      {{- end }}

      - job_name: kubernetes-cadvisor
        scheme: https
        kubernetes_sd_configs:
          - role: node
        bearer_token_file: /var/run/secrets/kubernetes.io/serviceaccount/token
        tls_config:
          insecure_skip_verify: true
        relabel_configs:
          - target_label: __address__
            replacement: kubernetes.default.svc:443
          - source_labels: [__meta_kubernetes_node_name]
            target_label: __metrics_path__
            replacement: /api/v1/nodes/$1/proxy/metrics/cadvisor
          - source_labels: [__meta_kubernetes_node_name]
            target_label: node

      {{- if .Values.kubeStateMetrics.enabled }}
      - job_name: kube-state-metrics
        static_configs:
          - targets:
              - {{ include "monitoring-lite.fullname" . }}-kube-state-metrics:{{ .Values.kubeStateMetrics.service.port }}
      {{- end }}

      {{- if .Values.blackboxExporter.enabled }}
      - job_name: blackbox-http
        metrics_path: /probe
        params:
          module: [http_2xx]
        static_configs:
          - targets:
          {{- range .Values.blackboxExporter.targets }}
              - {{ . | quote }}
          {{- end }}
        relabel_configs:
          - source_labels: [__address__]
            target_label: __param_target
          - source_labels: [__param_target]
            target_label: instance
          - target_label: __address__
            replacement: {{ include "monitoring-lite.fullname" . }}-blackbox-exporter:{{ .Values.blackboxExporter.service.port }}
      {{- end }}

      {{- if .Values.alerts.livekit.enabled }}
      - job_name: livekit
        static_configs:
          - targets:
              - livekit.livekit.svc.cluster.local:6789
      {{- end }}

      - job_name: victoria-metrics
        static_configs:
          - targets:
              - {{ include "monitoring-lite.fullname" . }}-victoria-metrics:{{ .Values.victoriaMetrics.service.port }}

      - job_name: vmagent
        static_configs:
          - targets:
              - 127.0.0.1:8429
