apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "monitoring-lite.fullname" . }}-vmalert
  labels:
    {{- include "monitoring-lite.componentLabels" (dict "root" . "component" "vmalert") | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "monitoring-lite.name" . }}
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: vmalert
  template:
    metadata:
      annotations:
        checksum/rules: {{ toYaml .Values.alerts | sha256sum }}
      labels:
        app.kubernetes.io/name: {{ include "monitoring-lite.name" . }}
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/component: vmalert
    spec:
      enableServiceLinks: false
      containers:
        - name: vmalert
          image: "{{ .Values.vmalert.image.repository }}:{{ .Values.vmalert.image.tag }}"
          imagePullPolicy: {{ .Values.global.imagePullPolicy }}
          args:
            - -datasource.url={{ include "monitoring-lite.vmUrl" . }}
            - -notifier.url={{ include "monitoring-lite.alertmanagerUrl" . }}
            - -rule=/rules/*.yaml
            - -evaluationInterval={{ .Values.vmalert.evaluationInterval }}
            - -httpListenAddr=:8880
          ports:
            - name: http
              containerPort: 8880
              protocol: TCP
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 20
            periodSeconds: 20
          resources:
            {{- toYaml .Values.vmalert.resources | nindent 12 }}
          volumeMounts:
            - name: rules
              mountPath: /rules
              readOnly: true
      volumes:
        - name: rules
          configMap:
            name: {{ include "monitoring-lite.fullname" . }}-vmalert-rules
