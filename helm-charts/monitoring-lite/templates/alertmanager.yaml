apiVersion: v1
kind: Service
metadata:
  name: {{ include "monitoring-lite.fullname" . }}-alertmanager
  labels:
    {{- include "monitoring-lite.componentLabels" (dict "root" . "component" "alertmanager") | nindent 4 }}
spec:
  type: ClusterIP
  ports:
    - name: http
      port: {{ .Values.alertmanager.service.port }}
      targetPort: http
      protocol: TCP
  selector:
    app.kubernetes.io/name: {{ include "monitoring-lite.name" . }}
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: alertmanager
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "monitoring-lite.fullname" . }}-alertmanager
  labels:
    {{- include "monitoring-lite.componentLabels" (dict "root" . "component" "alertmanager") | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "monitoring-lite.name" . }}
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: alertmanager
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "monitoring-lite.name" . }}
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/component: alertmanager
    spec:
      enableServiceLinks: false
      initContainers:
        - name: render-config
          image: "{{ .Values.alertmanager.configInitImage.repository }}:{{ .Values.alertmanager.configInitImage.tag }}"
          imagePullPolicy: {{ .Values.global.imagePullPolicy }}
          command:
            - /bin/sh
            - -ec
          args:
            - |
              if [ -n "${TELEGRAM_BOT_TOKEN:-}" ] && [ -n "${TELEGRAM_CHAT_ID:-}" ]; then
                cat <<EOF | sed 's/^              //' >/config/alertmanager.yml
              route:
                receiver: telegram
                group_by: ['alertname', 'job', 'instance']
                group_wait: 30s
                group_interval: 5m
                repeat_interval: 4h
              receivers:
                - name: telegram
                  telegram_configs:
                    - bot_token: "${TELEGRAM_BOT_TOKEN}"
                      chat_id: ${TELEGRAM_CHAT_ID}
                      parse_mode: HTML
                      send_resolved: true
                      message: '{{ "{{" }} range .Alerts {{ "}}" }}{{ "{{" }} .Annotations.summary {{ "}}" }}{{ "{{" }} if .Annotations.description {{ "}}" }} - {{ "{{" }} .Annotations.description {{ "}}" }}{{ "{{" }} end {{ "}}" }}{{ "{{" }} "\n" {{ "}}" }}{{ "{{" }} end {{ "}}" }}'
              EOF
              else
                cat <<EOF | sed 's/^              //' >/config/alertmanager.yml
              route:
                receiver: null
                group_by: ['alertname', 'job', 'instance']
                group_wait: 30s
                group_interval: 5m
                repeat_interval: 4h
              receivers:
                - name: null
              EOF
              fi
          env:
            {{- if .Values.alertmanager.telegram.enabled }}
            - name: TELEGRAM_BOT_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.alertmanager.telegram.existingSecret | quote }}
                  key: {{ .Values.alertmanager.telegram.botTokenKey | quote }}
                  optional: true
            - name: TELEGRAM_CHAT_ID
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.alertmanager.telegram.existingSecret | quote }}
                  key: {{ .Values.alertmanager.telegram.chatIdKey | quote }}
                  optional: true
            {{- end }}
          volumeMounts:
            - name: config
              mountPath: /config
      containers:
        - name: alertmanager
          image: "{{ .Values.alertmanager.image.repository }}:{{ .Values.alertmanager.image.tag }}"
          imagePullPolicy: {{ .Values.global.imagePullPolicy }}
          args:
            - --config.file=/config/alertmanager.yml
            - --storage.path=/alertmanager
            - --web.listen-address=:{{ .Values.alertmanager.service.port }}
          ports:
            - name: http
              containerPort: {{ .Values.alertmanager.service.port }}
              protocol: TCP
          readinessProbe:
            httpGet:
              path: /-/ready
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /-/healthy
              port: http
            initialDelaySeconds: 20
            periodSeconds: 20
          resources:
            {{- toYaml .Values.alertmanager.resources | nindent 12 }}
          volumeMounts:
            - name: config
              mountPath: /config
              readOnly: true
            - name: storage
              mountPath: /alertmanager
      volumes:
        - name: config
          emptyDir: {}
        - name: storage
          emptyDir: {}
