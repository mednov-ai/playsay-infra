apiVersion: v1
kind: Service
metadata:
  name: {{ include "monitoring-lite.fullname" . }}-victoria-metrics
  labels:
    {{- include "monitoring-lite.componentLabels" (dict "root" . "component" "victoria-metrics") | nindent 4 }}
spec:
  type: {{ .Values.victoriaMetrics.service.type }}
  ports:
    - name: http
      port: {{ .Values.victoriaMetrics.service.port }}
      targetPort: http
      protocol: TCP
      {{- if and (eq .Values.victoriaMetrics.service.type "NodePort") .Values.victoriaMetrics.service.nodePort }}
      nodePort: {{ .Values.victoriaMetrics.service.nodePort }}
      {{- end }}
  selector:
    app.kubernetes.io/name: {{ include "monitoring-lite.name" . }}
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: victoria-metrics
---
{{- if .Values.victoriaMetrics.storage.enabled }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "monitoring-lite.fullname" . }}-victoria-metrics
  labels:
    {{- include "monitoring-lite.componentLabels" (dict "root" . "component" "victoria-metrics") | nindent 4 }}
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: {{ .Values.victoriaMetrics.storage.size }}
---
{{- end }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "monitoring-lite.fullname" . }}-victoria-metrics
  labels:
    {{- include "monitoring-lite.componentLabels" (dict "root" . "component" "victoria-metrics") | nindent 4 }}
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "monitoring-lite.name" . }}
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: victoria-metrics
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "monitoring-lite.name" . }}
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/component: victoria-metrics
    spec:
      enableServiceLinks: false
      containers:
        - name: victoria-metrics
          image: "{{ .Values.victoriaMetrics.image.repository }}:{{ .Values.victoriaMetrics.image.tag }}"
          imagePullPolicy: {{ .Values.global.imagePullPolicy }}
          args:
            - -retentionPeriod={{ .Values.victoriaMetrics.retentionPeriod }}
            - -storageDataPath=/storage
            - -httpListenAddr=:{{ .Values.victoriaMetrics.service.port }}
            {{- with .Values.victoriaMetrics.httpPathPrefix }}
            - -http.pathPrefix={{ . }}
            {{- end }}
          ports:
            - name: http
              containerPort: {{ .Values.victoriaMetrics.service.port }}
              protocol: TCP
          readinessProbe:
            httpGet:
              path: {{ .Values.victoriaMetrics.httpPathPrefix }}/health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: {{ .Values.victoriaMetrics.httpPathPrefix }}/health
              port: http
            initialDelaySeconds: 20
            periodSeconds: 20
          resources:
            {{- toYaml .Values.victoriaMetrics.resources | nindent 12 }}
          volumeMounts:
            - name: storage
              mountPath: /storage
      volumes:
        - name: storage
          {{- if .Values.victoriaMetrics.storage.enabled }}
          persistentVolumeClaim:
            claimName: {{ include "monitoring-lite.fullname" . }}-victoria-metrics
          {{- else }}
          emptyDir: {}
          {{- end }}
