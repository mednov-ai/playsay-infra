apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "monitoring-lite.fullname" . }}-vmalert-rules
  labels:
    {{- include "monitoring-lite.componentLabels" (dict "root" . "component" "vmalert") | nindent 4 }}
data:
  alerts.yaml: |
    groups:
      - name: playsay-node
        rules:
          - alert: PlaySayNodeMemoryLow
            expr: node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes < {{ .Values.alerts.node.memoryAvailableRatio }}
            for: 5m
            labels:
              severity: warning
            annotations:
              summary: "Play&Say {{ .Values.environment.name }}: мало свободной RAM"
              description: "MemAvailable меньше {{ mulf .Values.alerts.node.memoryAvailableRatio 100.0 }}% больше 5 минут."

          - alert: PlaySayNodeMemoryCritical
            expr: node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes < {{ .Values.alerts.node.memoryCriticalRatio }}
            for: 2m
            labels:
              severity: critical
            annotations:
              summary: "Play&Say {{ .Values.environment.name }}: критически мало RAM"
              description: "MemAvailable меньше {{ mulf .Values.alerts.node.memoryCriticalRatio 100.0 }}% больше 2 минут."

          - alert: PlaySayNodeSwapHigh
            expr: node_memory_SwapTotal_bytes - node_memory_SwapFree_bytes > {{ .Values.alerts.node.swapUsedBytes }}
            for: 10m
            labels:
              severity: warning
            annotations:
              summary: "Play&Say {{ .Values.environment.name }}: активно используется swap"
              description: "Использование swap выше 512Mi больше 10 минут."

          - alert: PlaySayNodeMemoryPressureStall
            expr: rate(node_pressure_memory_waiting_seconds_total[2m]) > 0.05
            for: 3m
            labels:
              severity: warning
            annotations:
              summary: "Play&Say {{ .Values.environment.name }}: memory PSI pressure"
              description: "Процессы ждут память больше 5% времени."

          - alert: PlaySayNodeIoPressureStall
            expr: rate(node_pressure_io_waiting_seconds_total[2m]) > 0.20
            for: 3m
            labels:
              severity: warning
            annotations:
              summary: "Play&Say {{ .Values.environment.name }}: I/O PSI pressure"
              description: "Процессы ждут I/O больше 20% времени."

          - alert: PlaySayJenkinsAgentStartedWithoutHeadroom
            expr: count(kube_pod_info{namespace="jenkins",pod=~"playsay-.*-develop-.*"}) > 0 and on() (node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes < {{ .Values.alerts.node.memoryAvailableRatio }})
            for: 1m
            labels:
              severity: critical
            annotations:
              summary: "Jenkins agent запущен без запаса памяти"
              description: "Во время Jenkins agent MemAvailable ниже безопасных {{ mulf .Values.alerts.node.memoryAvailableRatio 100.0 }}%."

          - alert: PlaySayRootDiskLow
            expr: node_filesystem_avail_bytes{mountpoint="/",fstype!~"tmpfs|overlay"} / node_filesystem_size_bytes{mountpoint="/",fstype!~"tmpfs|overlay"} < {{ .Values.alerts.node.rootDiskAvailableRatio }}
            for: 15m
            labels:
              severity: warning
            annotations:
              summary: "Play&Say {{ .Values.environment.name }}: мало места на /"
              description: "На корневом разделе осталось меньше {{ mulf .Values.alerts.node.rootDiskAvailableRatio 100.0 }}%."

      - name: playsay-kubernetes
        rules:
          - alert: PlaySayPodRestarted
            expr: increase(kube_pod_container_status_restarts_total{namespace=~{{ .Values.alerts.kubernetes.namespaceRegex | quote }}}[10m]) > 0
            for: 0m
            labels:
              severity: warning
            annotations:
              summary: "Play&Say: pod перезапускался"
              description: "За последние 10 минут был restart container в namespace {{ "{{" }} $labels.namespace {{ "}}" }}."

          - alert: PlaySayPodNotReady
            expr: kube_pod_status_ready{namespace=~{{ .Values.alerts.kubernetes.namespaceRegex | quote }},condition="true"} == 0
            for: 10m
            labels:
              severity: warning
            annotations:
              summary: "Play&Say: pod не готов"
              description: "Pod {{ "{{" }} $labels.pod {{ "}}" }} в namespace {{ "{{" }} $labels.namespace {{ "}}" }} не Ready больше 10 минут."

      {{- if .Values.alerts.blackbox.enabled }}
      - name: playsay-endpoints
        rules:
          - alert: PlaySayEndpointDown
            expr: probe_success{job="blackbox-http"} == 0
            for: 3m
            labels:
              severity: critical
            annotations:
              summary: "Play&Say endpoint недоступен"
              description: "{{ "{{" }} $labels.instance {{ "}}" }} не проходит HTTP probe больше 3 минут."
      {{- end }}

      {{- if .Values.alerts.livekit.enabled }}
      - name: playsay-livekit
        rules:
          - alert: PlaySayLiveKitMetricsDown
            expr: up{job="livekit"} == 0
            for: 3m
            labels:
              severity: critical
            annotations:
              summary: "LiveKit metrics недоступны"
              description: "vmagent не может читать LiveKit Prometheus endpoint больше 3 минут."

          - alert: PlaySayLiveKitJoinFailures
            expr: sum(increase(livekit_participant_join_total{state="signal_connected"}[5m])) - (sum(increase(livekit_participant_join_total{state="rtc_connected"}[5m])) or vector(0)) >= 2
            for: 1m
            labels:
              severity: critical
            annotations:
              summary: "LiveKit не подключает участников"
              description: "За 5 минут как минимум два входа дошли до signaling, но не установили RTC; проверьте TURN/LiveKit порты и AX41 LIBVIRT_FWI."
      {{- end }}

      {{- if .Values.alerts.routeObservability.enabled }}
      - name: playsay-classroom-route
        rules:
          - alert: PlaySayRfToAx41RouteWarning
            expr: max_over_time(playsay_path_probe_success{direction="rf_to_ax41",phase="http"}[10s]) == 0
            for: 0s
            labels:
              severity: warning
            annotations:
              summary: "RF edge не достигает AX41"
              description: "Две последовательные пятисекундные RF-to-AX41 пробы не дошли до ожидаемого HTTP-ответа; сравните TCP и TLS phase metrics."

          - alert: PlaySayRfToAx41RouteCritical
            expr: max_over_time(playsay_path_probe_success{direction="rf_to_ax41",phase="http"}[30s]) == 0
            for: 0s
            labels:
              severity: critical
            annotations:
              summary: "RF-to-AX41 route недоступен 30 секунд"
              description: "Selectel не получает ожидаемый ответ AX41 непрерывно 30 секунд."

          - alert: PlaySayAx41ToRfRouteWarning
            expr: max_over_time(probe_success{direction="ax41_to_rf"}[10s]) == 0
            for: 0s
            labels:
              severity: warning
            annotations:
              summary: "AX41 не достигает RF edge"
              description: "Две последовательные пятисекундные AX41-to-RF пробы завершились ошибкой."

          - alert: PlaySayAx41ToRfRouteCritical
            expr: max_over_time(probe_success{direction="ax41_to_rf"}[30s]) == 0
            for: 0s
            labels:
              severity: critical
            annotations:
              summary: "AX41-to-RF route недоступен 30 секунд"
              description: "Обратное направление AX41-to-Selectel недоступно непрерывно 30 секунд."

          - alert: PlaySayAx41NginxToLiveKitCritical
            expr: max_over_time(probe_success{direction="ax41_nginx_to_livekit"}[30s]) == 0
            for: 0s
            labels:
              severity: critical
            annotations:
              summary: "AX41 nginx не достигает LiveKit"
              description: "Независимая локальная nginx-to-LiveKit проба не получает ожидаемый ответ 30 секунд."

          - alert: PlaySayClassroomRouteFailureWithActiveParticipants
            expr: |
              min(
                playsay_path_probe_success{direction="rf_to_ax41",phase="http"}
                or probe_success{direction=~"ax41_to_rf|ax41_nginx_to_livekit"}
              ) == 0
              and on() sum(livekit_participant_total) > 0
            for: 0s
            labels:
              severity: critical
            annotations:
              summary: "Classroom route failure во время активного урока"
              description: "Path probe отказал при ненулевом числе LiveKit participants; требуется немедленная проверка направления и фазы."

          - alert: PlaySayRfPathTelemetryStale
            expr: absent(playsay_path_probe_timestamp_seconds{direction="rf_to_ax41"}) or (time() - max(playsay_path_probe_timestamp_seconds{direction="rf_to_ax41"}) > 20)
            for: 0s
            labels:
              severity: critical
            annotations:
              summary: "RF path telemetry отсутствует или устарела"
              description: "Центральное хранилище не получало свежую timestamped RF probe sample больше 20 секунд; отсутствие данных не означает healthy."
      {{- end }}

      {{- if .Values.alerts.capacity.enabled }}
      - name: playsay-capacity
        rules:
          - alert: PlaySayLiveKitCpuHigh
            expr: |
              sum(rate(container_cpu_usage_seconds_total{namespace="livekit",container="livekit"}[5m]))
              /
              sum(kube_pod_container_resource_limits{namespace="livekit",container="livekit",resource="cpu",unit="core"})
              > {{ .Values.alerts.capacity.livekitCpuRatio }}
            for: 5m
            labels:
              severity: warning
            annotations:
              summary: "LiveKit использует больше 80% CPU limit"
              description: "У media-node заканчивается CPU headroom для 100 параллельных уроков."

          - alert: PlaySayLiveKitMemoryHigh
            expr: |
              sum(container_memory_working_set_bytes{namespace="livekit",container="livekit"})
              /
              sum(kube_pod_container_resource_limits{namespace="livekit",container="livekit",resource="memory",unit="byte"})
              > {{ .Values.alerts.capacity.livekitMemoryRatio }}
            for: 5m
            labels:
              severity: warning
            annotations:
              summary: "LiveKit использует больше 80% memory limit"
              description: "У media-node заканчивается RAM headroom для 100 параллельных уроков."

          - alert: PlaySayNetworkCapacityHigh
            expr: |
              max(
                rate(node_network_receive_bytes_total{device!~"lo|cni.*|flannel.*|veth.*"}[5m])
                or
                rate(node_network_transmit_bytes_total{device!~"lo|cni.*|flannel.*|veth.*"}[5m])
              ) * 8 > {{ .Values.alerts.capacity.networkBitsPerSecond }}
            for: 5m
            labels:
              severity: critical
            annotations:
              summary: "Сетевой трафик prod-VM выше 700 Mbps"
              description: "Достигнут эксплуатационный предел 1 Gbit/s NIC для realtime media."

          - alert: PlaySayUdpBufferErrors
            expr: |
              increase(node_netstat_Udp_RcvbufErrors[5m]) > 0
              or
              increase(node_netstat_Udp_SndbufErrors[5m]) > 0
            for: 0m
            labels:
              severity: critical
            annotations:
              summary: "Ядро теряет UDP-пакеты"
              description: "Обнаружены UDP receive/send buffer errors на media-node."

          - alert: PlaySayConntrackHigh
            expr: node_nf_conntrack_entries / node_nf_conntrack_entries_limit > {{ .Values.alerts.capacity.conntrackRatio }}
            for: 5m
            labels:
              severity: warning
            annotations:
              summary: "Conntrack заполнен больше чем на 70%"
              description: "Сетевой state table приближается к пределу."

          - alert: PlaySayApiDatabasePoolWaiting
            expr: hikaricp_connections_pending{job="playsay-api-gateway"} > 0
            for: 2m
            labels:
              severity: warning
            annotations:
              summary: "API ожидает соединения PostgreSQL"
              description: "Hikari pool API исчерпан больше двух минут."

          - alert: PlaySayCollaborationBackpressure
            expr: |
              increase(playsay_collaboration_backpressure_forced_closes_total[5m]) > 0
              or
              increase(playsay_collaboration_backpressure_dropped_total[5m]) > 0
            for: 0m
            labels:
              severity: warning
            annotations:
              summary: "Collaboration применил backpressure"
              description: "Есть отброшенные ephemeral-события или reconnect медленного клиента."

          - alert: PlaySayCollaborationSnapshotRetry
            expr: increase(playsay_collaboration_snapshot_flush_duration_seconds_count{outcome="retry"}[5m]) > 0
            for: 0m
            labels:
              severity: warning
            annotations:
              summary: "Collaboration повторяет сохранение snapshot"
              description: "API или PostgreSQL не приняли snapshot с первой попытки."

          - alert: PlaySayCollaborationStaleSockets
            expr: increase(playsay_collaboration_heartbeat_terminations_total{channel="yjs"}[5m]) > 0
            for: 0m
            labels:
              severity: warning
            annotations:
              summary: "Collaboration удалил зависшее Yjs-соединение"
              description: "Heartbeat обнаружил соединение без pong; проверьте reconnect и рост активных Yjs-сокетов."
      {{- end }}
