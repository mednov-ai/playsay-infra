environment:
  name: prod

victoriaMetrics:
  httpPathPrefix: /victoria-metrics
  retentionPeriod: 7d
  service:
    type: NodePort
    nodePort: 32085
  storage:
    size: 10Gi

vmagent:
  scrapeInterval: 15s
  evaluationInterval: 15s
  applicationScrapes:
    - jobName: playsay-api-gateway
      metricsPath: /actuator/prometheus
      target: api-gateway.playsay-prod.svc.cluster.local:80
    - jobName: playsay-media-service
      metricsPath: /actuator/prometheus
      target: media-service.playsay-prod.svc.cluster.local:80
    - jobName: playsay-collaboration-service
      metricsPath: /metrics
      target: collaboration-service.playsay-prod.svc.cluster.local:80

vmalert:
  evaluationInterval: 5s

blackboxExporter:
  targets:
    - https://online.honey.school/
    - https://key.honey.school/
    - https://ops.honey.school/keycloak/realms/playsay/.well-known/openid-configuration
    - https://online.honeyschool.ru/
    - https://key.honeyschool.ru/
  pathProbes:
    - name: ax41-to-rf
      direction: ax41_to_rf
      module: http_2xx
      target: https://online.honeyschool.ru/
    - name: ax41-nginx-to-livekit
      direction: ax41_nginx_to_livekit
      module: http_livekit_expected
      target: https://online.honey.school/livekit/

alertmanager:
  telegram:
    enabled: true
    existingSecret: playsay-telegram-alerts

alerts:
  kubernetes:
    namespaceRegex: "playsay-prod|livekit|keycloak|playsay-data|monitoring"
  capacity:
    enabled: true
    livekitCpuRatio: 0.80
    livekitMemoryRatio: 0.80
    networkBitsPerSecond: 700000000
    conntrackRatio: 0.70
  routeObservability:
    enabled: true
