cluster:
  name: playsay-postgres
  instances: 1
  imageName: ghcr.io/cloudnative-pg/postgresql:17.6-system-trixie
  stopDelay: 300
  smartShutdownTimeout: 60
  probes:
    liveness:
      timeoutSeconds: 5
      failureThreshold: 6
      periodSeconds: 10
    readiness:
      timeoutSeconds: 5
      failureThreshold: 6
      periodSeconds: 10
  database: playsay
  owner: playsay_app
  storage:
    size: 20Gi
  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      cpu: "2"
      memory: 2Gi
  postgresql:
    parameters:
      shared_buffers: 512MB
      max_connections: "100"
  managed:
    roles:
      - name: keyboard_app
        ensure: present
        login: true
        passwordSecret:
          name: playsay-postgres-keyboard

databases:
  - name: keyboard
    owner: keyboard_app
    ensure: present
    reclaimPolicy: retain
