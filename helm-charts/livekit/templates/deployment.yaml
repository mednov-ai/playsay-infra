apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "livekit.fullname" . }}
  labels:
    {{- include "livekit.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "livekit.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "livekit.selectorLabels" . | nindent 8 }}
    spec:
      hostNetwork: true
      enableServiceLinks: false
      dnsPolicy: ClusterFirstWithHostNet
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: livekit
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command:
            - /bin/sh
            - -ec
          args:
            - |
              {{- if .Values.turn.enabled }}
              COTURN_STATIC_AUTH_SECRET="$(printf '%s' "$COTURN_STATIC_AUTH_SECRET" | tr -d '\r\n')"
              case "$COTURN_STATIC_AUTH_SECRET" in
                ''|*[!0-9a-fA-F]*) echo "invalid coturn shared secret" >&2; exit 1 ;;
              esac
              [ "${#COTURN_STATIC_AUTH_SECRET}" -eq 64 ] || { echo "invalid coturn shared secret length" >&2; exit 1; }
              export COTURN_STATIC_AUTH_SECRET
              {{- end }}
              cat >/tmp/livekit.yaml <<EOF
              port: {{ .Values.signaling.port }}
              {{- if .Values.metrics.enabled }}
              prometheus_port: {{ .Values.metrics.port }}
              {{- end }}
              bind_addresses:
                - ""
              rtc:
                tcp_port: {{ .Values.rtc.tcpPort }}
                port_range_start: {{ .Values.rtc.udpPortRangeStart }}
                port_range_end: {{ .Values.rtc.udpPortRangeEnd }}
                use_external_ip: false
                node_ip: "{{ .Values.rtc.nodeIp }}"
              {{- if .Values.rtc.batchIo.enabled }}
                batch_io:
                  batch_size: {{ .Values.rtc.batchIo.batchSize }}
                  max_flush_interval: {{ .Values.rtc.batchIo.maxFlushInterval }}
              {{- end }}
              {{- if .Values.turn.enabled }}
                turn_servers:
                {{- range .Values.turn.protocols }}
                  - host: "{{ $.Values.turn.host }}"
                    port: {{ $.Values.turn.port }}
                    protocol: {{ . | quote }}
                    secret: "$COTURN_STATIC_AUTH_SECRET"
                    ttl: {{ $.Values.turn.ttlSeconds }}
                {{- end }}
              {{- end }}
              keys:
                "$LIVEKIT_API_KEY": "$LIVEKIT_API_SECRET"
              {{- if .Values.webhook.enabled }}
              webhook:
                api_key: "$LIVEKIT_API_KEY"
                urls:
                  - "{{ .Values.webhook.url }}"
              {{- end }}
              EOF
              exec /livekit-server --config /tmp/livekit.yaml
          env:
            - name: LIVEKIT_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secret.existingName | quote }}
                  key: {{ .Values.secret.apiKeyKey | quote }}
            - name: LIVEKIT_API_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secret.existingName | quote }}
                  key: {{ .Values.secret.apiSecretKey | quote }}
            {{- if .Values.turn.enabled }}
            - name: COTURN_STATIC_AUTH_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.turn.secret.existingName | quote }}
                  key: {{ .Values.turn.secret.key | quote }}
            {{- end }}
          ports:
            - name: signaling
              containerPort: {{ .Values.signaling.port }}
              protocol: TCP
            {{- if .Values.metrics.enabled }}
            - name: metrics
              containerPort: {{ .Values.metrics.port }}
              protocol: TCP
            {{- end }}
            - name: rtc-tcp
              containerPort: {{ .Values.rtc.tcpPort }}
              protocol: TCP
          readinessProbe:
            tcpSocket:
              port: signaling
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: signaling
            initialDelaySeconds: 20
            periodSeconds: 20
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
