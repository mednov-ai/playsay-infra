{{- with .Values.prodRegistrySecret }}
{{- if .enabled }}
{{- if ne $.Release.Namespace "livekit" }}{{ fail "Production registry credential requires the livekit namespace" }}{{ end }}
{{- $dev := $.Values.devRegistrySecret | default dict }}
{{- if $dev.enabled }}{{ fail "DEV and production registry credentials cannot both be enabled" }}{{ end }}
{{- $encrypted := required "Production registry credential is required" .encryptedDockerConfig }}
{{- if not (regexMatch "^Ag[A-Za-z0-9+/]{100,}={0,2}$" $encrypted) }}{{ fail "Production registry credential must be sealed ciphertext" }}{{ end }}
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: ghcr-pull-secret
  namespace: {{ $.Release.Namespace }}
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  encryptedData:
    .dockerconfigjson: {{ $encrypted | quote }}
  template:
    metadata:
      name: ghcr-pull-secret
      namespace: {{ $.Release.Namespace }}
    type: kubernetes.io/dockerconfigjson
{{- end }}
{{- end }}
