{{- with .Values.devRegistrySecret }}
{{- if .enabled }}
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: ghcr-pull-secret
  namespace: {{ $.Release.Namespace }}
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  encryptedData:
    .dockerconfigjson: {{ required "DEV registry credential is required" .encryptedDockerConfig | quote }}
  template:
    metadata:
      name: ghcr-pull-secret
      namespace: {{ $.Release.Namespace }}
    type: kubernetes.io/dockerconfigjson
{{- end }}
{{- end }}
