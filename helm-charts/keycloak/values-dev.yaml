theme:
  appBaseUrl: https://dev.online.honey.school
  recoveryAllowedOrigins:
    - https://dev.online.honey.school
    - https://dev.online.honeyschool.ru
image:
  repository: ghcr.io/mednov-ai/playsay-keycloak
  tag: "keycloak-dev-26"
  digest: sha256:921cf54e61850f81ba35d61f3ed43c109f150fc7e4b40d668cfed05d82afae34
  pullPolicy: IfNotPresent
imagePullSecrets:
  - name: ghcr-pull-secret
build:
  name: keycloak-dev-26
  number: "26"
  branch: develop
  branchLabel: keycloak-dev
  commit: e37bb8aa3107c71dd31edfaea8c3735b2025532d
  commitShort: e37bb8aa3107
global:
  security:
    allowInsecureImages: true
keycloak:
  replicaCount: 1
  hostname: https://dev.ops.honey.school/keycloak
  httpRelativePath: /keycloak/
  service:
    nodePort: 32084
  adminSecret:
    name: keycloak-admin
    passwordKey: admin-password
  database:
    host: keycloak-postgresql
    port: 5432
    name: bitnami_keycloak
    username: bn_keycloak
    secretName: keycloak-postgresql
    passwordKey: password
  resources:
    requests:
      cpu: 100m
      memory: 512Mi
    limits:
      cpu: 750m
      memory: 900Mi
  javaOpts: "-Xms384m -Xmx600m"
  themeCacheEnabled: false
postgresql:
  enabled: true
  architecture: standalone
  image:
    repository: bitnamilegacy/postgresql
  auth:
    username: bn_keycloak
    database: bitnami_keycloak
    existingSecret: keycloak-postgresql
    secretKeys:
      userPasswordKey: password
  primary:
    resourcesPreset: none
    resources:
      requests:
        cpu: 50m
        memory: 128Mi
      limits:
        cpu: 500m
        memory: 384Mi
    persistence:
      enabled: true
      size: 4Gi
