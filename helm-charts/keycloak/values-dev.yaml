theme:
  appBaseUrl: https://dev.online.honey.school
  recoveryAllowedOrigins:
    - https://dev.online.honey.school
    - https://dev.online.honeyschool.ru
image:
  repository: ghcr.io/mednov-ai/playsay-keycloak
  tag: "keycloak-dev-46"
  digest: sha256:836947e1a9274c32453b52af3b07b59cd0dc8af45ca273d041cec2ed7b2cc6d5
  pullPolicy: IfNotPresent
imagePullSecrets:
  - name: ghcr-pull-secret
build:
  name: keycloak-dev-46
  number: "46"
  branch: develop
  branchLabel: keycloak-dev
  commit: 55de930ab05a841655628837e12f26a76b334926
  commitShort: 55de930ab05a
global:
  security:
    allowInsecureImages: true
keycloak:
  replicaCount: 1
  hostname: https://dev.ops.honey.school/keycloak
  httpRelativePath: /keycloak/
  service:
    nodePort: 32084
  adminSecret:
    name: keycloak-admin
    passwordKey: admin-password
  database:
    host: keycloak-postgres-upgrade-rw
    port: 5432
    name: bitnami_keycloak
    username: bn_keycloak
    secretName: keycloak-postgresql
    passwordKey: password
  resources:
    requests:
      cpu: 100m
      memory: 512Mi
    limits:
      cpu: 750m
      memory: 900Mi
  javaOpts: "-Xms384m -Xmx600m"
  themeCacheEnabled: false
postgresql:
  enabled: true
  architecture: standalone
  image:
    repository: bitnamilegacy/postgresql
  auth:
    username: bn_keycloak
    database: bitnami_keycloak
    existingSecret: keycloak-postgresql
    secretKeys:
      userPasswordKey: password
  primary:
    resourcesPreset: none
    resources:
      requests:
        cpu: 50m
        memory: 128Mi
      limits:
        cpu: 500m
        memory: 384Mi
    persistence:
      enabled: true
      size: 4Gi
