theme:
  appBaseUrl: https://dev.online.honey.school
  recoveryAllowedOrigins:
    - https://dev.online.honey.school
    - https://dev.online.honeyschool.ru
image:
  repository: ghcr.io/mednov-ai/playsay-keycloak
  tag: "keycloak-dev-8"
  digest: sha256:b5bb57ca19b1dea0614fbf09308ce67451b4e49c948d06085f0ee99909c706d2
  pullPolicy: IfNotPresent
imagePullSecrets:
  - name: ghcr-pull-secret
build:
  name: keycloak-dev-8
  number: "8"
  branch: develop
  branchLabel: keycloak-dev
  commit: ea2b1c38c2948523990cd0d4c036aeec63625449
  commitShort: ea2b1c38c294
global:
  security:
    allowInsecureImages: true
keycloak:
  replicaCount: 1
  hostname: https://dev.ops.honey.school/keycloak
  httpRelativePath: /keycloak/
  service:
    nodePort: 32084
  adminSecret:
    name: keycloak-admin
    passwordKey: admin-password
  database:
    host: keycloak-postgresql
    port: 5432
    name: bitnami_keycloak
    username: bn_keycloak
    secretName: keycloak-postgresql
    passwordKey: password
  resources:
    requests:
      cpu: 100m
      memory: 512Mi
    limits:
      cpu: 750m
      memory: 900Mi
  javaOpts: "-Xms384m -Xmx600m"
  themeCacheEnabled: false
postgresql:
  enabled: true
  architecture: standalone
  image:
    repository: bitnamilegacy/postgresql
  auth:
    username: bn_keycloak
    database: bitnami_keycloak
    existingSecret: keycloak-postgresql
    secretKeys:
      userPasswordKey: password
  primary:
    resourcesPreset: none
    resources:
      requests:
        cpu: 50m
        memory: 128Mi
      limits:
        cpu: 500m
        memory: 384Mi
    persistence:
      enabled: true
      size: 4Gi
