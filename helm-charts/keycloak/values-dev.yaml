theme:
  appBaseUrl: https://dev.online.honey.school
  recoveryAllowedOrigins:
    - https://dev.online.honey.school
image:
  repository: ghcr.io/mednov-ai/playsay-keycloak
  tag: "keycloak-dev-7"
  digest: sha256:b75d7dba36cd8888f0ebf977ab44c5e933cc8bacd92b5a563991cd2c33953f1a
  pullPolicy: IfNotPresent
imagePullSecrets:
  - name: ghcr-pull-secret
build:
  name: keycloak-dev-7
  number: "7"
  branch: develop
  branchLabel: keycloak-dev
  commit: b15c57a619dddd0e7172b7c9b7aea682f7d0e6f0
  commitShort: b15c57a619dd
global:
  security:
    allowInsecureImages: true
keycloak:
  replicaCount: 1
  hostname: https://dev.ops.honey.school/keycloak
  httpRelativePath: /keycloak/
  service:
    nodePort: 32084
  adminSecret:
    name: keycloak-admin
    passwordKey: admin-password
  database:
    host: keycloak-postgresql
    port: 5432
    name: bitnami_keycloak
    username: bn_keycloak
    secretName: keycloak-postgresql
    passwordKey: password
  resources:
    requests:
      cpu: 100m
      memory: 512Mi
    limits:
      cpu: 750m
      memory: 900Mi
  javaOpts: "-Xms384m -Xmx600m"
  themeCacheEnabled: false
postgresql:
  enabled: true
  architecture: standalone
  image:
    repository: bitnamilegacy/postgresql
  auth:
    username: bn_keycloak
    database: bitnami_keycloak
    existingSecret: keycloak-postgresql
    secretKeys:
      userPasswordKey: password
  primary:
    resourcesPreset: none
    resources:
      requests:
        cpu: 50m
        memory: 128Mi
      limits:
        cpu: 500m
        memory: 384Mi
    persistence:
      enabled: true
      size: 4Gi
