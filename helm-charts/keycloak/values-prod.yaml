theme:
  appBaseUrl: https://online.honey.school
  recoveryAllowedOrigins:
    - https://online.honeyschool.ru
    - https://online.honey.school
image:
  repository: ghcr.io/mednov-ai/playsay-keycloak
  tag: "keycloak-release-01.007.06-14"
  digest: sha256:3ee6225be4d803f058c75d563ccec21a9e37bf8edfc83eb371b3511ff6e1ff5f
  pullPolicy: IfNotPresent
imagePullSecrets:
  - name: ghcr-pull-secret
build:
  name: keycloak-release-01.007.06-14
  number: "14"
  branch: release/01.007.06
  branchLabel: keycloak-release-01.007.06
  commit: a5ae66a15d1fed1f6d74adaca72a5d6ee272e3d7
  commitShort: a5ae66a15d1f
global:
  security:
    allowInsecureImages: true
keycloak:
  replicaCount: 1
  hostname: https://ops.honey.school/keycloak
  httpRelativePath: /keycloak/
  service:
    nodePort: 32084
  adminSecret:
    name: keycloak-admin
    passwordKey: admin-password
  database:
    host: keycloak-postgresql
    port: 5432
    name: bitnami_keycloak
    username: bn_keycloak
    secretName: keycloak-postgresql
    passwordKey: password
  resources:
    requests:
      cpu: 250m
      memory: 768Mi
    limits:
      cpu: "2"
      memory: 1536Mi
  javaOpts: "-Xms512m -Xmx768m"
  themeCacheEnabled: true
postgresql:
  enabled: true
  architecture: standalone
  image:
    repository: bitnamilegacy/postgresql
  auth:
    username: bn_keycloak
    database: bitnami_keycloak
    existingSecret: keycloak-postgresql
    secretKeys:
      userPasswordKey: password
  primary:
    resourcesPreset: none
    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        cpu: "1"
        memory: 768Mi
    persistence:
      enabled: true
      size: 10Gi
