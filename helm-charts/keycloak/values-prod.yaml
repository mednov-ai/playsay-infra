theme:
  appBaseUrl: https://online.honey.school
  recoveryAllowedOrigins:
    - https://online.honeyschool.ru
    - https://online.honey.school
image:
  repository: ghcr.io/mednov-ai/playsay-keycloak
  tag: "keycloak-release-01.007.05-11"
  digest: sha256:2084f417df8fc9585cdf490dcc9f486dc6f1df10e6fa93678f3c896982992342
  pullPolicy: IfNotPresent
imagePullSecrets:
  - name: ghcr-pull-secret
build:
  name: keycloak-release-01.007.05-11
  number: "11"
  branch: release/01.007.05
  branchLabel: keycloak-release-01.007.05
  commit: f41dbb8b60bfad6cbb0a1626ac45404f982805a0
  commitShort: f41dbb8b60bf
global:
  security:
    allowInsecureImages: true
keycloak:
