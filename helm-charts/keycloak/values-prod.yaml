theme:
  appBaseUrl: https://online.honey.school
  recoveryAllowedOrigins:
    - https://online.honeyschool.ru
    - https://online.honey.school
image:
  repository: ghcr.io/mednov-ai/playsay-keycloak
  tag: "keycloak-release-01.007.25-42"
  digest: sha256:b3bd3d4830ce0b63bab13ba0ef3e9d4bf100ef619a349cf7b3f106e9166bf564
  pullPolicy: IfNotPresent
imagePullSecrets:
  - name: ghcr-pull-secret
build:
  name: keycloak-release-01.007.25-42
  number: "42"
  branch: release/01.007.25
  branchLabel: keycloak-release-01.007.25
  commit: a030e7d54644eb4ce532961f101a5790ecf75c8d
  commitShort: a030e7d54644
global:
  security:
    allowInsecureImages: true
