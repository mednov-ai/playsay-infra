apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "collaboration-service.fullname" . }}
  labels:
    {{- include "collaboration-service.labels" . | nindent 4 }}
    {{- include "collaboration-service.buildLabels" . | nindent 4 }}
  annotations:
    {{- include "collaboration-service.buildAnnotations" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "collaboration-service.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "collaboration-service.selectorLabels" . | nindent 8 }}
        {{- include "collaboration-service.buildLabels" . | nindent 8 }}
      annotations:
        {{- include "collaboration-service.buildAnnotations" . | nindent 8 }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: collaboration-service
          image: "{{ .Values.image.repository }}{{ if .Values.image.digest }}@{{ .Values.image.digest }}{{ else }}:{{ .Values.image.tag }}{{ end }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.service.targetPort }}
          env:
            - name: PORT
              value: {{ .Values.service.targetPort | quote }}
            - name: KEYCLOAK_JWKS_URL
              value: {{ .Values.auth.keycloakJwksUrl | quote }}
            - name: PLAYSAY_API_BASE_URL
              value: {{ .Values.apiGateway.baseUrl | quote }}
            - name: COLLABORATION_TOKEN_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.collaboration.existingSecret | quote }}
                  key: {{ .Values.collaboration.tokenSecretKey | quote }}
            - name: COLLABORATION_SERVICE_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.collaboration.existingSecret | quote }}
                  key: {{ .Values.collaboration.serviceTokenKey | quote }}
            - name: SNAPSHOT_INTERVAL_MS
              value: {{ .Values.collaboration.snapshotIntervalMs | quote }}
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 3
            periodSeconds: 10
            timeoutSeconds: 2
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 20
            timeoutSeconds: 2
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
