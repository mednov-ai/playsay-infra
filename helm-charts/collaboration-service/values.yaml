image:
  repository: ghcr.io/mednov-ai/playsay-collaboration-service
  tag: "0.1.0"
  digest: ""
  pullPolicy: IfNotPresent

imagePullSecrets: []

build:
  name: local-0
  number: "0"
  branch: local
  branchLabel: local
  commit: unknown
  commitShort: unknown

replicaCount: 1

service:
  type: ClusterIP
  port: 80
  targetPort: 8081
  nodePort: null

auth:
  keycloakJwksUrl: http://keycloak.keycloak.svc.cluster.local/keycloak/realms/playsay/protocol/openid-connect/certs

apiGateway:
  baseUrl: http://api-gateway.playsay-dev.svc.cluster.local

collaboration:
  existingSecret: playsay-collaboration
  gameRealtimeMode: off
  tokenSecretKey: token-secret
  serviceTokenKey: service-token
  snapshotIntervalMs: "10000"
  websocket:
    softLimitBytes: "1048576"
    hardLimitBytes: "4194304"
    maxPayloadBytes: "4194304"

runtime:
  nodeOptions: "--max-old-space-size=512"

resources:
  requests:
    cpu: 50m
    memory: 96Mi
  limits:
    cpu: 500m
    memory: 256Mi
