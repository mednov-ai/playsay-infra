image:
  repository: ghcr.io/mednov-ai/playsay-vocabulary-service
  tag: "vocabulary-dev-6"
imagePullSecrets:
  - name: ghcr-pull-secret
build: {name: vocabulary-dev-6, number: "6", branch: develop, branchLabel: vocabulary-dev, commit: 06a2d89dc434a44905c9e5d52f09154e511e13a9, commitShort: 06a2d89dc434}
service: {type: ClusterIP}
updateStrategy:
  type: RollingUpdate
  rollingUpdate: {maxSurge: 0, maxUnavailable: 1}
auth:
  issuerUri: https://ops.play-and-say.ru:18443/keycloak/realms/playsay
  jwkSetUri: http://keycloak.keycloak.svc.cluster.local/keycloak/realms/playsay/protocol/openid-connect/certs
database:
  existingSecret: playsay-app-db
  liquibaseEnabled: "true"
  hikariMaxPoolSize: "3"
openai:
  enabled: true
  existingSecret: playsay-openai
  apiKeyKey: api-key
  baseUrl: https://api.openai.com/v1
  model: gpt-5-mini
runtime:
  javaToolOptions: "-XX:InitialRAMPercentage=25 -XX:MaxRAMPercentage=55 -XX:+UseStringDeduplication -Djava.security.egd=file:/dev/urandom"
resources:
  requests: {cpu: 25m, memory: 96Mi}
  limits: {cpu: 500m, memory: 384Mi}
