apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "vocabulary-service.fullname" . }}
  labels: {{- include "vocabulary-service.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  strategy: {{- toYaml .Values.updateStrategy | nindent 4 }}
  selector:
    matchLabels: {{- include "vocabulary-service.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "vocabulary-service.selectorLabels" . | nindent 8 }}
        playsay.io/build-name: {{ .Values.build.name | quote }}
        playsay.io/source-commit: {{ .Values.build.commitShort | quote }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets: {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: vocabulary-service
          image: "{{ .Values.image.repository }}{{ if .Values.image.digest }}@{{ .Values.image.digest }}{{ else }}:{{ .Values.image.tag }}{{ end }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - { name: http, containerPort: 8088 }
          env:
            - { name: SERVER_PORT, value: "8088" }
            - { name: SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_ISSUER_URI, value: {{ .Values.auth.issuerUri | quote }} }
            - { name: SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_JWK_SET_URI, value: {{ .Values.auth.jwkSetUri | quote }} }
            - name: PLAYSAY_DB_JDBC_URL
              valueFrom: { secretKeyRef: { name: {{ .Values.database.existingSecret | quote }}, key: {{ .Values.database.jdbcUriKey | quote }} } }
            - name: PLAYSAY_DB_USERNAME
              valueFrom: { secretKeyRef: { name: {{ .Values.database.existingSecret | quote }}, key: {{ .Values.database.usernameKey | quote }} } }
            - name: PLAYSAY_DB_PASSWORD
              valueFrom: { secretKeyRef: { name: {{ .Values.database.existingSecret | quote }}, key: {{ .Values.database.passwordKey | quote }} } }
            - { name: PLAYSAY_VOCABULARY_LIQUIBASE_ENABLED, value: {{ .Values.database.liquibaseEnabled | quote }} }
            - { name: SPRING_DATASOURCE_HIKARI_MAXIMUM_POOL_SIZE, value: {{ .Values.database.hikariMaxPoolSize | quote }} }
            - { name: PLAYSAY_WEBSOCKET_ALLOWED_ORIGIN_PATTERNS, value: {{ .Values.websocket.allowedOriginPatterns | quote }} }
            - { name: PLAYSAY_VOCABULARY_OPENAI_BASE_URL, value: {{ .Values.openai.baseUrl | quote }} }
            - { name: PLAYSAY_API_GATEWAY_SERVICE_BASE_URL, value: {{ .Values.assignmentIntegration.gatewayBaseUrl | quote }} }
            - name: PLAYSAY_USER_DATA_SERVICE_TOKEN
              valueFrom: { secretKeyRef: { name: {{ .Values.userData.existingSecret | quote }}, key: {{ .Values.userData.serviceTokenKey | quote }} } }
            {{- if .Values.openai.enabled }}
            - name: PLAYSAY_VOCABULARY_OPENAI_API_KEY
              valueFrom: { secretKeyRef: { name: {{ .Values.openai.existingSecret | quote }}, key: {{ .Values.openai.apiKeyKey | quote }} } }
            {{- end }}
            - { name: PLAYSAY_VOCABULARY_OPENAI_MODEL, value: {{ .Values.openai.model | quote }} }
            - { name: PLAYSAY_VOCABULARY_OPENAI_REASONING_EFFORT, value: {{ .Values.openai.reasoningEffort | quote }} }
            - { name: PLAYSAY_VOCABULARY_COMPOSER_ENABLED, value: {{ .Values.features.composerEnabled | quote }} }
            - { name: PLAYSAY_VOCABULARY_ADAPTIVE_POLICY_ENABLED, value: {{ .Values.features.adaptivePolicyEnabled | quote }} }
            - { name: PLAYSAY_VOCABULARY_DELIVERY_POLICIES_ENABLED, value: {{ .Values.features.deliveryPoliciesEnabled | quote }} }
            - { name: PLAYSAY_VOCABULARY_KEY_NGRAMS_ENABLED, value: {{ .Values.features.keyNgramsEnabled | quote }} }
            - { name: PLAYSAY_VOCABULARY_GENERATED_MEDIA_ENABLED, value: {{ .Values.features.generatedMediaEnabled | quote }} }
            - { name: PLAYSAY_VOCABULARY_LEXICAL_BACKFILL_ENABLED, value: {{ .Values.features.lexicalBackfillEnabled | quote }} }
            - { name: PLAYSAY_VOCABULARY_MEDIA_GENERATOR, value: {{ .Values.media.generator | quote }} }
            - { name: PLAYSAY_VOCABULARY_MEDIA_BASE_URL, value: {{ .Values.media.baseUrl | quote }} }
            - { name: PLAYSAY_VOCABULARY_MEDIA_MODEL, value: {{ .Values.media.model | quote }} }
            - { name: PLAYSAY_VOCABULARY_MEDIA_GENERATION_WORKER_MS, value: {{ .Values.media.generationWorkerMs | quote }} }
            - { name: PLAYSAY_VOCABULARY_MEDIA_REGENERATION_LIMIT_PER_HOUR, value: {{ .Values.media.regenerationLimitPerHour | quote }} }
            - { name: PLAYSAY_VOCABULARY_RECONCILIATION_MS, value: {{ .Values.media.reconciliationMs | quote }} }
            {{- if eq .Values.media.generator "openai" }}
            - name: PLAYSAY_VOCABULARY_MEDIA_API_KEY
              valueFrom: { secretKeyRef: { name: {{ .Values.media.existingSecret | quote }}, key: {{ .Values.media.apiKeyKey | quote }} } }
            {{- end }}
            - { name: PLAYSAY_VOCABULARY_MEDIA_STORAGE_PROVIDER, value: {{ .Values.media.storage.provider | quote }} }
            {{- if eq .Values.media.storage.provider "s3" }}
            - { name: PLAYSAY_VOCABULARY_MEDIA_S3_ENDPOINT, value: {{ .Values.media.storage.endpoint | quote }} }
            - { name: PLAYSAY_VOCABULARY_MEDIA_S3_REGION, value: {{ .Values.media.storage.region | quote }} }
            - { name: PLAYSAY_VOCABULARY_MEDIA_S3_BUCKET, value: {{ .Values.media.storage.bucket | quote }} }
            - name: PLAYSAY_VOCABULARY_MEDIA_S3_ACCESS_KEY
              valueFrom: { secretKeyRef: { name: {{ .Values.media.storage.existingSecret | quote }}, key: {{ .Values.media.storage.accessKeyKey | quote }} } }
            - name: PLAYSAY_VOCABULARY_MEDIA_S3_SECRET_KEY
              valueFrom: { secretKeyRef: { name: {{ .Values.media.storage.existingSecret | quote }}, key: {{ .Values.media.storage.secretKeyKey | quote }} } }
            - { name: PLAYSAY_VOCABULARY_MEDIA_S3_CREATE_BUCKET, value: {{ .Values.media.storage.createBucket | quote }} }
            {{- end }}
            {{- if .Values.runtime.javaToolOptions }}
            - { name: JAVA_TOOL_OPTIONS, value: {{ .Values.runtime.javaToolOptions | quote }} }
            {{- end }}
          startupProbe: { httpGet: { path: /actuator/health/liveness, port: http }, failureThreshold: 24, periodSeconds: 10, timeoutSeconds: 5 }
          readinessProbe: { httpGet: { path: /actuator/health/readiness, port: http }, periodSeconds: 10, timeoutSeconds: 5 }
          livenessProbe: { httpGet: { path: /actuator/health/liveness, port: http }, failureThreshold: 6, periodSeconds: 20, timeoutSeconds: 5 }
          resources: {{- toYaml .Values.resources | nindent 12 }}
