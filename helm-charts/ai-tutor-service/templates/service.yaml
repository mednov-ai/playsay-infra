apiVersion: v1
kind: Service
metadata:
  name: {{ include "ai-tutor-service.fullname" . }}
  labels: {{- include "ai-tutor-service.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: http
  selector: {{- include "ai-tutor-service.selectorLabels" . | nindent 4 }}
