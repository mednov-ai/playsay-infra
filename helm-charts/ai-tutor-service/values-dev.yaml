image:
  repository: ghcr.io/mednov-ai/playsay-ai-tutor-service
  tag: "ai-tutor-dev-4"
imagePullSecrets:
  - name: ghcr-pull-secret
build: {name: ai-tutor-dev-4, number: "4", branch: develop, branchLabel: ai-tutor-dev, commit: "137a713a792ba225437e2add52670fcb71a8b724", commitShort: "137a713a792b"}
service: {type: ClusterIP}
auth:
