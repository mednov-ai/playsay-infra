image:
  repository: ghcr.io/mednov-ai/playsay-ai-tutor-service
  tag: "ai-tutor-dev-12"
imagePullSecrets:
  - name: ghcr-pull-secret
build: {name: ai-tutor-dev-12, number: "12", branch: develop, branchLabel: ai-tutor-dev, commit: fd1fdfb5fd7bcc4360fc66a1c20a34373fd75e7c, commitShort: fd1fdfb5fd7b}
service: {type: ClusterIP}
auth:
  issuerUri: https://ops.play-and-say.ru:18443/keycloak/realms/playsay
  jwkSetUri: http://keycloak.keycloak.svc.cluster.local/keycloak/realms/playsay/protocol/openid-connect/certs
database:
  existingSecret: playsay-app-db
  liquibaseEnabled: "true"
  hikariMaxPoolSize: "3"
openai:
  enabled: true
  existingSecret: playsay-openai
  apiKeyKey: api-key
  baseUrl: https://api.openai.com/v1
  realtimeModel: gpt-realtime-2.1
runtime:
  javaToolOptions: "-XX:InitialRAMPercentage=25 -XX:MaxRAMPercentage=65 -Djava.security.egd=file:/dev/urandom"
