image:
  repository: ghcr.io/mednov-ai/playsay-registration-service
  tag: "registration-release-1.001.00-29"
imagePullSecrets:
  - name: ghcr-pull-secret
build:
  name: registration-release-1.001.00-29
  number: "29"
  branch: release/1.001.00
  branchLabel: registration-release-1.001.00
  commit: 92406096f13b2451086d39021f8febfab855dbdc
  commitShort: "92406096f13b"
updateStrategy:
  type: RollingUpdate
  rollingUpdate:
    maxSurge: 0
    maxUnavailable: 1
service:
  type: ClusterIP
database:
  existingSecret: playsay-app-db
  liquibaseEnabled: "false"
  hikariMaxPoolSize: "3"
registrationService:
