image:
  repository: ghcr.io/mednov-ai/playsay-registration-service
  tag: "0.1.0"
  digest: ""
  pullPolicy: IfNotPresent

imagePullSecrets: []

build:
  name: local-0
  number: "0"
  branch: local
  branchLabel: local
  commit: unknown
  commitShort: unknown

replicaCount: 1

service:
  type: ClusterIP
  port: 80
  targetPort: 8085
  nodePort: null

database:
  existingSecret: playsay-app-db
  jdbcUriKey: jdbc-uri
  usernameKey: username
  passwordKey: password
  liquibaseEnabled: "false"
  hikariMaxPoolSize: ""

registrationService:
  publicBaseUrl: https://online.honey.school
  internalApi:
    existingSecret: playsay-registration
    serviceTokenKey: service-token
  tokenTtlHours: "24"
  resendCooldownSeconds: "300"
  rateLimit:
    windowSeconds: "3600"
    maxPerEmail: "20"
    maxPerIp: "30"
  keycloak:
    baseUrl: http://keycloak.keycloak.svc.cluster.local/keycloak
    realm: playsay
    studentTokenClientId: playsay-web
    existingSecret: playsay-registration
    clientIdKey: keycloak-client-id
    clientSecretKey: keycloak-client-secret
  emailService:
    baseUrl: http://email-service.playsay-dev.svc.cluster.local
    existingSecret: playsay-email
    serviceTokenKey: service-token

runtime:
  javaToolOptions: ""

resources:
  requests:
    cpu: 100m
    memory: 192Mi
  limits:
    cpu: "1"
    memory: 512Mi
